summary = '''
A process's memory on the Metrics page is its whole memory (`memory_avg`, `memory_peak` in
`samples`): itself and, for a worker, its fork servers, wait step hosts and running tasks, so a
worker's line shows its tasks. Each deployment also has a stacked chart of its memory by kind
(masters and webservers, workers, fork servers, wait step hosts, tasks), its legend giving each
kind's memory now; the table splits a process into Now, Itself and Tasks, and a row's panel
stacks its parts. Rollups keep the parts' averages, so every range splits. CPU stays the
processes' own (a task's CPU isn't sampled).
'''
