section = "TriggerDagOperator"
summary = '''
A DAG's runs come one way: its own trigger, or other DAGs' TriggerDagOperators, which start only a
DAG with `trigger=Chained()` (any DAG) or `Chained(by=[...])` (those named; `by=[]` is an error).
Any other target fails the task when it runs (`chained_target_refused`, not retried); a paused one
too, with retries. `schedr dags check` fails the operator's file when its target in the root
refuses it; the master's parse doesn't. `trigger=None` means manual runs only: the UI greys out its
Pause. Manual runs stay allowed on every DAG, a fallback and for testing. `schedr dags test`
unpauses the `Chained` DAGs of the path tested.
'''
