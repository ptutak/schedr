title = "Watcher hosts stop when their last watcher ends"
date = 2026-11-06
by = "claude"
status = "active"
topic = "wait-steps"
section = "The watcher host"
summary = '''
A watcher host is spawned, never forked, and stops when its last watcher ends. Successful DAG
imports are reused within the host; failed imports are retried for the next attempt. Its working
folder is the worker log folder and its environment is the allow-list plus `pass_env`; wait steps
obtain run values from `dag_ctx` and `task_ctx` and use absolute paths.
'''
