section = "What a job says"
summary = '''
A worker missing a task cleanup’s interpreter or script rejects the task with rejection 3 or 5.
Cleanup scripts use their task’s environment and working directory. Moved or recovered cleanups
require only what the cleanup runs, so absence of the original task’s interpreter does not exclude a
worker.
'''
