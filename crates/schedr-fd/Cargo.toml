[package]
name = "schedr-fd"
description = "The one place schedr touches a raw descriptor: a task's inherited context channel (decision 147)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rustix.workspace = true
thiserror.workspace = true

# The workspace's lints, but `unsafe_code` denied instead of forbidden: the one `unsafe` block
# here is allowed by an `#[expect]` at its site (decision 147). Keep the rest in step with the
# workspace's.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
pretty_assertions.workspace = true
