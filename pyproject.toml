[project]
name = "schedr"
# The version comes from the Cargo workspace: the binary and the Python package always share
# one version number.
dynamic = ["version"]
description = "schedr scheduler: Python DAG API (native and Airflow look-alike) plus the schedr binary."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
# The binary's crates' licences beside schedr's own (scripts/third_party.py writes it).
license-files = ["LICENSE", "LICENSE-THIRD-PARTY"]
authors = [{ name = "Piotr Tutak", email = "p.tutak@outlook.com" }]
classifiers = [
    # A preview until 1.0.0 (decision 156): no upgrade path between 0.x versions.
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.optional-dependencies]
# Pydantic models as outputs and inputs (decision 59): schedr itself never imports Pydantic.
# 2.11 brought `model_validate(..., by_name=True)`; 3.0 may change the v2 API.
pydantic = ["pydantic>=2.11,<3"]
# The typed connections' clients (decision 174), each imported only when one is opened.
# httpx 0.28 is the API both modes share; 1.0 is still in development.
http = ["httpx>=0.28,<1"]
# 4.10 brought AsyncMongoClient (async with M4.10).
mongo = ["pymongo>=4.10,<5"]
# 5.0 dropped DSA keys; its key and host-key APIs are the ones used.
ssh = ["paramiko>=5.0,<6"]
# psycopg 3 with its own libpq build (the binary package), so no system libpq is needed.
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["pymysql[rsa]>=1.1,<2"]  # rsa: cryptography, for SHA-2 password auth without TLS
# A faster event loop for async tasks and watchers: used whenever it can be imported, however
# it was installed; this extra is one way to install it (decision 316).
uvloop = ["uvloop>=0.23,<1"]
# Every connection type's client at once (what the base image has).
connections = ["schedr[http,mongo,ssh,postgres,mysql]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyyaml==6.0.3",
    "jsonschema>=4.25",
    # Type-checks DAG code as an editor does (`make lint`, over examples/; decision 57).
    "basedpyright==1.40.2",
    # Tests `schedr.pydantic.Model` and Pydantic outcome unions; never a runtime dependency.
    "pydantic==2.14.2",
    # The `uvloop` extra's loop, for the tests running on it.
    "uvloop==0.23.0",
    # The typed connections' clients (the extras above), for their tests and type checks.
    "httpx==0.28.1",
    "pymongo==4.19.0",
    "paramiko==5.1.0",
    "psycopg[binary]==3.3.6",
    "pymysql==1.2.3",
    # Their type stubs (neither ships its own); the newest at least two weeks old.
    "types-paramiko==5.0.0.20261006",
    "types-PyMySQL==1.2.0.20260923",
]
# The web UI's browser tests (`make test-ui`, decision 27A); not in `uv sync`'s default.
ui-test = [
    "playwright==1.64.0",
    "pytest-playwright==0.10.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
    "sphinxcontrib-mermaid>=2.1.1",
]

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

# --- maturin ------------------------------------------------------------
# The wheel contains the `schedr` Rust binary plus the pure-Python package (as ruff and uv
# ship), so `pip install schedr` gives both the API and `schedr standalone`.
[tool.maturin]
bindings = "bin"
manifest-path = "crates/schedr/Cargo.toml"
python-source = "python"
python-packages = ["schedr"]
# The binary crate's library is named `schedr_bin`; the Python package is `schedr`.
module-name = "schedr"

# --- uv -----------------------------------------------------------------
# Rebuild the (editable) project install when Rust code changes, not only Python metadata.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["python"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "C4",       # comprehensions
    "PL",       # pylint
    "D",        # pydocstyle: docstrings on public names (Google convention, below)
]

[tool.ruff.lint.pylint]
# The public API takes many keyword-only options (Dag, operators, @task), as designed.
max-args = 14

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = ["PLR2004", "D"]
# The pin checker walks YAML and requirements; each branch is a case it rejects.
"scripts/check-action-pins.py" = ["PLR0912"]
# Example DAGs are user code: docstrings on their tasks are up to the author.
"examples/**" = ["D103"]
"examples/**/test_*.py" = ["PLR2004", "D"]

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "python"
packages = ["schedr"]

# --- basedpyright ---------------------------------------------------------
# DAG code as an editor reads it (decision 57): the examples and the typing checks, in
# basedpyright's default (strictest) mode. Off: what DAG code does on purpose.
[tool.basedpyright]
include = ["examples", "python/tests/typing"]
# The DAG files only: the examples' own tests are pytest code.
exclude = ["examples/**/test_*.py", "examples/**/conftest.py"]
extraPaths = ["python"]
pythonVersion = "3.14"
failOnWarnings = true
# `a >> b` and `CommandOperator(...)` are statements: they record a dependency or a task.
reportUnusedExpression = false
reportUnusedCallResult = false

# An editor (Zed, VS Code) runs basedpyright on every file it opens, `make lint` only on the
# DAG code above. The typing checks keep the strict rules; the library and its tests are
# mypy's and ruff's, so there the rules basedpyright alone enforces are off (they flagged the
# library's wrapped messages, `Any` at JSON boundaries, ...): the editor shows what the CLI
# checks. The first root that holds a file applies.
[[tool.basedpyright.executionEnvironments]]
root = "python/tests/typing"
extraPaths = ["python"]

# The demo's DAG folder (examples/demo): its root on the path, as on a worker.
[[tool.basedpyright.executionEnvironments]]
root = "examples/demo/dags"
extraPaths = ["python"]

# The greenhouse showcase's DAG folder, the same way.
[[tool.basedpyright.executionEnvironments]]
root = "examples/showcase/dags"
extraPaths = ["python"]

[[tool.basedpyright.executionEnvironments]]
root = "python"
reportAny = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportDeprecated = false
reportExplicitAny = false
reportGeneralTypeIssues = false
reportImplicitOverride = false
reportImplicitStringConcatenation = false
reportImportCycles = false
reportIncompatibleMethodOverride = false
reportMatchNotExhaustive = false
reportOperatorIssue = false
reportOptionalMemberAccess = false
reportPossiblyUnboundVariable = false
reportPrivateLocalImportUsage = false
reportPrivateUsage = false
reportReturnType = false
reportUnannotatedClassAttribute = false
reportUndefinedVariable = false
reportUninitializedInstanceVariable = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnnecessaryComparison = false
reportUnnecessaryContains = false
reportUnnecessaryIsInstance = false
reportUnreachable = false
reportUnusedClass = false
reportUnusedParameter = false

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
# python/tests/ui needs the `ui-test` group and a browser: `make test-ui` runs it.
testpaths = ["python/tests/unit", "python/tests/integration"]
pythonpath = ["python"]
# importlib: test files with the same name in different folders don't clash, and test folders
# need no __init__.py (see archive/PROJECT.md, Repository and tooling: Testing).
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = ["integration: tests that spawn processes or touch the filesystem"]
# Tests and examples write outcome classes as type checkers read them (decision 57); a test
# about a plain class expects the hint with `pytest.warns`. Matched by its message (a
# `TypingHint` is a `UserWarning`): naming the class would import schedr before coverage
# starts. `.` stands for the `:` the filter syntax can't hold.
filterwarnings = ["error:task [^ ]+. outcome class:UserWarning"]

[tool.coverage.run]
# Forked processes (the fork server's shims and children, in tests) save their data.
patch = ["_exit", "fork", "subprocess"]
parallel = true
source = ["schedr"]
branch = true
# `python -m` entry points only call into tested code (like Rust's main.rs).
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
