{{- if .Values.serviceAccount.create }}
{{- $names := list (include "schedr.serviceAccountName" .) }}
{{- if eq .Values.mode "distributed" }}
{{- $names = list }}
{{- $roles := list "master" "webserver" "worker" }}
{{- if include "schedr.uiDeployed" . }}{{ $roles = append $roles "ui" }}{{ end }}
{{- range $role := $roles }}
{{- if not (index $.Values $role).serviceAccountName }}
{{- $names = append $names (include "schedr.roleServiceAccount" (list $ $role)) }}
{{- end }}
{{- end }}
{{- end }}
{{- range uniq $names }}
---
# Holds no permissions: schedr never calls the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  labels:
    {{- include "schedr.labels" $ | nindent 4 }}
automountServiceAccountToken: {{ $.Values.serviceAccount.automountToken }}
{{- end }}
{{- end }}
