title = "a finished task stays `scheduled` on the UI long after it ended"
severity = "medium"
probability = "likely"
kind = "usability"
summary = "a finished task shown `scheduled` for up to ~15 s; seen by the user (the cause suspected)"
found = 2026-10-28
