title = "the Python runner reads a task's stored forms (references, inputs, run) as `Mapping[str, Any]`"
severity = "low"  # critical, high, medium, low
probability = "possible"  # likely, possible, rare
kind = "correctness"  # security, data, correctness, reliability, performance, usability, tests
summary = "`schedr.runner.task` interprets a task's stored forms (`resolve`, `render`, `build`, `mapped_arguments`, `run_values`, the request's `task` and `run`) through `Mapping[str, Any]` and `Any` results, against the rule to avoid `Any`: a field of the wrong type in what the agent sends passes the type checkers and fails as a `KeyError` or `TypeError` deep in the build, not as a `ProtocolError` naming the field"
found = 2026-11-24
suspected = false
details = '''
- **Found:** 2026-11-24, by Claude fixing B276, which typed the channel (`Wire`, `Message`), the
  extension helper, the watcher host's reader, the fork server's request and the parse request,
  and narrowed the answers `task.py` reads (`secret`, `connection`, `api_answer`). The stored
  forms were left: about 80 `Any` in `task.py`, and the run mapping isn't plain JSON (its
  `$secrets` entry has tuple keys).
- **A fix:** typed stored forms (a `Reference`, a `StoredValue` and the run information as
  dataclasses or TypedDicts) read once from the request with the `_protocol` narrowing helpers;
  the fetched secrets kept beside the run, not inside it; `build` returning `object`.
'''
