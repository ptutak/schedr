summary = '''
A field is secret when its name contains a secret word or its default or a choice contains a secret. It
uses an empty password input, with defaults and choices withheld from the browser. Its default is excluded
from the form fingerprint; leaving the input empty sends nothing, so the master supplies the current
default.
