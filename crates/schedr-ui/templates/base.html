<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}schedr{% endblock %}</title>
<link rel="stylesheet" href="{{ page.base }}/assets/style.css">
<!-- htmx swaps error answers in too (a panel that can't be shown says why); 204: nothing. -->
<meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "...", "swap": true}]}'>
<script src="{{ page.base }}/assets/htmx-2.0.11.min.js" defer></script>
<script>
// Before the page paints: the theme (the one chosen here before, else the system's), and the
// browser's time zone in a cookie for the server, which shows times in UTC and in this zone.
(function () {
  var theme = null;
  try { theme = localStorage.getItem("schedr-theme"); } catch (e) {}
  if (theme !== "light" && theme !== "dark") {
    theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.dataset.theme = theme;
  var zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (zone && document.cookie.indexOf("schedr_tz=" + encodeURIComponent(zone)) < 0) {
    document.cookie = "schedr_tz=" + encodeURIComponent(zone) + "; path=/; max-age=31536000; samesite=lax";
    {% if !page.has_zone() %}
    // Once, so this page shows local times too (not again if the cookie can't be set).
    try {
      if (!sessionStorage.getItem("schedr-tz-reloaded")) {
        sessionStorage.setItem("schedr-tz-reloaded", "1");
        location.reload();
      }
    } catch (e) {}
    {% endif %}
  }
})();
// An action's key (B140), sent as `Idempotency-Key`: made when its dialog first opens, and
// kept for that action (its URL) in this tab until an answer says whether the command arrived.
// Sent again (the dialog reopened, the page refreshed or reloaded) after no answer came, it is
// the command stored then, if it was: never a second run.
function schedrKeyName(form) { return "schedr-key:" + form.getAttribute("hx-post"); }
function schedrOpen(button) {
  var dialog = button.nextElementSibling;
  var form = dialog.querySelector("form");
  var key = form.dataset.key || null;
  try { key = key || sessionStorage.getItem(schedrKeyName(form)); } catch (e) {}
  if (!key) {
    key = Array.from(crypto.getRandomValues(new Uint8Array(16)), function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
    try { sessionStorage.setItem(schedrKeyName(form), key); } catch (e) {}
  }
  form.dataset.key = key;
  form.setAttribute("hx-headers", JSON.stringify({"Idempotency-Key": key}));
  dialog.showModal();
}
// Only the UI's own definite answer drops the key (its header): not "may have arrived", nor
// a proxy's error page, which htmx swaps in like any answer.
function schedrAnswered(form, event) {
  if (event.detail.elt !== form) return;
  var xhr = event.detail.xhr;
  if (xhr && xhr.getResponseHeader("Schedr-Command-Answer") === "definite") {
    delete form.dataset.key;
    try { sessionStorage.removeItem(schedrKeyName(form)); } catch (e) {}
  }
  form.closest("dialog").close();
}
// Live pages (decision 175). A browser opens at most six HTTP/1.1 connections to a host,
// across its tabs, and a stream holds one for as long as it is open (B31, B32). So a browser
// holds one stream, in a SharedWorker its live pages share (`assets/live.js`), handing each
// change to every page, which reads its live parts again for those that concern it, at most
// once a second. Without SharedWorker (e.g. Chrome on Android) each page holds its own stream,
// given back after a while hidden (B25; shown again, the page reloads: its state is in its
// URL; not while an action's dialog is open).
var schedrHiddenClose = 10000;
(function () {
  var LIVE = '[hx-trigger^="live:change"]';
  var page = null;
  var last = 0;
  var timer = null;
  var heard = Date.now();
  function wants(change) {
    var only = function (name, value) { return !page[name] || page[name] === value; };
    var kind = function (name) { return !page.kinds || page.kinds.split(",").indexOf(name) >= 0; };
    // A refresh without a deployment is the worker's own (its stream dropped): every page's.
    if (change.kind === "refresh") return !change.deployment || only("deployment", change.deployment);
    if (!only("deployment", change.deployment)) return false;
    switch (change.kind) {
      case "run": return kind("run") && only("run", change.run) && only("dag", change.dag);
      case "dag": return kind("dag") && !page.run && only("dag", change.dag);
      case "workers": return kind("workers") && !page.run && !page.dag;
      default: return false;
    }
  }
  function read() {
    document.querySelectorAll(LIVE).forEach(function (part) { htmx.trigger(part, "live:change"); });
  }
  // At most once a second; a change in between read when that second is up.
  function changed() {
    var wait = last + 1000 - Date.now();
    if (wait <= 0) {
      last = Date.now();
      read();
    } else if (timer === null) {
      timer = setTimeout(function () { timer = null; last = Date.now(); read(); }, wait);
    }
  }
  function receive(message) {
    heard = Date.now();
    if (message.type === "change" && wants(message.change)) changed();
  }
  function alone(base) {
    var source = new EventSource(base + "/events?since=" + page.since, { withCredentials: true });
    var hidden = null;
    var closed = false;
    source.addEventListener("change", function (event) {
      receive({ type: "change", change: JSON.parse(event.data) });
    });
    source.addEventListener("ping", function () { heard = Date.now(); });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        hidden = setTimeout(function () {
          if (schedrDialogOpen() || closed) return;
          source.close();
          closed = true;
        }, schedrHiddenClose);
        return;
      }
      clearTimeout(hidden);
      if (closed) location.reload();
    });
  }
  document.addEventListener("DOMContentLoaded", function () {
    var events = document.body.dataset.events;
    if (!events) return;
    var url = new URL(events, location.href);
    page = {};
    url.searchParams.forEach(function (value, name) { page[name] = value; });
    var base = url.pathname.replace(/\/events$/, "");
    if (typeof SharedWorker === "undefined") {
      alone(base);
      return;
    }
    var port = null;
    function connect(since) {
      try {
        port = new SharedWorker(base + "/assets/live.js", { name: "schedr-live" }).port;
      } catch (e) {
        alone(base);
        return;
      }
      port.onmessage = function (event) {
        if (event.data.type === "alone") alone(base);
        else receive(event.data);
      };
      port.start();
      port.postMessage({ since: since });
    }
    connect(Number(page.since) || 0);
    // Still here: the worker lets go of a page silent for 3 minutes (one that crashed).
    setInterval(function () {
      if (port) port.postMessage({ alive: true });
    }, 30000);
    window.addEventListener("pagehide", function () {
      if (port) port.postMessage({ bye: true });
    });
    window.addEventListener("pageshow", function (event) {
      // Back from the back-forward cache (its worker may have ended meanwhile): joined again,
      // as a page made long ago, so its live parts are read at once.
      if (event.persisted && port) connect(0);
    });
  });
  // A stream held back by a proxy that buffers it: when nothing (not even a ping, every 15 s)
  // has come for 30 s, the live parts are read every 5 s.
  setInterval(function () {
    if (page && Date.now() - heard >= 30000) read();
  }, 5000);
})();
// A log's next part not read (the UI didn't answer, or answered with an error: a proxy's 502
// while the UI restarts, a lapsed sign-in's 401): kept, and read again a second later.
document.addEventListener("htmx:sendError", function (event) {
  var elt = event.detail && event.detail.elt;
  if (elt && elt.matches && elt.matches(".log-tail")) htmx.trigger(elt, "retry");
});
document.addEventListener("htmx:beforeSwap", function (event) {
  var elt = event.detail.requestConfig && event.detail.requestConfig.elt;
  var status = event.detail.xhr ? event.detail.xhr.status : 0;
  if (!elt || !elt.matches || !elt.matches(".log-tail") || status < 400) return;
  event.detail.shouldSwap = false;
  htmx.trigger(elt, "retry");
});
// While an action's dialog is open the live parts aren't read again (it would be swapped away
// under the user); once it closes they are, for what changed meanwhile.
function schedrDialogOpen() {
  return document.querySelector("dialog[open]") !== null;
}
// A live read already under way when a dialog opened isn't applied either: the part is read
// once the dialog closes (below).
document.addEventListener("htmx:beforeSwap", function (event) {
  var elt = event.detail.requestConfig && event.detail.requestConfig.elt;
  if (schedrDialogOpen() && elt && elt.matches && elt.matches('[hx-trigger^="live:change"]')) {
    event.detail.shouldSwap = false;
  }
});
document.addEventListener("close", function (event) {
  if (!event.target.matches || !event.target.matches("dialog.confirm")) return;
  document.querySelectorAll('[hx-trigger^="live:change"]').forEach(function (part) {
    htmx.trigger(part, "live:change");
  });
}, true);
// A live part read again. A change during that read is owed: read once the read is done (its
// swap replaces the part, and htmx's queue with it, B141; the task panel drops it, B142). A
// read that fails leaves the part as it was, saying so, and the next change reads it again
// (an error page swapped in would have removed the part, B143).
(function () {
  var LIVE = '[hx-trigger^="live:change"]';
  var reading = {};
  var owed = {};
  // Each read by its request: once its swap has replaced the part, its events no longer
  // name it.
  var reads = new WeakMap();
  function liveElt(event) {
    var elt = event.detail && (event.detail.elt || (event.detail.requestConfig && event.detail.requestConfig.elt));
    return elt && elt.matches && elt.matches(LIVE) ? elt : null;
  }
  function key(elt) {
    var holder = elt.id ? elt : elt.closest("[id]");
    return holder ? holder.id : "";
  }
  function part(name) {
    var holder = document.getElementById(name);
    if (!holder) return null;
    return holder.matches(LIVE) ? holder : holder.querySelector(LIVE);
  }
  function stale(elt, why) {
    var note = elt.querySelector(":scope > .live-stale");
    if (!note) {
      note = document.createElement("p");
      note.className = "banner warning live-stale";
      elt.prepend(note);
    }
    note.textContent = "Not up to date: reading it again failed (" + why + "). It is read again with the next change.";
  }
  document.addEventListener("live:change", function (event) {
    var elt = event.target;
    if (elt.matches && elt.matches(LIVE) && reading[key(elt)]) owed[key(elt)] = true;
  }, true);
  document.addEventListener("htmx:beforeRequest", function (event) {
    var elt = liveElt(event);
    if (!elt || !event.detail.xhr) return;
    reading[key(elt)] = true;
    reads.set(event.detail.xhr, { name: key(elt), elt: elt });
  });
  document.addEventListener("htmx:beforeSwap", function (event) {
    var elt = liveElt(event);
    var status = event.detail.xhr ? event.detail.xhr.status : 0;
    if (!elt || status < 400) return;
    event.detail.shouldSwap = false;
    stale(elt, "HTTP " + status);
  });
  document.addEventListener("htmx:sendError", function (event) {
    var elt = liveElt(event);
    if (elt) stale(elt, "the UI didn't answer");
  });
  document.addEventListener("htmx:afterRequest", function (event) {
    var read = event.detail.xhr && reads.get(event.detail.xhr);
    if (!read) return;
    reads.delete(event.detail.xhr);
    reading[read.name] = false;
    if (!owed[read.name]) return;
    owed[read.name] = false;
    var now = part(read.name);
    if (now === read.elt) {
      // Not replaced (the read failed): read again at once.
      setTimeout(function () { htmx.trigger(now, "live:change"); }, 0);
    } else {
      // Replaced: once the new part is set up (htmx does that as it settles).
      settling[read.name] = true;
    }
  });
  var settling = {};
  document.addEventListener("htmx:afterSettle", function () {
    Object.keys(settling).forEach(function (name) {
      var again = part(name);
      delete settling[name];
      if (again) setTimeout(function () { htmx.trigger(again, "live:change"); }, 0);
    });
  });
})();
function schedrTheme() {
  var root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("schedr-theme", root.dataset.theme); } catch (e) {}
}
</script>
</head>
<body{% if page.is_live() %} data-events="{{ page.events }}"{% endif %}>
<header class="top">
  <a class="brand" href="{{ page.base }}/">schedr</a>
  <nav>
    <a href="{{ page.base }}/">DAGs</a>
    <a href="{{ page.base }}/runs">Runs</a>
    <a href="{{ page.base }}/deployments">Deployments</a>
    <a href="{{ page.base }}/workers">Workers</a>
    <a href="{{ page.base }}/import-errors">Import errors <span hx-get="{{ page.base }}/import-errors/count" hx-trigger="load" hx-swap="outerHTML"></span></a>
    {% if page.docs %}<a href="{{ page.base }}/docs/">Docs</a>{% endif %}
  </nav>
  <button class="theme" type="button" onclick="schedrTheme()" aria-label="Switch between light and dark">◐</button>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% if !page.has_zone() %}<footer class="note">Times in UTC (the local time zone isn't known yet).</footer>{% endif %}
</body>
</html>
