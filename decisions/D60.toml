title = "Pydantic dates interoperate with schedr date types"
date = 2026-10-29
by = "user"
status = "active"
topic = "serialization"
section = "Pydantic"
summary = '''
Pydantic date/datetime/duration text and schedr’s corresponding tagged types fit each other both
ways; the runner converts through Pydantic’s parsing and JSON validation. Plain strings do not fit
date types without the appropriate schema format. A model’s naive datetime stays naive when read,
but schedr refuses it when subsequently storing it as its own datetime, advising `AwareDatetime` or
an explicit zone.
'''
