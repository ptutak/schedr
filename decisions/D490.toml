summary = '''
`Started` carries the task's start in the master's time as the worker estimates it, the middle
of the round trip of its sample with the narrowest one (`started_master_ms`, `started_timeline`, protocol
2.1). On its own timeline the master records that as `started_at`, never before the assignment
nor after the message arrived, from the wall and master clocks read at one instant; otherwise (a 1.0.0 worker, no sample, another master's timeline)
its own time, as before. `schedr_master_start_recorded_seconds` times a start to its recording.
'''
