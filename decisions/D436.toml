summary = '''
`@task(memory="2GiB")` (and on operators: `CommandOperator(..., memory=...)`) replaces the worker's
default budget for that task; the watchdog kills it above. `hard_memory_limit=True` also sets the
hard cap at that size through `schedr task-exec` (D50). Not chosen: the engine's names
`memory_budget=`/`setrlimit=`.
