[project]
name = "schedr"
# The version comes from the Cargo workspace: the binary and the Python package always share
# one version number.
dynamic = ["version"]
description = "schedr scheduler: Python DAG API (native and Airflow look-alike) plus the schedr binary."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Piotr Tutak", email = "piotr.tutak@amartus.com" }]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.optional-dependencies]
# Pydantic models as outputs and inputs (decision 59): schedr itself never imports Pydantic.
# 2.11 brought `model_validate(..., by_name=True)`; 3.0 may change the v2 API.
pydantic = ["pydantic>=2.11,<3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyyaml==6.0.3",
    "jsonschema>=4.25",
    # Type-checks DAG code as an editor does (`make lint`, over examples/; decision 57).
    "basedpyright==1.40.2",
    # Tests `schedr.pydantic.Model` and Pydantic outcome unions; never a runtime dependency.
    "pydantic==2.14.1",
]
# The web UI's browser tests (`make test-ui`, decision 27A); not in `uv sync`'s default.
ui-test = [
    "playwright==1.64.0",
    "pytest-playwright==0.10.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
    "sphinxcontrib-mermaid>=2.1.1",
]

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

# --- maturin ------------------------------------------------------------
# The wheel contains the `schedr` Rust binary plus the pure-Python package (as ruff and uv
# ship), so `pip install schedr` gives both the API and `schedr standalone`.
[tool.maturin]
bindings = "bin"
manifest-path = "crates/schedr/Cargo.toml"
python-source = "python"
python-packages = ["schedr"]
# The binary crate's library is named `schedr_bin`; the Python package is `schedr`.
module-name = "schedr"

# --- uv -----------------------------------------------------------------
# Rebuild the (editable) project install when Rust code changes, not only Python metadata.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["python"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "C4",       # comprehensions
    "PL",       # pylint
    "D",        # pydocstyle: docstrings on public names (Google convention, below)
]

[tool.ruff.lint.pylint]
# The public API takes many keyword-only options (Dag, operators, @task), as designed.
max-args = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = ["PLR2004", "D"]
# The pin checker walks YAML and requirements; each branch is a case it rejects.
"scripts/check-action-pins.py" = ["PLR0912"]
# Example DAGs are user code: docstrings on their tasks are up to the author.
"examples/**" = ["D103"]
"examples/test_*.py" = ["PLR2004", "D"]

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "python"
packages = ["schedr"]

# --- basedpyright ---------------------------------------------------------
# DAG code as an editor reads it (decision 57): the examples and the typing checks, in
# basedpyright's default (strictest) mode. Off: what DAG code does on purpose.
[tool.basedpyright]
include = ["examples", "python/tests/typing"]
# The DAG files only: the examples' own tests are pytest code.
exclude = ["examples/**/test_*.py", "examples/**/conftest.py"]
extraPaths = ["python"]
pythonVersion = "3.14"
failOnWarnings = true
# `a >> b` and `CommandOperator(...)` are statements: they record a dependency or a task.
reportUnusedExpression = false
reportUnusedCallResult = false

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
# python/tests/ui needs the `ui-test` group and a browser: `make test-ui` runs it.
testpaths = ["python/tests/unit", "python/tests/integration"]
pythonpath = ["python"]
# importlib: test files with the same name in different folders don't clash, and test folders
# need no __init__.py (see PROJECT.md, Repository and tooling: Testing).
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = ["integration: tests that spawn processes or touch the filesystem"]
# Tests and examples write outcome classes as type checkers read them (decision 57); a test
# about a plain class expects the hint with `pytest.warns`. Matched by its message (a
# `TypingHint` is a `UserWarning`): naming the class would import schedr before coverage
# starts. `.` stands for the `:` the filter syntax can't hold.
filterwarnings = ["error:task [^ ]+. outcome class:UserWarning"]

[tool.coverage.run]
# Forked processes (the fork server's shims and children, in tests) save their data.
patch = ["_exit", "fork", "subprocess"]
parallel = true
source = ["schedr"]
branch = true
# `python -m` entry points only call into tested code (like Rust's main.rs).
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
