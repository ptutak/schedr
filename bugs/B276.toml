title = "the Python runner's and the extension helper's messages are typed `dict[str, Any]`"
severity = "low"  # critical, high, medium, low
probability = "possible"  # likely, possible, rare
kind = "correctness"  # security, data, correctness, reliability, performance, usability, tests
summary = "`schedr.runner.protocol.Channel` sends and receives `dict[str, Any]`, and `schedr.extension` (M5.2i, M5.2i5) builds and reads its messages the same way, against the rule to avoid `Any`: a message field of the wrong type passes the type checkers. `schedr.types.Json` doesn't fit as it is (it allows dates and dataclasses): replacing `Any` with it gave 78 mypy errors"
found = 2026-11-21
suspected = false
details = '''
- **Found:** 2026-11-21, by Claude in M5.2i5 piece 3, adding `ExtensionChannel.metric`.
- **A fix:** a wire JSON type (`str | int | float | bool | None | list[...] | dict[str, ...]`)
  for `Channel.send`/`receive`, and typed messages (TypedDicts) for each message the helper and
  the runner build, narrowed where they are read.
'''
