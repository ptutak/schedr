name: Release

# A pushed tag releases (decisions 153-163, archive/PROJECT.md: Packaging and releases):
#   vX.Y.Z     PyPI (environment `pypi`, approved by the maintainer), a GitHub Release, the
#              images tagged X.Y.Z and X.Y, the docs on GitHub Pages
#   vX.Y.ZrcN  the rehearsal: TestPyPI (environment `testpypi`), a GitHub pre-release, the
#              images tagged X.Y.ZrcN only
# The tag must name the version in Cargo.toml (`X.Y.Z` or `X.Y.Z-rcN`) and have a
# CHANGELOG.md section. All of CI runs on the tag first; its wheels are what is published.
on:
  push:
    tags: ["v*"]

permissions: {}

# `bash` named explicitly runs with `-eo pipefail` (the default shell has no pipefail): a
# failed command in a pipe fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      series: ${{ steps.check.outputs.series }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          python3 scripts/release.py check "$GITHUB_REF_NAME" > outputs
          cat outputs >> "$GITHUB_OUTPUT"
          cat outputs

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The four wheels CI built and smoke-tested, checked, summed and attested.
  dist:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/release.py wheels "$GITHUB_REF_NAME" dist
      - run: (cd dist && sha256sum *.whl) > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wheels
          path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sums
          path: SHA256SUMS

  # Trusted Publishing: no token; PyPI (or TestPyPI) trusts this workflow in this environment.
  publish:
    needs: [version, dist]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.version.outputs.prerelease == 'true' && 'testpypi' || 'pypi' }}
      url: ${{ needs.version.outputs.prerelease == 'true' && 'https://test.pypi.org/project/schedr/' || 'https://pypi.org/project/schedr/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ needs.version.outputs.prerelease == 'true' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true

  # The wheel as a user gets it: from the index, then PLAN.md's "M1 is done" on it.
  from-index:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INDEX: ${{ needs.version.outputs.prerelease == 'true' && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The index may take a few minutes to serve a new upload.
      - run: |
          for attempt in $(seq 1 20); do
            python -m pip download --disable-pip-version-check --no-deps --only-binary :all: \
              --index-url "$INDEX" --dest from-index "schedr==$VERSION" && exit 0
            echo "not on the index yet (attempt $attempt)"; sleep 30
          done
          exit 1
      - run: scripts/smoke-wheel.sh from-index/schedr-*.whl python

  # The images from the manylinux wheel (glibc) and the musllinux one (Alpine, `-alpine`;
  # decisions 157, 454), smoke-tested again, then pushed.
  images:
    needs: [version, from-index]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SERIES: ${{ needs.version.outputs.series }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-wheels
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site
      - run: scripts/docs-dist.sh site
      # Each on glibc (the plain tag) and on Alpine (`-alpine`), decision 454.
      - run: |
          source=org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY
          for image in schedr schedr-slim schedr-server; do
            for kind in "" .alpine; do
              docker build -f "images/$image/Dockerfile$kind" --label "$source" \
                --label org.opencontainers.image.version="$VERSION" -t "$image:release$kind" .
            done
          done
      - run: |
          for kind in "" .alpine; do
            scripts/smoke-image.sh docker schedr:release$kind
            scripts/smoke-image.sh docker schedr-slim:release$kind slim
            scripts/smoke-server-image.sh docker schedr-server:release$kind
          done
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          tags=("$VERSION")
          [[ $PRERELEASE == true ]] || tags+=("$SERIES")
          for image in schedr schedr-slim schedr-server; do
            for tag in "${tags[@]}"; do
              docker tag "$image:release" "ghcr.io/$GITHUB_REPOSITORY_OWNER/$image:$tag"
              docker push "ghcr.io/$GITHUB_REPOSITORY_OWNER/$image:$tag"
              docker tag "$image:release.alpine" "ghcr.io/$GITHUB_REPOSITORY_OWNER/$image:$tag-alpine"
              docker push "ghcr.io/$GITHUB_REPOSITORY_OWNER/$image:$tag-alpine"
            done
          done

  # Last, once everything it announces exists.
  github-release:
    needs: [version, dist, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-wheels
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sums
      - run: python3 scripts/release.py notes "$GITHUB_REF_NAME" > notes.md
      - run: |
          pre=()
          [[ $PRERELEASE == true ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag "${pre[@]}" \
            --title "schedr $VERSION" --notes-file notes.md dist/*.whl SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}

  # The documentation CI built from the tag, on GitHub Pages (decisions 165, 166): the site
  # shows the latest release; a rehearsal doesn't replace it.
  pages:
    needs: [version, github-release]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
