[[steps]]
id = "M5.2e"
title = "A worker's waiting queue (lookahead with a barrier)"
scope = '''
(the user, 2026-11-18, during M5.2d; was M7's lookahead, research) each worker holds a one-line queue of ready tasks beyond its slots (about half its slots deep). The master knows no new state: a queued task is assigned, waiting for its `Started`, as today; the barrier lives only in the worker: the moment it takes a queued task into a freed slot and writes its `running` record. Before it, nothing of the task is in the journal and it can be moved; after it, it can't. The master learns which side a task is on only by trying to move it: its request is answered withdrawn (gone from the queue, never started here; only then assigned elsewhere) or too late (its `Started` on its way), settled in the worker's loop as moved cleanups are (B169). Settled by that: pools and `max_active` count it as assigned, as today; a lost worker's assigned-not-started tasks taken back as today, none having run; B240's take-back held off by M5.2d's hold (an assignment unreported until its `Started` is queued). Aim: a freed slot takes its next task locally (~16 ms, the record) instead of a round and an assignment (~100 + ~68 ms), the slot cycle ~470 -> ~300 ms in scenario 1. A design round first, its decisions to the user before code: the depth; when the master tries a move (another worker idle, a task waiting long); a code mismatch at the barrier (`Rejected`, as today); a cancel of a queued task; a drain; whether anything but B240 reads the worker's heard number (a long-held one lags); assigned -> started then mixes the queue's wait with the start (the user: throughput the headline under load, assigned -> started read on an idle cluster, as comparable as before; no barrier -> started metric of its own; the worker's own histogram could start at the barrier at no cost). Moves (the user, 2026-11-18): the master never moves a queued task; the worker gives back what it can't start soon, from its own loop (no race: the barrier is there), as `Rejected` with a new reason (withdrawn), and the master puts a returned task into a free slot only, never another queue. The rule (the user, 2026-11-18; replaces a fixed per-slot threshold): the queue at most slots / 2; each worker reports in its heartbeat the age of its queue's head (the oldest queued task's wait so far; 0 when empty); the master answers in the `HeartbeatAck` with one cluster-wide "slow equals" X, the median of all workers' head ages (empty queues included) times k (e.g. 3) with a floor (e.g. 0.5 s); a worker whose head is older than X gives back one task a heartbeat, from the queue's tail. So slow means slower than the cluster now: when every worker is as busy nothing goes back; at a burst's end idle workers pull X to the floor and a queue still holding work hands it to them. Also given back: a drain's queue, a session's end. Open: k and the floor (hidden settings, measured). No master moves (the user, 2026-11-18): the master counts a worker's free slots itself (its slots less the attempts it assigned there, `workers.rs`), queued ones included; it fills workers below their slots first and queues only on those between slots and slots + slots / 2 when none has a free slot, so a free slot beside a queue happens only at a burst's end, where a queued task waits at most about two short cycles; a `Withdraw` request added later only if stress shows a long tail there. Settled in e1 (decision 509, the user, 2026-11-18): give-backs paced each second against the latest X, not one a heartbeat (heartbeats are 10 s); depth = ceil(slots x factor), the factor hidden (0 to 4, 0 no queue, default 0.5), `[worker] queue` public to turn it off; a lost worker's queued tasks end `lost` (accepted, measured); the fields in protocol 2.2, no bump. Steps (the user, 2026-11-18), each tested before the next: e1 the design recorded (a decision; what else reads the worker's heard number checked first; defaults k = 3 and the floor 1 s (the user, 2026-11-18: a healthy head is at most about half a task's duration old; a give-back costs ~250 ms, a round, an assignment and a start, so below ~4 of them it can't pay; swept in e6: k 2, 3, 4, the floor 0.5, 1, 2 s); the heartbeat's production interval checked, one give-back a heartbeat too slow if it is long; the depth fixed, slots / 2 rounded up, not a setting: the user, 2026-11-18); e2 the protocol (the heartbeat's queue head age, the `HeartbeatAck`'s slow-equals, a `Withdrawn` reject reason; the protocol version bumped once a release); e3 the worker's queue (FIFO past the free slots, at most slots / 2, numbers held for B240, the head taken at the barrier, a cancel removes a queued task, a drain gives the queue back, a session's end drops it; queue length and wait metrics); e4 the give-back (the head older than slow-equals: one task a heartbeat from the tail, `Rejected` withdrawn); e5 the master (free slots first, then queues; a withdrawn task back to ready and to a free slot only; slow-equals from the median of head ages; hidden settings for k and the floor; the clock simulation with queued tasks, a worker lost with a queue, a master failover); e6 measured (scenario 1; a mixed scenario of short tasks and long ones in clumps, k and the floor swept; assigned -> started on an idle cluster; scenarios 3, 7, 17-21); e7 one Codex review over e2-e5, the guide pages, the records, `make check`, the commit. Lanes (a chain run on one worker) stay M7's
'''
done_when = '''
the design's decisions taken by the user; built, with the clock simulation and the cut scenarios 17-21 passing; scenario 1 measured against M5.2d's
'''
status = "planned"

