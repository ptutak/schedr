title = "Run parameters are masked when shown"
date = 2026-11-01
by = "user"
status = "active"
topic = "task-context"
section = "Parameters"
summary = '''
Shown parameters are masked like task outputs; tasks receive originals. Refusals never quote
parameter or schema values, mask names, and omit even the keyword beneath secret-named fields. The
webserver rejects NUL before storing a command; run-DAG views retain only masked parameter defaults.
Bad bodies, `-p`, invalid dataclass defaults and Pydantic default serialization produce no value-
bearing diagnostics; invalid dataclass defaults also omit their type.
'''
