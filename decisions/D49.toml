summary = '''
Outside a DAG, a plain async task call returns a coroutine; typed tests use `await task.fn(...)`,
since a plain call is typed as its result. Async cleanups and resource setups/cleanups are
supported. Remaining background tasks are cancelled; their errors are warnings and do not change the
attempt’s result.
'''
