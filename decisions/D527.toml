summary = '''
An extension task is given only to workers of its queue that offer its extension's name and version. One
that no live worker offers waits, its waiting reason naming the queue and the version, and ends
`unschedulable` after a while: a rolling upgrade's gap is survived, a typo fails in the end. Not chosen:
waiting without end; failing at once; queues generated from `name@version` (a queue says where, the
plugin who can).
