title = "Standalone runs a native DAG"
order = 20
done_when = '''
A new user can `pip install` the wheel, write the example DAG, run `schedr dags test` on it, start `schedr standalone`, trigger a run with `schedr runs trigger --for ...` and see it succeed with `schedr runs list`.
'''
notes = '''
In dependency order; each step ends with **unit tests**, and with **integration tests**
where its "done when" needs real processes, files or the whole system. The integration tests
of 1.4–1.14 were written after 1.14 (first planned as one step at the end, 1.17); from 1.15
on, each step brings its own.


**M1 is done** when a new user can `pip install` the wheel, write the example DAG from
PROJECT.md (Native API), run `schedr dags test` on it, start `schedr standalone`, unpause the
DAG, trigger a run with `schedr runs trigger --for ...`, and see it succeed with
`schedr runs list`.

**Status (2026-10-22): M1 is done.** Steps 1.1–1.17 are committed (the last: 1.16, `df309b8`).
The paragraph above is checked automatically by `scripts/smoke-wheel.sh` (CI's `wheel` job,
`make smoke`): the release wheel installed into a fresh venv, `dags check`, `dags test` on the
example DAG, then `schedr standalone` with `dags unpause`, `runs trigger --for ...` and `runs
list` until the run succeeds. Open bugs are in `BUGS.md`.
'''

[[steps]]
id = "1.1"
title = "Native API, parse side"
scope = '''
`Dag` context manager, `@task` with required return annotation, `CommandOperator`, `EmptyOperator`, data flow and `>>`, IDs and duplicates, strict arguments, no subclassing, `Cron` / `Every` / presets, `StepDefaults`, `dag_ctx` references
'''
done_when = "`with Dag(...)` produces DAG JSON that validates against the schema"
status = "done"
done = 2026-10-21
commits = ["a6c9ddf"]

[[steps]]
id = "1.2"
title = "Serialization"
scope = '''
the type model and parse-time checks (return types, inputs, paths, `None` from skippable tasks), run-time encode / decode with tagged types, dataclasses, strict checks, size limits
'''
done_when = "unit tests per supported / rejected type, with the exact error messages"
status = "done"
done = 2026-10-21
commits = ["3978d3a"]

[[steps]]
id = "1.3"
title = "Templates"
scope = '''
t-strings to template parts, nested traversal rules, format specs (`raw`), parse errors (dict keys, untraversed containers, unknown specs)
