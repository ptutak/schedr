section = "Defining connections"
summary = '''
Connections use generator functions with secret/literal arguments and missing-secret defaults; tasks
must declare what they open, and test doubles are supported. `connections check` renders without
opening; `connections test` runs built-in/custom checks on a worker. One definition supplies
sync/async clients where supported: HTTP via httpx, Mongo via pymongo, SQL async on Postgres only;
SSH is sync. Async generators/checks are supported. Reading Airflow's own entry format is not built (the
Airflow layer, M5).
'''
