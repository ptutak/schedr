name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The committed JSON Schemas must match the Rust model (see the Makefile, schema-check).
      - run: cargo xtask schema --check
      # Coverage floor and ignored files: see the Makefile (test-rust).
      - run: >-
          cargo llvm-cov nextest --workspace
          --ignore-filename-regex '(^|/)(tests|main)\.rs$'
          --fail-under-lines 85
          -E 'not kind(test)'
      - run: cargo test --workspace --doc

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      # The package is built with maturin, so `uv sync` compiles the Rust binary.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run ruff format --check python examples
      - run: uv run ruff check python examples
      - run: uv run mypy
      - run: uv run pytest python/tests/unit --cov --cov-report=term-missing --cov-fail-under=85

  # Integration tests (see the Makefile, test-integration): real processes, the binary with
  # the real Python runner, and every query on Postgres (a service container here).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: schedr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SCHEDR_TEST_POSTGRES_URL: postgres://postgres:schedr@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: astral-sh/setup-uv@v4
      # Installs schedr (built with maturin) into the environment the runner runs from.
      - run: uv sync --python 3.14
      - run: echo "SCHEDR_TEST_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: cargo nextest run --workspace -E 'kind(test)'
      - run: uv run pytest python/tests/integration examples

  # The documentation site (see PROJECT.md, Repository and tooling: Documentation); fails on
  # any warning.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group docs --python 3.14
      - run: make docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  # Platform wheels: the `schedr` binary plus the pure-Python package (see PROJECT.md,
  # Packaging and releases).
  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest, target: x86_64 }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos, runner: macos-14, target: aarch64 }
          - { os: macos, runner: macos-14, target: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - name: Smoke test
        # Cross-compiled wheels (macOS x86_64 on an arm64 runner) can't run here.
        if: ${{ !(matrix.os == 'macos' && matrix.target == 'x86_64') }}
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/schedr --version
          /tmp/smoke/bin/python -c "import schedr; print(schedr.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
