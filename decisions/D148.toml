topic = "task-context"
section = "Inside a command or a script"
summary = '''
The agent accepts context protocol 1 regardless of schedr version; `hello` supplies both, and
incompatible-protocol refusals name both versions. Within a protocol, new requests and fields are allowed:
unknown fields are ignored and unknown requests receive `error`. Other changes, including new enum values,
require a new protocol.
'''
