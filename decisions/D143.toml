title = "Each context caller sends its own socket end"
date = 2026-11-01
by = "user"
status = "active"
topic = "task-context"
section = "Inside a command or a script"
summary = '''
Command-task processes inherit the datagram channel named by `SCHEDR_CTX_FD`; each caller passes one
end of a fresh stream socket pair through `SCM_RIGHTS` and uses its own connection. It speaks
length-prefixed JSON, beginning with protocol `hello`. The agent serves at most 64 connections open at
once and refuses one more while they are; malformed descriptor messages are dropped and their
descriptors closed. Linux and macOS are supported.
'''
