[package]
name = "schedr"
description = "The schedr binary: server roles, user CLI and in-task CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# The library part holds everything testable; `main.rs` only calls into it.
[lib]
name = "schedr_bin"
path = "src/lib.rs"

[[bin]]
name = "schedr"
path = "src/main.rs"

[dependencies]
clap.workspace = true
schedr-config.workspace = true
schedr-db.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
rstest.workspace = true

[lints]
workspace = true
