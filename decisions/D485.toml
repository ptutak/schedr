summary = '''
Each master round starts with one statement, the probe (`Database::probe`): for each read the
round makes, whether it would find anything. Inside `Database::in_round` a read whose check
said no returns nothing; the probe looks a tick ahead, and is taken again after a write ends
or for a time-bounded read past what it covered. Every check reads a stored row
or column: a scheduled DAG stores `next_fire_at` (unknown after a switch change, a time come
already while due runs wait or it is held), so a round visits the DAGs due, queued or marked and
keeps nothing in memory to decide it; the tick stays 1 s. Triggers and events get a round of
their own, with their moments stored (M5.1f2). Not chosen: rounds gated by change signals, a
stretched idle tick, an in-memory model of the state.
'''
