title = "A package module that mentions schedr and uses a relative import shows a false import error"
severity = "medium"  # critical, high, medium, low
probability = "possible"  # likely, possible, rare
kind = "usability"  # security, data, correctness, reliability, performance, usability, tests
summary = "a helper `mylib/factory.py` with `from schedr import Dag` and `from .util import clean` fails as `attempted relative import with no known parent package`, though DAGs importing it normally work"  # what happens, and the situation that triggers it
found = 2026-11-06
suspected = false
details = '''
- **Found:** a side note on M4.9d (2026-11-06), confirmed with `schedr dags check`. Decision 305
  stops the false errors only for files that never mention `schedr`; a file that does is still
  loaded alone by its path (`python/schedr/runner/parse.py`), not as part of its package. The word
  in a comment is enough.
- **Workaround:** list the helper's package in `.schedrignore`; the error goes.
- **A fix:** to discuss with the user: document the case and the workaround, or import such a file
  as part of its package.
'''
