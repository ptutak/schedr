summary = '''
Every liveness deadline is a master time: the leading master's monotonic clock, stamped with its timeline on every master message along with the latest worker message
heard; the worker reads master time from when it sent that message. An assignment has no start
deadline (decision 460). The master's expiries count
on its own clock; a lease under four heartbeats is refused. Not chosen: an acknowledged
`Started` before launch; a hold after a wall-clock jump.
'''
