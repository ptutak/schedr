[[steps]]
id = "M5.3d"
title = "Extension tasks placed by the plugins workers offer, beside their queue"
scope = '''
(the user, 2026-11-25: "we can think about automatic queues for extensions based on name@version", then "record it in M5.3 after 1.2.0") today an extension task goes by its queue alone: a worker of the queue without the plugin, or not serving the task's exact version, gives it back with `EXTENSION_UNDEFINED` and the next is tried, until every one has refused and the task is `unschedulable`; the operator keeps the plugins and the queues in agreement by hand. Instead, a filter beside the queue, not generated `name@version` queues (a queue says where a task runs, the plugin what a worker can run: `queue="gpu"` with `spark@1.0` needs both): the dispatcher's `Needs` gains the task's extension and version, the worker registry the offers `Register.extensions` already sends (the master's connections keep them today only for the parse's warnings), and `eligible()` checks `(name, version)` in them beside `serves(queue)`. Extension tasks then need no `queue=` of their own; a rolling upgrade from 1.0 to 1.1 routes each pinned task to the workers still serving it; no config or protocol change. The give-back stays, for a plugin that crashed or a service not ready (DN29). Decided (D527): a task no live worker of its queue serves waits, its reason said ("no worker of queue `default` offers `spark@2.0`"), and ends `unschedulable` after a while. To settle when it starts: that while (a config key or the existing one), and how `explain_waiting` and the UI's task view say it
'''
