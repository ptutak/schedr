summary = '''
Charts are SVG rendered on the server like the DAG graphs (decision 22), with no JavaScript chart
library: a point's values show on hover from a strip's `<title>`, and the Metrics page reads
itself again once a minute, as the samples come (not on the live stream: no change event marks a
sample). Eight series colours (`--series-1` to `--series-8`), checked for colour blindness in light
and dark on the UI's backgrounds; lines, a band, stacked areas (a point alone a bar) or a stacked bar per bucket (attempts ended,
decision 494), dashed limits, and bars coloured by state (a task's attempts, decision 467). No
layout or tests for a phone (the user, 2026-11-14: nobody uses it there). Not chosen: a vendored library such as
uPlot (hover and zoom); Grafana dashboards in the Helm chart, for now.
'''
