section = "Access and authentication"
summary = '''
Distributed app mode uses mTLS on the webserver’s UI port. Mesh proof uses that port over HTTP with
`ui_port_in_mesh`, Istio authorization, a UI account shared with no other role, and a DENY policy
excluding other callers. Standalones, mesh deployments without that policy, and shared-account
setups use a token.
'''
