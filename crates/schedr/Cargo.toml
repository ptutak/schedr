[package]
name = "schedr"
description = "The schedr binary: server roles, user CLI and in-task CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# The library part holds everything testable; `main.rs` only calls into it.
[lib]
name = "schedr_bin"
path = "src/lib.rs"

[[bin]]
name = "schedr"
path = "src/main.rs"

[dependencies]
prometheus-client.workspace = true
rustix.workspace = true
axum.workspace = true
clap.workspace = true
jiff.workspace = true
reqwest.workspace = true
schedr-agent.workspace = true
schedr-api.workspace = true
schedr-client.workspace = true
schedr-ui.workspace = true
schedr-master.workspace = true
schedr-model.workspace = true
schedr-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
schedr-config.workspace = true
schedr-db.workspace = true
schedr-tls.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx.workspace = true
schedr-tls = { workspace = true, features = ["testing"] }
http-body-util.workspace = true
pretty_assertions.workspace = true
tower.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
