title = "Batched worker messages (a milestone after M4)"
order = 70
done_when = '''
A worker's turn of messages (up to `MESSAGES_PER_TURN`, raised from 10 to 20) is stored in **one transaction**: one lease check and one commit fsync per turn instead of one per message, a failed message undone alone; a turn's `Finished`s written together and each run read and settled once per turn; B184 fixed (500 ends recorded within 5 s on Postgres by stress 23).
'''
notes = '''
**No measuring step; 20 messages a turn** (the user, 2026-11-09, decision 395): the design
stays as planned (one transaction for a turn's messages); `MESSAGES_PER_TURN` goes from 10 to
20. The throughput B184 lacks (500 wait steps ending at once recorded at about 22 a second) is
expected to come as a side effect, not the goal.

**B184 fixed in M4B too** (the user, 2026-11-09, decision 396): on top of the turn's transaction,
its `Finished`s written with set-based statements, each run read and settled once per turn, and
the agent's journal written in groups; B184 counts as fixed when stress 23 records its 500 ends
within 5 s on Postgres, with a unit test counting the statements of a turn.

A milestone of its own between M4 and M5 (the user, 2026-11-01: renamed from "M4.5", which
read as a step of M4, M4.5 being the agent channel there).

Done when: a worker's turn of messages (up to `MESSAGES_PER_TURN`) is stored in **one
transaction**: one lease check and one commit fsync per turn instead of one per message, a
failed message undone alone, and the measured lock and commit time per turn lower than M4's.

Planned with the user (2026-10-28; decision 54 in archive/PROJECT.md, "T1b"), between M4 and M5. It
builds on T1 (one transaction per message), `Dispatcher::memory` / `restore` (a message
rolled back puts memory back) and D1 (a commit cut off is read back). **A savepoint per
message:** `SAVEPOINT` before each message, `ROLLBACK TO` and its own memory snapshot restored
when it fails, `RELEASE` when it succeeds, one `COMMIT` for the turn. **When the commit itself
fails** (the lease lost, the connection gone, a time limit): the memory as the turn found it
is restored and the turn's messages are redone one by one, one transaction each, as today
(the user's fallback). Not chosen: rolling back the whole turn on any message's failure and
redoing it one by one (a bad message costs N+1 transactions).

What each message does in a turn:

| Message | Today | In a turn's transaction | When it fails | When the commit fails |
|---|---|---|---|---|
| **Started** | own transaction, memory snapshot, read back (D1) | joins it, behind a savepoint; `arrivals.start_handled` after the commit | `ROLLBACK TO`, its memory restored | the turn's memory restored, redone alone |
| **Finished** | same; its `FinishedAck` also when the read-back finds it stored | joins it, behind a savepoint; ack sent, metrics counted and wakes fired after the commit | `ROLLBACK TO`, its memory restored | the same; nothing counted twice |
| **Rejected** | same | joins it, behind a savepoint | `ROLLBACK TO`, its memory restored | the same |
| **CodeVersionChanged** | own transaction, no memory snapshot | **ends the batch** (what came before is committed), then alone as today, unless its memory (worker version, parse jobs) joins the snapshot | as today | as today |
| **Heartbeat** | `worker_seen` outside any transaction, a failure ignored | **outside**, after the commit (for people) | nothing to undo | nothing to undo |
| **Warnings** | written outside any transaction, a failure ignored | **outside**, after the commit | nothing to undo | nothing to undo |
| **Draining** | memory (dispatcher, discovery) and a write, no transaction | **ends the batch**, then alone as today | as today | as today |
| **Deregister** | `forget`: memory, connections, writes | **ends the batch**, then alone as today | as today | as today |

A commit cut off is read back once for the turn: it lands whole or not at all, so one
message's attempt answers for all.

**To think about when M4B is the main topic** (the user, 2026-11-05: "there will be a lot
to think about"; found while chasing M4.8z's stress 05 and B165):
- **What a paused or standby master tells a worker.** Since B165 it refuses a stream at once
  with UNAVAILABLE, "not leading", and drops out of its Service through `/readyz`; whether it
  should also name the master that leads (from the lease row) or say how long to wait.
- **Readiness during a takeover.** Between the old master's pause and the new one's first
  round, no master is ready: workers wait on the Service and their lease runs; how long that
  gap can be against the worker lease (60 s) and the database lease (30 s).
- **The agent's silence limit against a slow `Register`.** The agent ends a stream silent for
  the worker lease (decision 281); a `Register` waiting behind a long round or a batched
  turn's commit must stay well under it, which M4B.1's measurements should show.
- **Reconnect storms after a failover.** Every worker reconnects to the new master at once,
  each `Register` a reconciliation under the core lock; whether batching (or a spread of the
  reconnects) keeps the first rounds of a new master from stalling.
'''

[[steps]]
id = "M4B.1"
title = "Measure first"
scope = '''
per-turn timings (waiting for the core lock, handling, the commit) and the messages per turn as metrics; the assign-to-started gap split into its parts (Grok's 2026-10-28 investigation: rounds holding the lock); a stress baseline (scenario chosen with the user, run only with their go)
'''
done_when = "the baseline recorded"
status = "dropped"

[[steps]]
id = "M4B.2"
title = "Savepoints in `schedr-db`"
scope = '''
`Database::savepoint` inside an open scope (Postgres and SQLite), `ROLLBACK TO` clearing the scope's `broken` mark, `RELEASE`; a failed statement behind a savepoint no longer voids the transaction
'''
done_when = "unit tests on both databases, including a failed statement undone alone"
status = "planned"

[[steps]]
id = "M4B.3"
title = "Turns in one transaction"
scope = '''
the turn loop (`service.rs`) wrapped in one transaction, `MESSAGES_PER_TURN` raised to 20, a savepoint and memory snapshot per message, the batch ended at `CodeVersionChanged`, `Draining` and `Deregister`, heartbeats and warnings after the commit; metrics, wakes and `arrivals` deferred to after the commit; the fallback when the commit fails; the read-back once per turn
'''
done_when = '''
a failed message undone alone while the others are stored; a commit failure redone one by one; no metric counted twice; `MESSAGES_PER_TURN` 20
'''
status = "planned"

[[steps]]
id = "M4B.4"
title = "A turn's `Finished`s written together"
scope = '''
(decision 396, B184; the message side of what M2.10b's T2 and B18 did for assignments: a round's assignments in one transaction, a run's instance updates in statements of up to 500 rows): the turn's attempts ended with one `UPDATE ... WHERE id IN (...)`, their outputs in one multi-row `INSERT`, their instances updated together; the turn's `Finished`s grouped by run, each run read (`run_tasks`) and settled (`advance`) once
'''
done_when = '''
a unit test counts the statements of a turn of 20 `Finished`s: a few per turn, not about six per message; each run read once per turn
'''
status = "planned"

[[steps]]
id = "M4B.5"
title = "The agent's journal in groups"
scope = '''
(decision 396, B184): results that arrive together written to the agent's journal with one fsync
'''
done_when = '''
a burst of results costs one fsync per group; stress 23 records its 500 ends within 5 s on Postgres (B184 fixed)
'''
status = "planned"
