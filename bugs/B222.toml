title = "a long release name gives Service names over 63 characters"
severity = "medium"
probability = "rare"
kind = "correctness"
summary = '''`schedr.fullname` truncates to 63, then roles append `-master` etc.: a 53-character release gives a 67-character Service and the install fails'''
found = 2026-11-10
suspected = false
details = '''
- **Found:** 2026-11-10, by Codex's full review F13 (session 01a1c5ad), checked by Claude against the code.
- **Where:** `charts/schedr/templates/_helpers.tpl` (`schedr.fullname`).
- **A fix:** truncate the fullname to 63 minus the longest suffix (`-webserver`, 10), or fail with a clear message on a release name too long.
'''
