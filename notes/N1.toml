title = "Scenario 1's round trace: what each step and point cost, and where the trace points are (M5.2g)"
date = 2026-11-19
summary = '''
For M5.2g: one traced run of scenario 1, every step and point of the master's
round with its count, mean, median, p99 and total, the round's own clock apart; and the
register of the trace points put in the code, to remove once the profiling is done.
'''
history = "JOURNAL.md#N1"
details = '''
For M5.2g (the user, 2026-11-19). One run of scenario 1 (`make stress STRESS=01_throughput
STRESS_RELEASE=1` with `SCHEDR_HIDDEN__MASTER__ROUND_TRACE` set), on the code with the cap
50 and the ready read with no LIMIT: 2,501 tasks in 121 s, 36.4 tasks/s, the slot cycle
0.88 s. The machine was loaded and the trace costs time of its own (the user: the timings are
expected to double), so what counts is which points take the time, not their absolute values.

Every step and point of the round (`scripts/round_trace.py`): a point's count, its mean, median
and 99th percentile a call in milliseconds, and its total over the run in seconds. A point inside
a loop is timed each time; `tx.begin` and `tx.commit` are a transaction's start (the wait for a
connection included) and its `COMMIT` under the part it runs in, `own_tx.*` those of a write in
a transaction of its own; `probe` under a part is a probe taken again there. Run 2 (below) repeats it on an idle machine; run 3 (first) measures M5.2g's changes.

### Run 3: M5.2g's changes against their base, three pairs interleaved (2026-11-20)

Scenario 1, release, traced, the base (`3acd91dc`: run 2's code with the ready read's fetch
timed apart) and the final code (`63f7f09b`) run in turn, base then final, three times: runs
of one code vary by up to 25 tasks/s on this machine (its load reaches 13-19 during a run), so
one run against one can't show a few seconds. "Busy" is the time in rounds longer than 20 ms:
during the task window the rounds run back to back, so it is the master's serial time.

| Run | Tasks/s | Slot cycle | Busy rounds | Busy ms a task | results | assign | commands | prepare | scheduler |
|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|
| base 1 | 78.3 | 0.409 s | 33.3 s | 13.3 | 12.70 | 9.56 | 5.54 | 2.12 | 1.68 |
| final 1 | 75.8 | 0.422 s | 34.6 s | 13.8 | 13.18 | 9.35 | 5.35 | 2.51 | 1.68 |
| base 2 | 69.1 | 0.463 s | 39.0 s | 15.6 | 13.58 | 10.52 | 4.68 | 2.67 | 3.48 |
| final 2 | 73.1 | 0.438 s | 35.9 s | 14.4 | 11.56 | 11.13 | 5.55 | 2.72 | 1.55 |
| base 3 | 66.6 | 0.481 s | 39.7 s | 15.9 | 14.17 | 11.44 | 6.13 | 2.41 | 2.20 |
| final 3 | 77.8 | 0.411 s | 33.8 s | 13.5 | 10.44 | 10.99 | 3.65 | 2.41 | 2.72 |

The parts' columns are their totals in seconds over the whole trace. The medians: base 69.1
tasks/s (66.6-78.3) and 15.6 ms of busy round a task, final 75.8 (73.1-77.8) and 13.8 ms: about
10 % more, steadier, the best base run inside the final's range. The shares of busy time: results
36.2 % to 33.7 %, assign 28.2 % to 30.2 %, commands 14.7 % to 13.9 %.

The changes measured: a results batch's runs written together (outputs, instances' changes and
ends in one statement each, `runs_finished`); its runs and instances read in one statement;
assign's held DAGs and versions in one; the scheduler's overview in one (was three); a manual
run's context in one (was three). Tried and dropped: the ready read joining only `runs` (its
fetch 3.38 s against 3.44, no gain). Why statements: in the round page's measured run
(`docs/03-guide/19-masters-round.md`, 2026-11-19) the master used 18 % of a core and Postgres
ran its statements 3.6 ms a task of 13.1, so most of a round waits on round trips.

### Run 2 (M2): an idle machine, the commands part's lock waits timed

`make stress STRESS=01_throughput STRESS_RELEASE=1` with `SCHEDR_HIDDEN__MASTER__ROUND_TRACE`
set, at `785922df` (the round's cap 50, the ready read with no LIMIT, as in run 1), the machine
idle (load 0.35): 2,501 tasks in 50.4 s, **75.0 tasks/s** (run 1: 36.4 on a loaded machine), the
slot cycle 0.43 s (0.88). The lock waits of the commands part (`lock_wait.pending`, `.apply`,
`.done`) are new since run 1: its 12 s on no point there were waits, and they mostly went with
the load (1.5 s here).

#### Each step's share (run 2 against run 1)

| Step | Run 2 total s | Share of the run | Run 1 total s | Share | Most of it, run 2 |
|---|---:|---:|---:|---:|---|
| results | 12.17 | 24 % | 27.13 | 22 % | `batch` 8.6 (a run's writes 4.4: `advance.store` 2.5, `store_outputs` 1.5; `started` 1.8; `end_attempts` 1.2); `read_before_lock` 3.2 |
| assign | 11.21 | 22 % | 18.86 | 16 % | `ready_instances` 5.7 (the largest single point: ~860 ready rows read a round, `pick_one` 100,956 calls); `assign_each_tx` 3.8 (`claim_attempts` 2.0) |
| commands | 4.48 | 9 % | 18.76 | 15 % | `apply_one` 2.8 (101 commands); `lock_wait.pending` 1.5 |
| probe (each round) | 3.16 | 6 % | 7.16 | 6 % | one statement a round, 13 ms median |
| prepare | 2.14 | 4 % | 5.37 | 4 % | `prepare_runs.run` 2.0 (101 runs) |
| scheduler | 1.82 | 4 % | 7.27 | 6 % | `overview_and_active_dags` 1.6 |
| expire | 0.40 | 1 % | 1.34 | 1 % | |
| rest | 0.13 | 0 % | 1.04 | 1 % | |
| between rounds (start to start − start to end) | 14.58 | 29 % | 34.01 | 28 % | the round gap and the wait for work |
| the run, start to start | 50.14 | | 121.06 | | |

Results and assign stay the two largest, about a quarter each; inside them, `ready_instances`
(reading every ready row each round) and a finished run's own writes (`advance.store`,
`store_outputs`, one statement each a run) lead.

