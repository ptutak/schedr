section = "Nodes the master ends"
summary = '''
Master-ended `first_of` yields the first taken edge's value; `at_least(n, ...)` yields the first n
values in completion order, with `with_winner=True` also supplying IDs. `first_of` is skipped if all
edges are not taken, or becomes `upstream_failed` if an edge failed and none can still succeed.
Losers continue; a failed loser still fails the run without changing the completed node or its
downstream results.
