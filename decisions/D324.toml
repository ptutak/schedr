summary = '''
A wait call reads as Waited[T], containing its value or TimedOut; passing it directly to a parameter accepting
only T is rejected. Select the value with .on(T), the timeout with .on(TimedOut), or accept both explicitly.
Plain >> selects the value; failed waits propagate upstream_failed, with ordinary run_if rules for untaken
edges.
