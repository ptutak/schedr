summary = '''
Without a declared cleanup, a resource gets an empty cleanup in the graph and run. The master completes it
without an attempt, process or worker, recording the explanation in the task’s reason where a log would
appear. A repeated declaration from the same source replaces the first; one from another source is a parse
error.
