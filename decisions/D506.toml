section = "Placement and ordering"
summary = '''
A round handles the workers' results first, then runs the Scheduler, Prepare and Assign every
time; Commands, Expire and Rest each run only when due: once a tick interval, Commands also at once
on an announced command, all of them in a master's first round and its first after leading again
(a failed round leaves them due). The rounds results wake keep their own gap,
`SCHEDR_HIDDEN__MASTER__TASK_ROUND_GAP` (10 ms; 1 to 25 ms measured the same, rounds running back
to back); `ROUND_GAP` (50 ms) is the trigger loop's. Read before the core lock (decisions 501 and
505) is only what nothing but the round writes: the ready tasks, wait steps' reads, upstream
outputs, the `Finished`s' attempts and their runs. Read under it: the DAGs held and their current
versions (parse uploads write them), the `Started`s' attempts (a registration's adoption starts
them). The reads before the lock serve one transaction, are dropped before anything is handled
alone, and a failed one is no error (the batch reads under the lock). Each change measured in
scenario 1 (release): 69.8 tasks a second before, ~68-70 after, the round ~151 -> ~118 ms. Not
chosen: a second kind of round chosen by the wake-up (two paths kept in step), a gap of 0 (the
user: scary), the Scheduler on the slow pace (an event's run waited for it), a batch's runs stored
together (~3 %, the user: leave it).
'''
