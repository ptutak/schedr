summary = '''
`service_memory` defaults to 256 MiB, not 512: a service runs on every worker with its extension
configured with one, all the time, its memory inside the worker's budget (a side agent's note:
two extensions with services on 10 workers could hold 10 GiB). An operator raises it where a
service needs more.
