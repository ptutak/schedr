title = "the chart's default git-sync image is a tag, not a digest, and pin-check doesn't look at chart values"
severity = "medium"
probability = "rare"
kind = "security"
summary = '''`git_sync.image` defaults to `registry.k8s.io/git-sync/git-sync:v4.7.1`; a replaced upstream tag runs other code with the repository credentials and write access to the DAG checkout. `make pin-check` reads workflows, tools, images and requirements, not `values.yaml`'''
found = 2026-11-10
suspected = false
details = '''
- **Found:** 2026-11-10, by Codex's full review F13 (session 01a1c5ad), checked by Claude against the code.
- **Where:** `charts/schedr/values.yaml` (git-sync `image`), `scripts/check-action-pins.py`.
- **A fix:** pin `@sha256:` beside the tag, and have pin-check require a digest on every image in `values.yaml`.
'''
