name: Kind

# The kind scripts on a runner, by hand (M5.3h, M5.3f): each on a kind cluster of its runner's own,
# on a release's images or on this commit's, built from its CI run's wheel as the release builds
# them. Not on each push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "A release's images (a tag of ghcr.io/ptutak/schedr, with no v); empty: this commit's, built from its CI run's wheel"
        default: "1.2.1"
        type: string

# One at a time: a later one waits.
concurrency:
  group: kind
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        script: [kind-standby, kind-distributed, kind-standalone, kind-kill]
    name: ${{ matrix.script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      # Ours, not whatever the runner's image has: kind's release names its node image by digest
      # (kindest/node v1.37.0), and kubectl is of the same minor.
      - name: kind and kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/bin/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          sha256sum --check --strict <<SUMS
          aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/bin/kind
          c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4  $RUNNER_TEMP/bin/kubectl
          SUMS
          chmod +x "$RUNNER_TEMP/bin/kind" "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: A release's images
        if: inputs.version != ''
        # The version through the environment, never pasted into the script.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?(-alpine)?$ ]] || {
            echo "not a release's version: $VERSION"; exit 1; }
          for image in schedr schedr-server; do
            docker pull -q "ghcr.io/ptutak/$image:$VERSION"
          done
          echo "IMAGE=ghcr.io/ptutak/schedr:$VERSION" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=ghcr.io/ptutak/schedr-server:$VERSION" >> "$GITHUB_ENV"
      # This commit's: its CI run's wheel and docs, as the release workflow builds its images.
      - name: This commit's CI run
        if: inputs.version == ''
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push's run of this repository only: a pull request's builds another tree (agy's
          # review of M5.3f).
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=10" \
            -q "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\")][0].id // empty")
          [ -n "$run" ] || { echo "no passing CI run of a push of $GITHUB_SHA"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.version == ''
        with:
          name: wheels-linux-x86_64
          path: dist
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.version == ''
        with:
          name: docs-site
          path: site
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
      - name: This commit's images
        if: inputs.version == ''
        run: |
          scripts/docs-dist.sh site
          for image in schedr schedr-server; do
            docker build -q -f "images/$image/Dockerfile" -t "localhost/$image:commit" .
          done
          echo "IMAGE=localhost/schedr:commit" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=localhost/schedr-server:commit" >> "$GITHUB_ENV"
      - name: The script
        # KEEP: the cluster stays for the logs below, gone with the runner.
        env:
          SCRIPT: ${{ matrix.script }}
        run: CONTAINER=docker KEEP=1 "scripts/$SCRIPT.sh"
      - name: What the cluster looked like
        if: failure()
        run: |
          mkdir -p target/kind-logs
          cluster=$(kind get clusters | head -1)
          kind export logs --name "$cluster" target/kind-logs || true
          kubectl --context "kind-$cluster" -n schedr get pods,events -o wide || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: kind-logs-${{ matrix.script }}
          path: target/kind-logs
