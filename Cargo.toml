[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Piotr Tutak <p.tutak@outlook.com>"]

[workspace.dependencies]
schedr = { path = "crates/schedr" }
schedr-fd = { path = "crates/schedr-fd" }
schedr-model = { path = "crates/schedr-model" }
schedr-proto = { path = "crates/schedr-proto" }
schedr-config = { path = "crates/schedr-config" }
schedr-db = { path = "crates/schedr-db" }
schedr-master = { path = "crates/schedr-master" }
schedr-agent = { path = "crates/schedr-agent" }
schedr-api = { path = "crates/schedr-api" }
schedr-client = { path = "crates/schedr-client" }
schedr-ui = { path = "crates/schedr-ui" }
schedr-tls = { path = "crates/schedr-tls" }

# Third-party crates: versions live here only (see archive/PROJECT.md, Repository and tooling:
# Libraries).
askama = "0.16.1"
axum = "0.8.9"
hyper-util = { version = "0.1.21", features = ["tokio"] }
croner = { version = "4.0.1", default-features = false, features = ["jiff"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "parse-value"] }
ignore = "0.4.33"
# Run params against their JSON Schema (decision 133): no remote `$ref`s, so no default features.
jsonschema = { version = "0.60.2", default-features = false }
jiff = { version = "0.2.38", features = ["serde", "tzdb-bundle-always"] }
prometheus-client = "0.25.1"
prost = "0.14.4"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier", "hostname"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "system-proxy"] }
rustix = { version = "1.1.6", features = ["event", "fs", "net", "param", "process", "system"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
prost-types = "0.14.4"
protoc-bin-vendored = "3.3.0"
schemars = { version = "1.2.3", features = ["jiff02"] }
base64 = "0.23.1"
# Already in the tree (through sqlx); Python's `str.isprintable`, for masking a `repr`.
unicode-general-category = "1.1.0"
chacha20poly1305 = "0.11.0"
bcrypt = "0.19.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros"] }
thiserror = "2.0.21"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging"] }
toml = "0.8.23"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "fs", "net", "signal", "test-util"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["jiff_0_2"] }
utoipa-swagger-ui = { version = "10.0.2", default-features = false, features = ["vendored"] }
uuid = { version = "1.28.0", features = ["v7"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

# Test-only crates (see archive/PROJECT.md, Repository and tooling: Testing).
http-body-util = "0.1.5"
insta = { version = "1.49.0", features = ["json"] }
pretty_assertions = "1.4.1"
scraper = "0.29.0"
proptest = "1.12.0"
rstest = "0.28.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Debug builds (and test builds, which inherit them) keep only line tables: backtraces still
# name functions and `file:line`, but debuggers see no locals; set
# CARGO_PROFILE_DEV_DEBUG=full for a debugging session (see archive/PROJECT.md, Repository and
# tooling: Rust).
[profile.dev]
debug = "line-tables-only"
# No incremental cache: it grew to about half of `target/` (tens of GiB, again in each worktree).
# A rebuild after a small change is slower; the disk stays bounded (the user, 2026-11-08).
incremental = false
