// The schedr master <-> worker agent protocol (see archive/PROJECT.md, Master–worker protocol, Worker
// lifecycle, Task assignment, Task rejections).
//
// Workers always open the connection. The package carries the protocol's major version; the
// minor version is exchanged in Register (same major, equal or lower minor is accepted).
// Within a major version changes are additive only.

syntax = "proto3";

package schedr.protocol.v1;

import "google/protobuf/timestamp.proto";

service Master {
  // The long-lived control stream, one per worker. The first message is Register.
  rpc Control(stream WorkerMessage) returns (stream MasterMessage);
  // A parse job's result (bulky, so a call of its own rather than the control stream): a
  // ParseResult header (no files), then one ParsedFile per message, so only one file's size
  // counts against the master's message limit, not the root's (B35).
  rpc UploadParseResult(stream ParseResultPart) returns (ParseResultAck);
  // An attempt's inputs when they are too big to travel inside AssignTask.
  rpc FetchInputs(FetchInputsRequest) returns (stream InputChunk);
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// ---------------------------------------------------------------- worker -> master

message WorkerMessage {
  oneof message {
    Register register = 1;
    Heartbeat heartbeat = 2;
    CodeVersionChanged code_version_changed = 3;
    Started started = 4;
    Rejected rejected = 5;
    Finished finished = 6;
    Draining draining = 7;
    Deregister deregister = 8;
    Warnings warnings = 9;
    ConnectionJobDone connection_job_done = 10;
    TaskEnded task_ended = 11;
    HandlesAdded handles_added = 12;
    TriggerEvent trigger_event = 13;
    TriggerStopped trigger_stopped = 14;
    TriggerPoked trigger_poked = 15;
    ApiCall api_call = 16;
    CleanupStart cleanup_start = 17;
    AttemptReported attempt_reported = 18;
  }
  // Its number, and what the worker had read of the master's messages (B240): every message
  // carries it.
  WorkerClock clock = 20;
}

// The worker's side of a stream's numbering, as `MasterClock`'s `sequence` and
// `heard_sequence` are the master's (B240). No clock reading: the worker keeps its own.
message WorkerClock {
  // This message's number on the stream: the `Register` is 0, then 1, 2, ... The master's
  // messages name the latest it had received (`MasterClock.heard_sequence`).
  uint64 sequence = 1;
  // The highest `MasterClock.sequence` of this stream the worker had handled when it sent this
  // (0: none yet). What it sends while handling a message (a `Started` for an `AssignTask`)
  // goes out before anything naming that message, so an assignment named here without a
  // `Started` before it never started.
  uint64 heard_sequence = 2;
}

// A `cleanup_anywhere` cleanup's process is waiting at its barrier (B255, decision 504): may it
// run here? Sent only once the process waits, its own timeout running (well within the lease),
// so an answer late for any reason finds it gone, never a cleanup moved meanwhile. Since 2.2.
message CleanupStart {
  string attempt_id = 1;
  // Only the handles the master didn't have (`CLEAN_REST`, B169).
  bool rest = 2;
}

// The master's answer to `CleanupStart`: `go` while the attempt is still open and its cleanup
// this worker's; for the rest of its handles, while this worker owes them (B169, as at
// registration, the attempt ended or not); else not, the cleanup having moved or ended. The cleanup can't move before the worker is lost, a lease after this
// request at the earliest, and its move wait after that. Since 2.2.
message CleanupGo {
  string attempt_id = 1;
  bool go = 2;
}

// A REST request a task (or a trigger, a wait step) makes through its agent, with no URL or
// token (M4.11h, B2): the master runs it through the same router as the task's identity, on an
// allow-list of routes, and answers with `ApiAnswer`. Sent again on a new stream until
// answered (`request_id` and the request's `Idempotency-Key` make that safe).
message ApiCall {
  // The agent's, unique on this worker: the answer names it.
  uint64 request_id = 1;
  // The attempt making it; or, with `trigger_dag_id`, the trigger instance.
  string attempt_id = 2;
  // A trigger's DAG, when `attempt_id` is a trigger instance; "" for an attempt.
  string trigger_dag_id = 3;
  string method = 4;
  // The path and its query, e.g. `/api/v1/events?name=paid`.
  string path = 5;
  // The body, JSON; empty for none.
  bytes body_json = 6;
  // `Idempotency-Key`; "" for none.
  string idempotency_key = 7;
}

// What a trigger found: the master stores it, starts a run for a new key, and acknowledges.
// Sent again until acknowledged: repeated keys are dropped.
message TriggerEvent {
  string dag_id = 6;
  string instance_id = 1;
  // Counts this instance's events, for the acknowledgement.
  uint64 seq = 2;
  string key = 3;
  bytes data_json = 4;
  optional google.protobuf.Timestamp at = 5;
}

// A trigger ended on this worker: it raised, its generator returned, or it was stopped.
// How a poke trigger's calls have gone: sent when that changes, and with a heartbeat if not.
message TriggerPoked {
  string dag_id = 1;
  string instance_id = 2;
  google.protobuf.Timestamp at = 3;
  // Why the last call failed; "" when it went well.
  string error = 4;
  // Its failures in a row.
  uint32 failures = 5;
}

message TriggerStopped {
  string dag_id = 4;
  string instance_id = 1;
  // "" when it was asked to stop.
  string error_kind = 2;
  string message = 3;
  // It got its host killed: counted as a sensor's strike, on the code it ran.
  bool struck = 5;
  string code_hash = 6;
  // An `@trigger(wait_for=...)`'s call returned (decision 353): done with the run it was given.
  // Asked to stop (cancelled, interrupted), it isn't.
  bool done = 7;
  // It returned an event: its item is passed when the master stores that event, not here (one
  // the master dropped, stopping it, is handed again).
  bool returned_event = 8;
}

enum RootKind {
  ROOT_KIND_UNSPECIFIED = 0;
  ROOT_KIND_DAG = 1;
  ROOT_KIND_SCRIPT = 2;
}

message RootHash {
  RootKind kind = 1;
  string root = 2;
  string content_hash = 3;
}

enum JournalState {
  JOURNAL_STATE_UNSPECIFIED = 0;
  // The attempt is still running on the worker.
  JOURNAL_STATE_RUNNING = 1;
  // The attempt finished; its result is journaled but not acknowledged yet.
  JOURNAL_STATE_FINISHED = 2;
}

message JournalEntry {
  string attempt_id = 1;
  JournalState state = 2;
  // How many cleanup handles the journal holds for it (B169).
  uint32 handles = 3;
}

// Sent on every connect.
message Register {
  string worker_id = 1;
  // A UUID generated each time the agent process starts.
  string incarnation_id = 2;
  ProtocolVersion protocol = 3;
  string schedr_version = 4;
  repeated string queues = 5;
  uint32 slots = 6;
  // host:port of the worker's log endpoint.
  string log_endpoint = 7;
  repeated RootHash roots = 8;
  repeated string secret_storages = 9;
  repeated JournalEntry journal = 10;
  // The process the worker runs in (shared with a master in standalone), for the Deployments
  // page; empty from an older agent.
  string process_id = 11;
  // The worker's effective configuration as JSON, masked by the worker (no secret in clear);
  // empty from an older agent.
  string config_json = 12;
  // Its slots for wait steps, apart from `slots` (`[watchers] slots`).
  uint32 watcher_slots = 13;
  // Its triggers still running, from before this session, by instance.
  repeated string running_triggers = 14;
  // How many assigned tasks past `slots` it keeps waiting for a freed slot (its waiting queue,
  // decision 509; protocol 2.2): the master queues no more there. 0, none (an older worker, or
  // `[worker] queue = false`).
  uint32 queue_depth = 15;
  // The default of `secret_storages`, read by `secrets[...]` without a storage (decision 511;
  // protocol 2.2): empty when it has none, a DAG reading one then refused; unset from an older
  // worker or a test run (not checked).
  optional string default_secret_storage = 16;
  // The extensions it runs, each with the versions its plugin serves (decision 510; protocol
  // 2.2): a DAG asking for one no worker offers is warned about. None from an older worker.
  repeated ExtensionOffer extensions = 17;
}

// An extension a worker's plugin serves (`[extensions.<name>]`, or found by discovery).
message ExtensionOffer {
  string name = 1;
  repeated string versions = 2;
}

message Heartbeat {
  // Its triggers running, by instance: one the master doesn't know of any more is stopped.
  repeated string running_triggers = 5;
  uint32 free_slots = 1;
  repeated string running_attempt_ids = 2;
  uint32 free_watcher_slots = 3;
  repeated WatcherHost watcher_hosts = 4;
  // Its number moved to `WorkerMessage.clock.sequence`, which numbers every message (B240).
  reserved 6;
  // What its process and its children use (decision 463; protocol 2.1): none from an older
  // worker.
  WorkerUsage usage = 7;
  // How long its waiting queue's head (the oldest queued task) has waited so far, 0 when the
  // queue is empty (decision 509; protocol 2.2): the master's slow-equals is made from these.
  uint64 queue_head_age_ms = 8;
  // Its pokes' calls since the last heartbeat, one each (M5.2f; protocol 2.2): stored together,
  // in one transaction. One whose call changed how it goes (it failed, or works again) is sent
  // at once as a `TriggerPoked` instead, as an older worker sends each.
  repeated TriggerPoked pokes = 9;
  // Its plugins' declared metrics (decision 513; protocol 2.2), each extension version's a
  // schedr-model ExtensionFigures as JSON, at most once a minute: what its counters and
  // histograms grew by since it last sent them (sent once), its gauges' values, each metric's
  // kind and buckets; its declarations with a stream's first figures and when they change.
  repeated bytes extension_figures_json = 10;
  // What happened to its extensions since the last heartbeat (DN19; protocol 2.2), each a
  // schedr-model ExtensionEvent as JSON, oldest first: discovered, skipped, refused, dropped.
  // At most 100: the oldest go first. Sent once, lost with a heartbeat that isn't.
  repeated bytes extension_events_json = 11;
}

// A schedr process's memory and CPU, and its container's (decision 463).
message NodeUsage {
  // Resident memory, in bytes.
  uint64 resident_bytes = 1;
  // CPU time used (user and system) since it started, in seconds.
  double cpu_seconds = 2;
  // Its cgroup's memory now (`memory.current`); none outside a cgroup v2.
  optional uint64 container_bytes = 3;
  // The smallest `memory.max` on the way up from its cgroup; none when unlimited.
  optional uint64 container_limit_bytes = 4;
}

// A worker's memory by part (decision 463): the agent's own process, then what it started.
message WorkerUsage {
  NodeUsage process = 1;
  // Its fork servers' memory (PSS), together.
  uint64 fork_servers_bytes = 2;
  // Its wait step hosts', together (each one's in `Heartbeat.watcher_hosts`).
  uint64 watcher_hosts_bytes = 3;
  // Its running tasks', together, as their memory watchdog last measured them.
  uint64 tasks_bytes = 4;
  // The largest of them, largest first (at most 5).
  repeated TaskMemory largest_tasks = 5;
}

// A running task's memory, named.
message TaskMemory {
  string attempt_id = 1;
  string dag_id = 2;
  string run_id = 3;
  string task_id = 4;
  // Its map index; none for an unmapped task.
  optional uint32 map_index = 5;
  uint64 bytes = 6;
}

// A process running a worker's wait steps, or a code set whose hosts were lost: for people.
message WatcherHost {
  // The code it runs: its folders' names, the copies' hashes.
  string code = 1;
  uint32 wait_steps = 2;
  // Its process's threads, the wait steps' among them.
  uint32 threads = 3;
  // Those a wait step is tied to: running its `to_thread` calls, or started by it.
  uint32 tied_threads = 4;
  uint64 memory_bytes = 5;
  // Hosts of this code lost since the agent started: crashes and memory kills.
  uint64 hosts_lost = 6;
}

// A root's content hash changed (after the settle time).
// A root's reported hash changed. An empty `content_hash` withdraws the root: the worker no
// longer offers it (decision 303: a DAG root using a script root it lacks).
message CodeVersionChanged {
  RootHash root = 1;
}

// The attempt was accepted and its process started. Sent before the process exists, with
// `spawn`; a task forked from a fork server sends it again with `fork` once it runs (the master
// keeps the first start time and takes the method).
message Started {
  string attempt_id = 1;
  StartMethod start_method = 2;
  // When it started, in the master's time as the worker estimates it (M5.1m; protocol 2.1):
  // master milliseconds on `started_timeline`. None from an older worker, or without a sample:
  // the master records its own time.
  optional int64 started_master_ms = 3;
  uint64 started_timeline = 4;
}

enum StartMethod {
  START_METHOD_UNSPECIFIED = 0;
  START_METHOD_SPAWN = 1;
  START_METHOD_FORK = 2;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_NO_FREE_SLOT = 1;
  REJECT_REASON_DRAINING = 2;
  REJECT_REASON_INTERPRETER_UNDEFINED = 3;
  REJECT_REASON_SCRIPT_ROOT_UNKNOWN = 4;
  REJECT_REASON_SCRIPT_REFERENCE_NOT_FOUND = 5;
  REJECT_REASON_DAG_FILE_MISSING = 6;
  REJECT_REASON_MEMORY_BUDGET_TOO_LARGE = 7;
  REJECT_REASON_DISK_NOT_WRITABLE = 8;
  REJECT_REASON_INVALID_SPECIFICATION = 9;
  // The worker's code of the task's root isn't the hash the master expects (it hasn't synced
  // yet, or synced past it): "code not there yet".
  REJECT_REASON_CODE_MISMATCH = 10;
  // 11 was TOO_LATE, past an assignment's start deadline: gone with the deadline (protocol
  // 2.0, B240).
  reserved 11;
  // Given back from its waiting queue, never started there: slower than the cluster
  // (decision 509; protocol 2.2), a drain, or the session's end. Ready again, no retry used.
  REJECT_REASON_WITHDRAWN = 12;
  // No plugin for the task's extension at its exact version on this worker (decision 510;
  // protocol 2.2): another worker is tried, the task unschedulable once each has said so.
  REJECT_REASON_EXTENSION_UNDEFINED = 13;
  // The task's extension has a service on this worker that isn't ready (starting, restarting
  // after a crash, or turned off past its restarts; decision 518, DN29; protocol 2.2): as code
  // not there yet, the queue's other workers tried, no retry used, unschedulable only after
  // `[master] code_wait`.
  REJECT_REASON_EXTENSION_NOT_READY = 14;
}

message Rejected {
  string attempt_id = 1;
  RejectReason reason = 2;
  // A human-readable detail, e.g. "interpreter `etl-venv` not defined on worker-1".
  string detail = 3;
}

enum AttemptStatus {
  ATTEMPT_STATUS_UNSPECIFIED = 0;
  ATTEMPT_STATUS_SUCCESS = 1;
  ATTEMPT_STATUS_FAILED = 2;
  ATTEMPT_STATUS_TIMED_OUT = 3;
  ATTEMPT_STATUS_OOM_KILLED = 4;
  ATTEMPT_STATUS_CANCELLED = 5;
  ATTEMPT_STATUS_INTERRUPTED = 6;
  ATTEMPT_STATUS_LOST = 7;
  ATTEMPT_STATUS_ASSIGNMENT_EXPIRED = 8;
}

message Finished {
  string attempt_id = 1;
  AttemptStatus status = 2;
  optional int32 exit_code = 3;
  optional int32 signal = 4;
  // On success: the output as tagged JSON (schedr-model), and its outcome name.
  bytes output_json = 5;
  string outcome = 6;
  // How long the process ran (the agent's monotonic clock); absent if it never started.
  optional uint64 duration_ms = 7;
  uint64 peak_memory_bytes = 8;
  // For failures schedr recognises, e.g. "secret_not_found"; empty otherwise.
  string error_kind = 9;
  // A structured error summary as JSON; empty if none.
  bytes error_summary_json = 10;
  // The content hash of the code the attempt ran with.
  string code_hash = 11;
  // What the process used, with the children it reaped (its parent's view at its exit);
  // absent if it couldn't be read.
  optional ProcessUsage usage = 12;
  // Whether it dumped core (ended by a signal).
  bool core_dumped = 13;
  // How the task's cleanup ended; absent for a task without one.
  optional CleanupResult cleanup = 14;
  // A wait step (decision 338): whether it got its host killed.
  bool wait_step = 15;
  bool struck = 16;
}

// A task with a cleanup: its process ended and the cleanup starts (decision 229). `Finished`
// follows, with the same result and the cleanup's.
message TaskEnded {
  Finished result = 1;
}

// What a running attempt reported (decision 513), already masked and bounded by the worker:
// a status, kept with its time, or a link, replacing the one with its label. Since 2.2.
message AttemptReported {
  string attempt_id = 1;
  oneof report {
    StatusReport status = 2;
    LinkReport link = 3;
  }
  // The extension and version whose plugin reported it (DN19): its page lists its attempts'
  // latest phases.
  string extension = 4;
  string extension_version = 5;
}

message StatusReport {
  // When the worker got it, in milliseconds since the Unix epoch.
  int64 at_ms = 1;
  string phase = 2;
  optional string message = 3;
  // 0 to 1.
  optional double progress = 4;
}

message LinkReport {
  string label = 1;
  // http or https only.
  string url = 2;
}

// Cleanup handles an attempt registered, already masked, for a cleanup on another worker
// (decision 242): sent as they are registered, all of them again after a reconnect.
message HandlesAdded {
  string attempt_id = 1;
  // The registration order of the first; the others follow it.
  uint32 first = 2;
  // Each a schedr-model CleanupHandle as JSON.
  repeated bytes handle_json = 3;
}

enum CleanupStatus {
  CLEANUP_STATUS_UNSPECIFIED = 0;
  CLEANUP_STATUS_OK = 1;
  CLEANUP_STATUS_FAILED = 2;
  // The attempt's process never started: nothing to clean up (decision 216).
  CLEANUP_STATUS_NOT_NEEDED = 3;
}

message CleanupResult {
  CleanupStatus status = 1;
  // How many tries it took; 0 if it didn't run.
  uint32 tries = 2;
  // As `Finished`'s, of its last try.
  string error_kind = 3;
  bytes error_summary_json = 4;
  // How long its tries ran, the delays between them left out.
  uint64 duration_ms = 5;
  // Only of the handles from `JournalDecision.cleanup_from` on (`CLEAN_REST`, B169): added to
  // the attempt's cleanup, never its whole.
  bool rest = 6;
}

message ProcessUsage {
  uint64 user_cpu_micros = 1;
  uint64 system_cpu_micros = 2;
  // Absent for a spawned process (a zombie's memory is gone before it is read).
  optional uint64 peak_rss_bytes = 3;
  uint64 major_faults = 4;
  // Absent for a spawned process (a zombie's /proc has its leader thread's only).
  optional uint64 voluntary_context_switches = 5;
  optional uint64 involuntary_context_switches = 6;
}

// What is wrong with the worker now, all of it: sent after every Register and whenever it
// changes; each replaces the last.
message Warnings {
  repeated WorkerWarning warnings = 1;
}

message WorkerWarning {
  // E.g. "fork_server_disabled".
  string kind = 1;
  // The interpreter it concerns, if any.
  string interpreter = 2;
  // What it means for tasks, for people.
  string message = 3;
}

// SIGTERM received, or an admin drain: stop assigning to this worker.
message Draining {}

// Clean deregistration before the agent exits (or idles after an admin drain).
message Deregister {}

// ---------------------------------------------------------------- master -> worker

message MasterMessage {
  oneof message {
    Registered registered = 1;
    AssignTask assign_task = 2;
    AssignParse assign_parse = 3;
    CancelAttempt cancel_attempt = 4;
    FinishedAck finished_ack = 5;
    ConnectionJob connection_job = 6;
    HeartbeatAck heartbeat_ack = 7;
    ScriptUses script_uses = 8;
    AssignTrigger assign_trigger = 9;
    CancelTrigger cancel_trigger = 10;
    TriggerEventAck trigger_event_ack = 11;
    ApiAnswer api_answer = 12;
    CleanupGo cleanup_go = 13;
    MaintenanceDrained maintenance_drained = 14;
  }
  // When the master sent it, on its own clock (B225): every message carries it.
  MasterClock clock = 20;
}

// The master's clock as a message left it (B225, B228). Master time is the leading master's
// monotonic clock, one timeline per master process: every deadline the master and its workers
// must agree on is a master time, and no decision reads a wall clock.
message MasterClock {
  // The master process's timeline: master times of different timelines aren't compared.
  uint64 timeline = 1;
  // Master time, in milliseconds on that timeline.
  int64 master_ms = 2;
  // The latest `WorkerClock.sequence` the master had received on this worker's stream when
  // it sent this (0: only its `Register`): that message was sent before this one, so the
  // worker reads master time from it, conservatively (B225, B240).
  uint64 heard_sequence = 3;
  // The master's wall clock, Unix milliseconds: for a clock-skew warning only, never a
  // deadline.
  int64 wall_ms = 4;
  // The leader's lease epoch, raised at each takeover (decision 444): a worker that has seen
  // an epoch ends a stream from a lower one, a deposed master's, and connects again. 0: no
  // lease (a test's master).
  int64 lease_epoch = 5;
  // This message's number on the stream: `Registered` is 1, then 2, 3, ... (B240). The
  // worker's messages name the latest it had handled (`WorkerClock.heard_sequence`).
  uint64 sequence = 6;
}

// The answer to an `ApiCall`: the HTTP status and body the router gave, or the master's refusal
// (403 for a route off the list or a caller that isn't the worker's).
message ApiAnswer {
  uint64 request_id = 1;
  uint32 status = 2;
  // The body, JSON (an error is `{"error": ...}`).
  bytes body_json = 3;
}

// Run a DAG's trigger: `instance_id` names this run of it, and everything it sends.
message AssignTrigger {
  string instance_id = 1;
  string dag_id = 2;
  // Its function, as a schedr-model task.
  bytes task_json = 3;
  DagFileRef dag_file = 4;
  string expected_code_hash = 5;
  // The last key acted on, given back as `after`.
  optional string after = 6;
  uint64 cancel_grace_ms = 7;
  // The connections of its root, as on `AssignTask`.
  bytes connections_json = 8;
  // Its errors in a row so far: a poke's next report goes on from them.
  uint32 failures = 9;
}

message CancelTrigger {
  string instance_id = 1;
}

message TriggerEventAck {
  string instance_id = 1;
  uint64 seq = 2;
}

// Sent as a heartbeat arrives, while this master leads: how a worker tells a silent network from
// a quiet master, with no other message due.
// Its `clock.heard_sequence` names the heartbeat it answers.
message HeartbeatAck {
  // The cluster's slow-equals (decision 509; protocol 2.2): a waiting queue whose head has
  // waited longer gives back one task a second from its tail. 0, none known: nothing is given
  // back for being slow.
  uint64 slow_equals_ms = 1;
}

// Timing is owned by the master's configuration so all workers behave the same.
message Timing {
  uint64 heartbeat_interval_ms = 1;
  uint64 lease_timeout_ms = 2;
  uint64 cancel_grace_ms = 3;
}

enum AttemptDecision {
  ATTEMPT_DECISION_UNSPECIFIED = 0;
  // Keep running it.
  ATTEMPT_DECISION_CONTINUE = 1;
  // Already abandoned or reassigned: kill it.
  ATTEMPT_DECISION_KILL = 2;
  // Its result is stored: remove it from the journal.
  ATTEMPT_DECISION_ACK = 3;
  // Ended, its cleanup moved without some of its handles (registered while the master
  // couldn't hear the worker, B169): run the cleanup on its handles from `cleanup_from` on,
  // then send its `Finished`.
  ATTEMPT_DECISION_CLEAN_REST = 4;
}

message JournalDecision {
  string attempt_id = 1;
  AttemptDecision decision = 2;
  // For `CLEAN_REST`: the first handle (in registration order) the moved cleanup didn't have.
  uint32 cleanup_from = 3;
}

message Registered {
  Timing timing = 1;
  repeated JournalDecision decisions = 2;
  // The largest message the master accepts ([grpc] max_message_size): the agent turns
  // a result or a parsed file past it into a failure instead of sending it (B33, B35).
  uint64 max_message_size = 3;
  // Which script roots each DAG root uses (decision 304), as ScriptUses.
  repeated RootUses script_uses = 4;
  // Whether it is drained for maintenance (`schedr workers drain`, stored across restarts;
  // DN33, protocol 2.2): it tells its extensions' services.
  bool drained = 5;
}

// The worker drained for maintenance, or resumed (DN33; protocol 2.2): it gets no new work
// meanwhile, its services told and kept running.
message MaintenanceDrained {
  bool drained = 1;
}

// The script roots a DAG root's current parse used (decision 304): a worker folds their hashes
// into the hash it reports for the DAG root (decision 301).
message RootUses {
  string root = 1;
  repeated string script_roots = 2;
}

// Every DAG root's script roots, sent to each worker when they change; it replaces what was
// sent before (a root left out uses none).
message ScriptUses {
  repeated RootUses roots = 1;
}

message RunInfo {
  string run_id = 1;
  // A schedr-model RunKind name: "scheduled", "manual", "backfill", "chained", "event".
  string kind = 2;
  google.protobuf.Timestamp planned_for = 3;
  google.protobuf.Timestamp since = 4;
  string dag_id = 5;
  // The run's parameters as stored JSON (decision 138); empty when the DAG takes none.
  bytes params_json = 6;
  // The event that started it, as schedr-model `RunEvent` JSON; empty for other runs.
  bytes event_json = 7;
}

message DagFileRef {
  string root = 1;
  // Relative to the root, `/` separators.
  string path = 2;
}

message AssignTask {
  string attempt_id = 1;
  string task_id = 2;
  // -1 for a task that isn't mapped.
  int32 map_index = 3;
  uint32 try_number = 4;
  RunInfo run = 5;
  // The task as schedr-model JSON (kind, command templates, arguments, settings).
  bytes task_json = 6;
  // Where the DAG is defined (Python tasks import it; it also locates relative paths).
  DagFileRef dag_file = 7;
  // The content hash the master expects; the worker reports what it actually ran.
  string expected_code_hash = 8;
  // The upstream outputs the task uses, as JSON; empty if fetched with FetchInputs.
  bytes inputs_json = 9;
  bool inputs_external = 10;
  uint64 cancel_grace_ms = 11;
  uint64 memory_budget_bytes = 12;
  bool setrlimit = 13;
  // The outcomes of the upstream tasks the task uses, by task ID; "" for one that was
  // skipped (its edges count as not taken: a reference to it stands for null).
  map<string, string> upstream_outcomes = 14;
  // The connections of the task's root (decision 174), as schedr-model Registry JSON: the
  // agent renders one when the task opens it. Empty: none.
  bytes connections_json = 15;
  // Only the cleanup of an attempt whose worker was lost (decision 243), with its handles.
  optional CleanupOnly cleanup_only = 16;
  // The task is a resource's cleanup: without a timeout of its own, it gets the worker's
  // `resource_cleanup_timeout` (it isn't cancelled with its run, decision 277).
  bool resource_cleanup = 17;
  // When the task's first try started, for a wait step tried again: `delay` counts from it
  // (M4.11g). Unset on its first try, which counts from its own start.
  google.protobuf.Timestamp first_started = 18;
  // 19 was `start_by_ms`, a start deadline in master time: the master takes an assignment back
  // only once the worker's messages show it never started it (protocol 2.0, B240).
  reserved 19;
}

message CleanupOnly {
  // Each a schedr-model CleanupHandle as JSON, in registration order.
  repeated bytes handle_json = 1;
}

message AssignParse {
  string parse_job_id = 1;
  RootHash root = 2;
}

// `schedr connections check` / `test` (decision 174): one root's connections, rendered or
// opened on this worker beside its tasks (no slot), one job at a time.
message ConnectionJob {
  // The job's ID, answered with.
  string job_id = 1;
  // The root, at the code the worker reported.
  RootHash root = 2;
  // The connections to check, as schedr-model Registry JSON (their files with them).
  bytes connections_json = 3;
  // Set for a test of one connection: open it and run its check.
  optional ConnectionTest test = 4;
}

message ConnectionTest {
  // The connection.
  string name = 1;
  // How long it may take; stopped after.
  uint64 timeout_ms = 2;
}

// A connection job's answer.
message ConnectionJobDone {
  string job_id = 1;
  // Each connection's report, as schedr-model ConnectionReport JSON (never a value).
  repeated bytes report_json = 2;
}

message CancelAttempt {
  string attempt_id = 1;
  // Not cancelled: a drain moves it, so it runs again elsewhere using no retry.
  bool interrupted = 2;
}

message FinishedAck {
  string attempt_id = 1;
}

// ---------------------------------------------------------------- unary calls

message ParsedFile {
  // Relative to the root.
  string path = 1;
  // Each DAG the file defines, as schedr-model DAG JSON.
  repeated bytes dag_json = 2;
  // Set if importing the file failed (including a per-file timeout).
  optional ImportError import_error = 3;
  // Each connection the file defines itself, as schedr-model ConnectionDef JSON (decision
  // 174; never a secret's value).
  repeated bytes connection_json = 4;
  // The script roots its ScriptOperators asked about while it was imported (decision 304).
  repeated string script_roots = 5;
}

// Why a DAG file couldn't be imported (schedr-model ErrorSummary).
message ImportError {
  // The exception's class name; ParseTimeout or RunnerDied when the agent stopped the file.
  string exception = 1;
  string message = 2;
  // The last lines of the traceback.
  string traceback = 3;
}

message ParseResult {
  string parse_job_id = 1;
  string worker_id = 2;
  RootHash root = 3;
  string schedr_version = 4;
  repeated ParsedFile files = 5;
}

// One message of a parse upload: the header first, then the files.
message ParseResultPart {
  oneof part {
    // The job, the root and the versions; its `files` are empty.
    ParseResult header = 1;
    ParsedFile file = 2;
  }
}

message ParseResultAck {}

message FetchInputsRequest {
  string attempt_id = 1;
}

message InputChunk {
  bytes data = 1;
}
