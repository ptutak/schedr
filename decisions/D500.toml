summary = '''
The DAGs page's filters sit beside its table's column titles, in one header row: by DAG a name field (any part of the
id, any case, the list following as one types; `hx-preserve`, so it keeps its focus and typing
across updates), by Trigger the switch (a dropdown of radio buttons, applied on choosing: All, Active, Paused;
a DAG without a trigger only under All) and a Kind dropdown, by Tags a Tags dropdown: lists of boxes, one a line, scrolling, for each trigger kind and tag
the DAGs have (any ticked in a group; the groups together), applied when the dropdown closes,
the live update held while one is open. Each choice is counted among the DAGs the other filters
show. They are in the address (`view`, `trigger`, `name`, repeated `tag` and `kind`), which the
live update keeps; the switch is remembered in the `schedr_dags_trigger` cookie, the rest isn't.
The Runs page has the same style: a DAG name field beside DAG (a part, any case, as one types:
`dag_contains` on `GET /api/v1/runs`: the DAG IDs holding it read from `dags` first, none
asking nothing more, then those DAGs' runs by `runs_by_dag_trigger`, added to migration 0002; a
webserver older than 1.1 refuses the parameter and is asked for the whole DAG ID, the page saying
so) and dropdowns of radio buttons for State and, with
several deployments, Deployment. A Runs page whose read took over `UI__SLOW_READ` (50 ms)
reads again on a change at most every `UI__SLOW_READ_WAIT` (5 s; `data-live-every` on `#live`).
The DAGs page's DAG title sorts the list A to Z or Z to A (`order=desc`, not remembered); the
Runs page stays newest first.
'''
