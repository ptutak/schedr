summary = '''
A plugin gets the observability and control of a task, and more, through protocol 1 (unreleased:
extended freely): a `status` message (phase, message, progress) and `links` (label, URL) shown on
the task and the Extensions page; its own metrics, counters, gauges and histograms with
declared buckets, each declared (name, kind, help, label names) in `--describe` or config,
undeclared ones dropped with a warning; carried as workers' and tasks' figures are today (the
heartbeat, minute samples, 15-minute rollups), charted on a UI page for all extensions and on the
worker's Prometheus `/metrics`; and stop reasons kept within strict turns: SIGTERM to the
plugin's process group as for any task, SIGKILL after the grace, and a plugin wanting the reason
asks `stop_reason_get`, answered with it (cancel, timeout, drain, a lost master) and the grace
left; the worker never sends an unasked message. Before R1.2 (M5.2i5); the
Kubernetes plugin uses every part. Settled: metrics carry the extension's own labels only (no
DAG or task ID); declared in `--describe` and config, config winning; status kept as a history of
phases with their times; links sent whole by the plugin (its own options give base addresses),
shown only for `http` and `https`; the Kubernetes plugin on a drain deletes its Job (retried
elsewhere). Each extension has its own page: the author declares its panels (a title, a metric,
one of our chart kinds: line, rate, stacked, histogram, quantiles, a number, a table by label)
and a little layout (order, width `full` or `half`, titled sections), nothing of style; one
default panel per metric without any; below them, its workers, versions and attempts. Metrics
both ways: the worker's Prometheus `/metrics`, and stored per minute and rolled up per kind
(a counter's growth summed; a gauge's average and peak; a histogram's bucket counts, sum and
count summed over workers). Series bounded: at most `[extensions.<name>] max_series` (100) per
metric, applied by each worker and by the master across workers (and on `/metrics`); a new label
combination past it is folded into one `other` series, never dropped, with one warning and a
note on the extension's page; a label may list its allowed values in its declaration, any other
value counting as `other`.
'''
