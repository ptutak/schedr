[[steps]]
id = "M5.1f1"
title = "The idle cost: one probe a tick, the moments stored"
scope = '''
(decision 485) a standalone with nothing to do (measured 2026-11-14 on the examples' DAGs, SQLite, release build, 10 min): 22.5 queries a second (the 1 s tick's round parts each read their inputs, about 20 kinds), 2.0 % of a core, about 200 context switches a second over its threads, 4.4 MiB written in 10 min, 52 MiB resident. Each tick starts with one probe statement (`Database::probe`) answering for each read a round makes whether it would find anything; a read whose check says no isn't made, and a write ending takes the probe again. Every check reads a stored row or column; a moment worked out from code each tick gets a column: a scheduled DAG's `next_fire_at` (one migration on both databases, with its index). A trigger's moments (an event trigger's window, a generator's `restart_if_idle`) go with the trigger round (M5.1f2); a wait step's `max_wait` was thought to need none (wrong: a master-held `wait_for` step is looked at every tick while it waits; decision 487, built in M5.1f2). The lease, the masters' row, gauges and the notification sender at their own paces
'''
done_when = '''
an idle standalone's statements about 1 a second (22.5), its CPU, wakeups and writes measured before and after over 10 minutes (release build), the polls left each with a reason, the numbers in the guide; a test per check (work for the part makes it true, none false) and per column (its writers keep it, a rebuild from scratch matches what is stored), on both databases; no start, round or trigger latency lost (stress 1, 9, 23)
'''
status = "done"
done = 2026-11-14

[[steps]]
id = "M5.1f2"
title = "Triggers and events in a round of their own"
scope = '''
