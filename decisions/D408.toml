summary = '''
`Notify.RUN_FAILED` (the default set, a server setting), `TASK_FAILED` (after its last retry),
`TASK_RETRY`, `RUN_CANCELLED` (a pure cancel; one with a failure is `RUN_FAILED`),
`RUN_SUCCEEDED`, `RUN_RECOVERED` (a success after the DAG's previous run failed),
`TRIGGER_FAILING` (`[triggers] failing_after` errors in a row, or its generator returned) and
`LATE_CLEANUP_FAILED` (decision 309). `WAITING_FOR_ANSWER` comes with M6.
'''
