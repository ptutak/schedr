section = "What a job says"
summary = '''
Declared outcomes define successful exit codes without an operator enum. An outcomes
enum replaces them and enables enum routing and .outcome. Without one, only declared
DefaultOutcome.SUCCESS can be routed on; other .on selections are parse errors, and so is
.outcome unless SUCCESS is the only outcome declared.
