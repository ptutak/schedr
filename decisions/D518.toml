section = "Extensions"
summary = '''
Beside its per-attempt plugins, an extension may have a service: one long-running process per
worker for what its attempts share (a client, a watch, a warm session), configured as
`[extensions.<name>] service = ["cmd", ...]` beside `command`; without it nothing changes. Any
program speaking our protocol over its control socket (`SCHEDR_SERVICE_FD`); in Python the
functions of `schedr.extension`: `serve(on_call, start=, on_closed=, stop=, name=, versions=)`.
It says `hello`, then `ready` within `service_ready_timeout` (60 s; else a crash); the worker
offers the extension's versions only while it is ready, only those it serves. Each attempt gets
a private connection (option C): a socket pair, one end the plugin's, the other passed to the
service with `attempt_connected {attempt_id, task, version}`; a plugin reaches only its own
extension's service (`await channel.service.call(...)`, an error without one), the worker not
in the data path. A crash (or memory past `service_memory`, 512 MiB) closes the attempts'
connections, their plugins failing them (retries apply), offers withdrawn until ready again,
restarted backing off 1 s to 60 s; past `service_restarts` (5) within `service_settle` (24 h)
the extension is turned off on that worker. Its secrets declared in config
(`service_secrets`), fetched by the worker; its output in the worker's log, tagged; starting,
ready, restarts and turned off as events; its statuses and metrics over the control socket. A
loop stalled past 5 s is warned of (logged and an event). On a drain or turned off: no new
attempts, SIGTERM after the last connected one ends, SIGKILL after the grace. One per worker
(N workers, N clients); recovery stays the cleanup handles'. Not chosen: through the agent, a
socket path; declared in `--describe`; decorators (`Service` with `@service.call`); a probe
for readiness; attempts reconnecting after a restart; one shared across workers.
'''
