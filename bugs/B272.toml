summary = "an `@trigger` generator's logging (warnings, a folder missing, a key masked) goes to its attempt's log file on the worker (`/var/lib/schedr/logs/<worker>/<attempt>.log`), but a trigger belongs to no run: `schedr triggers show` gives its state, failures and last error, and nothing in the UI or the CLI leads to its log"
found = 2026-11-20
