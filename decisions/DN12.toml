summary = '''
CI builds the macOS arm64 wheel only on a release's tag (a job of its own, `if: github.ref_type ==
'tag'`): there it is built and required, as the release takes the four wheels; a push to main no
longer waits for a macOS runner, which wasn't always found (the run went red with no test failed).
