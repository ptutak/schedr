summary = '''
Transient database errors end the stream. A refused Finished becomes an acknowledged, non-retried
result_not_stored failure, retaining duration and usage; other data-fault messages are logged and
dropped. During registration, adopt an open journal attempt whose start record is refused, reserve
its slot, and let the worker send Finished.
