title = "A resource cleanup is a visible task instance"
date = 2026-11-05
by = "user"
status = "active"
topic = "cleanup"
summary = '''
A resource’s cleanup is the visible task `<resource>.cleanup`, using ordinary attempts, retries, logs,
dispatch and lost-worker handling. It retains its execution kind; `Dag.resources` identifies its
cleanup role. Resource state is derived from setup and cleanup tasks, without a `resource_instances`
table.
'''
