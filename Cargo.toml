[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Piotr Tutak <piotr.tutak@amartus.com>"]

[workspace.dependencies]
schedr-model = { path = "crates/schedr-model" }
schedr-proto = { path = "crates/schedr-proto" }
schedr-config = { path = "crates/schedr-config" }
schedr-db = { path = "crates/schedr-db" }
schedr-master = { path = "crates/schedr-master" }
schedr-agent = { path = "crates/schedr-agent" }
schedr-api = { path = "crates/schedr-api" }

# Third-party crates: versions live here only (see PROJECT.md, Repository and tooling: Libraries).
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "parse-value"] }
jiff = { version = "0.2.38", features = ["serde"] }
prost = "0.14.4"
prost-types = "0.14.4"
protoc-bin-vendored = "3.3.0"
schemars = { version = "1.2.3", features = ["jiff02"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

# Test-only crates (see PROJECT.md, Repository and tooling: Testing).
insta = { version = "1.49.0", features = ["json"] }
pretty_assertions = "1.4.1"
rstest = "0.28.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
