summary = '''
From 1.0.0 each image (`schedr`, `schedr-slim`, `schedr-server`) is built twice for x86_64: on
glibc from the manylinux wheel, `python:3.14.8-slim` (Debian), the plain tag (`1.0.0`, `1.0`),
and on Alpine from the musllinux wheel, tagged `-alpine` (`1.0.0-alpine`, `1.0-alpine`). The
plain tag meant Alpine in 0.1.0. The glibc base image takes PostgreSQL 18's client from
PostgreSQL's apt source (Debian 13 has 17, whose `pg_dump` refuses an 18 server). Not chosen: a suffix for glibc; separate image names; Ubuntu;
distroless.
