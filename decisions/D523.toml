topic = "deployment"
section = "Upgrades and compatibility"
summary = '''
The chart's masters are `master.replicas` (1 by default), the Deployment still `Recreate`: an upgrade
stops every master, as with one. With more, each waits as a standby and migrates once it leads
(`master --migrate`), with no migration init container, which would wait for the leader's lease
whatever the schema; they prefer different nodes. A standby isn't ready, so the Service reaches the
leader alone, and `helm --wait` would wait for it. Refused outside mode distributed.
'''
