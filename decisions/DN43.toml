title = "The registration path restructured in 1.3.0: one owner, changes under the core's lock, reads from a published copy (M5.3i)"
date = 2026-11-26
by = "user"
on = "D530"
kind = "corrects"
summary = '''
The registration path is restructured in 1.3.0 (M5.3i, before R1.3), correcting D530: one record
per worker, its session (stream number, sender, heartbeat counter), owned by the core beside its
connection; changed only under the core's lock, by `register_stream`, `end_session` and closing
all, a snapshot of the worker's record restored on any error; read without a lock by the hot paths
from a published copy (a reader's "is my stream current?", `deliver`'s senders), what Arrivals
records tagged with its stream number and dropped with the session. Heartbeat answers stay off
the core's lock (D258). No schema, protocol or configuration change. Shown by stress 1, 23, 17b
and 17c on CI before and after, compared directly. The user, 2026-11-26: "if it's faster it's
worth it ... simpler ... 1.3.0 could be a good place to do it" (D530's reason was the naive form,
everything under the core's lock, which would have slowed the hot paths).
'''
