title = "Airflow migration tools"
order = 90
done_when = "Not set yet (archive/PROJECT.md, Roadmap)."
notes = '''
Moved from M5.2 to M6 (the user, 2026-11-17), after the master's throughput (M5.2); the steps
were M5.2a-f, now M6.1-M6.6. The Airflow migration tool (decisions 470-475) converts Airflow 2
and 3 DAG files into native ones once. The look-alike layer is dropped (decision 475).
'''

[[steps]]
id = "M6.1"
title = "The recording stub and the comparison"
scope = '''
(decisions 470, 475) a stub `airflow` package (Airflow 2 and 3 import paths) that records a DAG file's DAGs as it imports, and a comparison of that record with a native DAG as `schedr dags check` loads it by the paths a run can take (which tasks run, after which, for each way their upstream tasks end; an emulated task compared as the task it stands for) and by schedules, retries, timeouts; the corpus started (Airflow's example DAGs, Apache-2.0)
'''
done_when = '''
the corpus's DAGs recorded; a hand-written native twin of a few compared equal, a changed one reported different
'''
status = "planned"

[[steps]]
id = "M6.2"
title = "The rewrite: the authoring core"
scope = '''
(decisions 470, 471) `schedr airflow migrate --airflow 2|3 <paths> --out <dir>` with LibCST (`schedr[migrate]`): `DAG`/`@dag`, `@task`, the Bash, Python and Empty operators, dependencies (`>>`, `<<`, `chain`, lists), schedules (cron, presets, `timedelta`, `@once`, `None`), `start_date`/`end_date`/`catchup`, `default_args`, retries, timeouts, tags, description, `max_active_*`, params; each mode's forms and defaults (the defaults checked against Airflow 2's and 3's docs), an import contradicting the mode an error; every result compared (M6.1)
'''
done_when = '''
the corpus's DAGs within this scope convert and compare equal; the share converted in the guide
'''
status = "planned"

[[steps]]
id = "M6.3"
title = "Branching, groups, mapping, trigger rules, emulations"
scope = '''
(decisions 472, 473) task groups, `.partial()`/`.expand()`, `@task.branch`/`BranchPythonOperator`, short-circuit, trigger rules onto `NoneFailed`/`AllSucceeded` with the start anchor and dropped edges, `all_done` leaves and `@setup`/`@teardown` onto resources; what has no exact form under TODO comments
'''
done_when = '''
each translation with a corpus or hand-written case compared equal; each refusal with its report line
'''
status = "planned"

[[steps]]
id = "M6.4"
title = "Templates, XCom, sensors, chained runs, email"
scope = '''
(decision 472) Jinja in `bash_command` and templated fields (`ds`, `params`, `ti.xcom_pull`, ...) onto the task context and outputs; XCom pulls onto outputs; the standard sensors onto wait steps; `TriggerDagRunOperator` onto `TriggerDagOperator`; `email`/`email_on_failure`/`email_on_retry` onto channels; what isn't exact reported
'''
done_when = '''
the corpus's uses converted or reported, the report's counts in the guide
'''
status = "planned"

[[steps]]
id = "M6.5"
title = "Connections and Variables"
scope = '''
(decision 474) `airflow connections export` / `airflow variables export` JSON into schedr connection definitions and secrets (`schedr airflow migrate-connections`); provider operators counted in the report
'''
done_when = '''
the common connection types (Postgres, MySQL, HTTP, SSH, S3) converted and checked with `schedr connections check`; secrets never written in plain text
'''
status = "planned"

[[steps]]
id = "M6.6"
title = "The report and the migration guide"
scope = '''
the report (Markdown and JSON per DAG and a summary), a guide page on migrating from Airflow (what converts, what to do with each TODO), the corpus's conversion rate
'''
done_when = '''
the guide page; the corpus's rate measured and stated
'''
status = "planned"
