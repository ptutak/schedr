summary = '''
A worker’s move to an unseen hash or one recorded before the hash it left makes that hash newest;
moving to a later-recorded hash is catching up. Compare with the worker’s previous report, including
across reconnects. An unseen hash is newest on first report; a revert while the master was down is
not detected as a switch.
