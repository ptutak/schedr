[[steps]]
id = "M5.3f"
title = "The kind tests on CI, then chaos on kind"
scope = '''
(the user, 2026-11-25, after B296 was found only because a kind test ran, and B295 sat unseen since 2026-11-11) a GitHub Actions workflow running the kind scripts (`kind-standby.sh`, then `kind-distributed.sh`, `kind-kill.sh`, `kind-standalone.sh`), nightly in the Stress workflow, a job beside its plan and the simulator (the user, 2026-11-25), and by hand; never on each push; its first run by hand is M5.3h's; here on images of the commit, from CI's wheel. To settle when it starts: which runs when, the pins (kind, its node image, kubectl, helm), and how much slack the takeover limits need on a shared runner; whether the runner has what it takes is checked first (kind's and Docker's presence isn't verified yet). Then, as its second part, chaos on kind (the user, 2026-11-25: "the flakiness is what we invite, first - the test has to show something breaking", "what shouldn't change is the guarantees of our product so the test has to test exactly that, so probably less timing tests, more correctness tests"): a seeded schedule of faults a loopback proxy can't make, on a cluster of several nodes: a node's death (a master's, a worker's), packets dropped between a worker and the master and to Postgres, one way or both, Postgres restarted, a worker evicted or moved, DNS gone. It checks the guarantees page's statements and the stress suite's invariants only (no task run twice but as decisions 280 and 460 allow, none lost or left running, a cleanup once, no run stuck), not how fast it is. Of time there are three kinds (agreed with the user, 2026-11-25, on B296: a missing limit that broke a guarantee): how fast something is (tasks a second, a round's p99) is not checked here; a time schedr's own rules depend on is, as part of the guarantee (a fault shorter than the lease loses nothing, past it the cleanup moves once), so the schedule notes when each fault began and ended and the checks read it, with a margin; that something happens at all (a worker back, a run ended) is, with a generous limit, as "never" is told from "not yet" only by waiting. The tasks' marks go where pods can all write (a Postgres table, say), as the suite's shared file can't. A failure must be understood from its record, without running it again (the user, 2026-11-25: the seed alone won't replicate it): every fault as executed (command, output, exit code, the moment before and after, its target by identity: pod UID, container ID, node, PID) beside the schedule the seed computed, and what was undone and when; every container's log streamed while the run goes, those that died included; the database at the end and its key rows (attempts, workers, the lease and its epoch, the marks) at each fault; every role's metrics before and after each fault; Kubernetes's events and pod states as they changed, `kind export logs`, the node's network rules when a fault applies; one merged timeline in UTC to the millisecond (kind's nodes share the host's clock), filterable by a run's or an attempt's ID; the versions and pins and the runner's CPU, memory and I/O stall. Kept on every night, passing or not, compressed for some days. Then a replay mode: a failed run's faults applied again at their recorded offsets. Debug-level logs only for the parts under test. The faults (the user, 2026-11-25: all of them), each picked by the seeded schedule: masters (the leader's node dying, not its pod; the leader frozen and thawed after a standby leads, against the fence; both restarted in a loop during registrations); the network inside a node's namespace (packets dropped one way or both between a worker and the master; delay and jitter without loss; DNS gone, CoreDNS at 0; kube-proxy stopped, a Service not following its endpoints); Postgres (killed or restarted; frozen; behind a PgBouncer that restarts); workers (killed mid-task, mid-cleanup, mid-journal write; a node drained; its volume full; memory pressure and eviction); Kubernetes's own (a StatefulSet pod back under its name on another node, its volume kept or not; the chart's certificates rotated under load; a rolling chart upgrade under load). First built: a node's death, dropped packets, Postgres killed, a rolling upgrade under load. Out of kind's reach, said so: clock skew between nodes (the simulator's), a partition between real machines. To settle: what each guarantee's check reads
'''
done_when = '''
the workflow run by hand on a commit's own images; the chaos on kind a nightly job of the Stress workflow; a seeded chaos run on kind holding the guarantees over several seeds, shown to catch one broken on purpose (B296's fix taken out, say), in the same workflow
'''
status = "planned"

