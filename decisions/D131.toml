summary = '''
The webserver masks log text and output texts, names and fields named by secret words when shown.
Log parts use whole lines and 64 KiB of preceding masking context; UI and CLI use 1 MiB parts, with
oversized lines visibly cut and their remainder skipped. Ordinary downstream tasks receive stored
outputs, already masked for secret values by the agent under D167; `RunOf` readers receive API-
masked outputs.
'''
