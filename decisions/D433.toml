summary = '''
`[retention]` defaults as archived: `runs`, `outputs` and `events` 90 days, `commands` 365 days;
`outputs` and `events` default to `runs` when only it is set; `"forever"` turns any of them off.
An upgraded deployment starts deleting what is older at once.
