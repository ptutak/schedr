title = "a worker reporting an instance the master doesn't know holds every wait_for trigger until it stops it"
severity = "medium"  # critical, high, medium, low
probability = "rare"  # likely, possible, rare
kind = "security"  # security, data, correctness, reliability, performance, usability, tests
summary = "`triggers_on_register` keeps an unknown reported trigger instance in `stopping_triggers` with an empty DAG ID, and `may_start` then holds every `@trigger(wait_for=...)` DAG until that worker reports it stopped; a compromised worker that never does stalls them all (decision 520's trust model: one worker reaches only its own)"
found = 2026-11-22
suspected = false
details = '''
- **Found:** 2026-11-22, by agy, in its review of M5.2i14 (its finding 4, the first half; the
  second half, another worker's slot freed, fixed in M5.2i14).
- **Why it holds everything:** after a master's restart an instance a worker still runs is known
  only by its ID, not its DAG, so the master can't tell which DAG's single trigger it is; the
  wait is right for an honest worker, which stops it at once when told.
- **A fix:** bound the wait (an unknown instance stops counting after the trigger stop grace),
  or have the worker report its instances' DAG IDs in `Register`, checked against the trigger
  records.
'''
