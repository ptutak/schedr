summary = '''
The task result is reported when its process ends and retained while the instance is `cleaning_up`;
`Finished` settles the cleanup and attempt. Worker loss preserves that result without rerunning
completed work. The cleanup moves when `cleanup_anywhere` permits it; otherwise it is recorded as
`worker_lost`.
