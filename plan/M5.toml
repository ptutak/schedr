[[steps]]
id = "M5.7"
title = "The start time from the worker"
scope = '''
nice to have (the user, 2026-11-13): `Started` carries the worker's start time (an additive protocol field, minor version), turned into master time with the worker's estimate (decision 448), recorded as `started_at`; the master's own time for an older worker. Today `started_at` is the master's time when it handles the message, so it includes the wait for the core's lock
'''
done_when = '''
`started_at` within the clock-skew bound of the worker's start under stress 9, 13 and 23; an older worker's falls back; a "started → recorded" figure in the stress report
'''
status = "planned"
