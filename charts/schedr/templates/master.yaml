{{- if eq .Values.mode "distributed" }}
{{- include "schedr.checkTls" . -}}
{{- $fullname := include "schedr.fullname" . }}
{{- $m := .Values.master }}
# schedr master: the scheduling loop and the workers' gRPC service. One replica, replaced by
# stopping the old one first (Recreate): it gives up the master's lease, so the new one can
# take it and migrate (a second replica as a standby would stall every rollout, its migration
# waiting for the lease the old master holds).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-master
  labels:
    {{- include "schedr.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "schedr.roleSelector" (list . "master") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "schedr.roleSelector" (list . "master") | nindent 8 }}
        {{- if .Values.istio.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with include "schedr.podAnnotations" (list . $m.podAnnotations) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "schedr.roleServiceAccount" (list . "master") }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "schedr.podSecurityContext" . | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if eq .Values.migration "initContainer" }}
      initContainers:
        # The schema migrated as a step of its own, holding the master's lease (`--wait`
        # waits out the lease of a master that died).
        - name: migrate
          image: "{{ $m.image.repository }}:{{ $m.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $m.image.pullPolicy }}
          args: ["db", "migrate", "--wait"]
          env:
            {{- include "schedr.databaseEnv" . | trim | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: schedr
          image: "{{ $m.image.repository }}:{{ $m.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $m.image.pullPolicy }}
          {{- if eq .Values.migration "onStart" }}
          # Migrated by the master itself once it holds the lease, only a schema not up to date.
          args: ["master", "--migrate"]
          {{- else }}
          args: ["master"]
          {{- end }}
          env:
            - name: SCHEDR_CONFIG__MASTER__GRPC_PORT
              value: {{ .Values.service.grpcPort | quote }}
            - name: SCHEDR_CONFIG__OPS__PORT
              value: {{ .Values.service.opsPort | quote }}
            {{- include "schedr.tlsEnv" (list . "master") | trim | nindent 12 }}
            {{- include "schedr.databaseEnv" . | trim | nindent 12 }}
          ports:
            - name: {{ include "schedr.grpcPortName" . }}
              containerPort: {{ .Values.service.grpcPort }}
            - name: http-ops
              containerPort: {{ .Values.service.opsPort }}
          # Ready once it leads (a master waiting for the lease or its migration: not ready).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-ops
            periodSeconds: 10
          # Fails only when the scheduling loop is stuck, never because the database is down.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-ops
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          {{- if eq .Values.tls.mode "app" }}
          volumeMounts:
            - name: tls
              mountPath: /etc/schedr/tls
              readOnly: true
          {{- end }}
      {{- if eq .Values.tls.mode "app" }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "schedr.tlsSecret" (list . "master") }}
      {{- end }}
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# The workers' way to the master (its certificate names this Service's names).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-master
  labels:
    {{- include "schedr.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "schedr.roleSelector" (list . "master") | nindent 4 }}
  # Named for Istio's protocol detection.
  ports:
    - name: {{ include "schedr.grpcPortName" . }}
      port: {{ .Values.service.grpcPort }}
      targetPort: {{ include "schedr.grpcPortName" . }}
    - name: http-ops
      port: {{ .Values.service.opsPort }}
      targetPort: http-ops
{{- end }}
