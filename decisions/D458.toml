title = "A sensor poke tolerates overruns of every: it fails after poke_overruns in a row, or one at three times every"
date = 2026-11-12
by = "user"  # user, claude
status = "active"  # active, superseded, dropped, untraced
topic = "wait-steps"
section = "What a wait step is"
summary = '''
Calls of a sensor's poke never overlap. A call past `every` is an overrun: it may finish, and
the next call comes right after it. The poke fails (`PokeTooSlowError`, the usual retries)
after `[watchers] poke_overruns` overruns in a row (3; 1 fails at the first, as decision 322
did), or at once when one call runs three times `every`, when it is cancelled. A call that
doesn't reach an `await` stays under `[watchers] block_limit`. A trigger's poke is unchanged:
a call past `every` is an error on its status, and the next comes. Not chosen: failing at the
first overrun (a busy machine failed real runs); a margin on each call alone; a per-sensor
option.
'''
