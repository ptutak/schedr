topic = "code-delivery"
section = "What is parsed"
summary = '''
Non-transient file errors hold every DAG of that file, including InvalidDag, InvalidPath and
ParseResultTooLarge; these rejections are not retried. Held DAGs create no runs, reject manual
triggers and leave queued runs waiting; running runs continue, and missed fire times follow catchup
after repair. ParseTimeout and RunnerDied hold nothing; transiently failed files retry indefinitely,
starting after 30 s and doubling to 10 min, preferring another worker. Holds and their file-level
reasons appear in the API, UI, CLI, metrics and logs.
'''
