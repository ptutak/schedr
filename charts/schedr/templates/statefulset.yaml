{{- include "schedr.checkMode" . -}}
{{- include "schedr.checkMigration" . -}}
{{- include "schedr.checkDags" . -}}
{{- if eq .Values.mode "standalone" }}
# schedr standalone: every role in one pod. Exactly one replica: on SQLite a second pod can't
# share the volume; on Postgres a second master would wait as a standby (the master's lease),
# so a rollout overlap is harmless, but there is nothing to gain from more.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "schedr.fullname" . }}
  labels:
    {{- include "schedr.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "schedr.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "schedr.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "schedr.selector" . | nindent 8 }}
        {{- if .Values.istio.enabled }}
        {{- /* The label for Istio, the annotation below for OpenShift Service Mesh 2. */}}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with include "schedr.podAnnotations" (list . .Values.podAnnotations) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "schedr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* The data volume writable by the image's group (0); OpenShift sets its own. */}}
      {{- with include "schedr.podSecurityContext" . | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if eq .Values.migration "initContainer" }}
      initContainers:
        # The schema migrated as a step of its own, before schedr starts (which refuses one
        # not up to date). Holding the master's lease: `--wait` waits out the lease of a
        # master that died.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["db", "migrate", "--wait"]
          env:
            {{- include "schedr.databaseEnv" . | trim | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/schedr
      {{- end }}
      containers:
        - name: schedr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $args := list "standalone" "--listen" "0.0.0.0" }}
          {{- /* Migrated by schedr itself once it holds the master's lease, only when the
          schema isn't up to date. */}}
          {{- if eq .Values.migration "onStart" }}{{ $args = append $args "--migrate" }}{{ end }}
          {{- /* The API only: one deployment of a `schedr ui` elsewhere. */}}
          {{- if not .Values.standalone.ui }}{{ $args = append $args "--no-ui" }}{{ end }}
          args: {{ toJson $args }}
          env:
            {{- include "schedr.dagEnv" . | trim | nindent 12 }}
            {{- with include "schedr.forkServerEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: SCHEDR_CONFIG__WORKER__DATA_DIR
              value: /var/lib/schedr
            # The pod's grace period, so the drain fits it.
            - name: SCHEDR_CONFIG__WORKER__TERMINATION_GRACE_PERIOD
              value: "{{ .Values.terminationGracePeriodSeconds }}s"
            - name: SCHEDR_CONFIG__OPS__PORT
              value: {{ .Values.service.opsPort | quote }}
            - name: SCHEDR_CONFIG__WEBSERVER__PORT
              value: {{ .Values.service.apiPort | quote }}
            {{- include "schedr.databaseEnv" . | trim | nindent 12 }}
            {{- include "schedr.authEnv" (list . .Values.webserver.auth "WEBSERVER") | trim | nindent 12 }}
            {{- if .Values.webserver.uiTokenSecret.name }}
            - name: SCHEDR_CONFIG__WEBSERVER__UI_TOKEN_FILE
              value: /etc/schedr/ui-token/{{ .Values.webserver.uiTokenSecret.key }}
            {{- end }}
          ports:
            - name: http-api
              containerPort: {{ .Values.service.apiPort }}
            - name: http-ops
              containerPort: {{ .Values.service.opsPort }}
          # Ready once every part has started (a standby master waits: not ready).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-ops
            periodSeconds: 10
          # Fails only when the scheduling loop or the worker agent is stuck, never because
          # the database or anything else is down.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-ops
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/schedr
            {{- with include "schedr.dagMounts" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.webserver.uiTokenSecret.name }}
            - name: ui-token
              mountPath: /etc/schedr/ui-token
              readOnly: true
            {{- end }}
            {{- include "schedr.authMount" .Values.webserver.auth | trim | nindent 12 }}
        {{- with include "schedr.gitSync" . | trim }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- $volumes := include "schedr.dagVolumes" . | trim }}
      {{- if .Values.webserver.uiTokenSecret.name }}
      {{- $volumes = printf "%s\n- name: ui-token\n  secret:\n    secretName: %s" $volumes .Values.webserver.uiTokenSecret.name | trim }}
      {{- end }}
      {{- with include "schedr.authVolume" .Values.webserver.auth | trim }}
      {{- $volumes = printf "%s\n%s" $volumes . | trim }}
      {{- end }}
      {{- with $volumes }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
