title = "Only database trouble ends a worker stream"
date = 2026-10-31
by = "user"
status = "active"
topic = "workers"
section = "Identity and connection"
summary = '''
Transient database errors end the stream; a statement cut off at the query limit (or its wait
for a connection) is first tried once more at once, a fresh one, so a master frozen in a
statement ends no stream on its thaw (B263, the user, 2026-11-18). A refused Finished becomes an acknowledged, non-retried
result_not_stored failure, retaining duration and usage; other data-fault messages are logged and
dropped. During registration, adopt an open journal attempt whose start record is refused, reserve
its slot, and let the worker send Finished.
'''
