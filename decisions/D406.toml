summary = '''
`.partial()` and `.expand()` are on `@task` functions and on `TriggerDagOperator` only:
`CommandOperator`, `ScriptOperator` and `EmptyOperator` can't be mapped. The official ways to run a
command or script per element: a mapped `@task` starting the process, or a mapped
`TriggerDagOperator` whose target DAG runs the operator on its params (a `for` loop in the DAG file
for a list known when it loads). Wait steps aren't mapped either (Q21, deferred to M6).
