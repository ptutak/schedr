{{- include "schedr.checkMode" . -}}
{{- include "schedr.checkMigration" . -}}
{{- include "schedr.checkGitCredentials" . -}}
{{- if and .Values.gitSync.enabled (not .Values.dagsPath) }}
{{- fail "gitSync.enabled needs dagsPath (where the repository is kept)" }}
{{- end }}
{{- if and .Values.dags.files .Values.dagsPath (eq ((.Values.dagsRoot | default (base .Values.dagsPath)) | lower) "files") }}
{{- fail "dagsPath's root would be named `files`, the name of dags.files' root: set dagsRoot to another name" }}
{{- end }}
{{- if not (or .Values.dagsPath .Values.dags.files) }}
{{- fail "no DAG root: set dagsPath (DAGs in the image, or gitSync) or dags.files (charts/schedr/dags-values.sh)" }}
{{- end }}
{{- $roots := list }}
{{- with .Values.dagsPath }}{{ $roots = append $roots . }}{{ end }}
{{- if .Values.dags.files }}{{ $roots = append $roots "/dag-files/..data" }}{{ end }}
# schedr standalone: every role in one pod. Exactly one replica: on SQLite a second pod can't
# share the volume; on Postgres a second master would wait as a standby (the master's lease),
# so a rollout overlap is harmless, but there is nothing to gain from more.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "schedr.fullname" . }}
  labels:
    {{- include "schedr.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "schedr.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "schedr.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "schedr.selector" . | nindent 8 }}
        {{- if .Values.istio.enabled }}
        {{- /* The label for Istio, the annotation below for OpenShift Service Mesh 2. */}}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $annotations := deepCopy (.Values.podAnnotations | default dict) }}
      {{- if .Values.istio.enabled }}
      {{- /* schedr starts once its proxy is ready (it reaches the database through it), and
      the proxy stays until schedr's connections close: a drain's results still reach the
      database (without this the proxy stops 5 s after SIGTERM). */}}
      {{- $_ := set $annotations "sidecar.istio.io/inject" "true" }}
      {{- /* Merged into proxy settings of podAnnotations, if any. */}}
      {{- $proxy := fromYaml (index $annotations "proxy.istio.io/config" | default "{}") }}
      {{- $_ := set $proxy "holdApplicationUntilProxyStarts" true }}
      {{- $metadata := $proxy.proxyMetadata | default dict }}
      {{- $_ := set $metadata "EXIT_ON_ZERO_ACTIVE_CONNECTIONS" "true" }}
      {{- $_ := set $proxy "proxyMetadata" $metadata }}
      {{- $_ := set $annotations "proxy.istio.io/config" (toJson $proxy) }}
      {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "schedr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* The data volume writable by the image's group (0); OpenShift sets its own. */}}
      {{- $podSecurity := deepCopy (.Values.podSecurityContext | default dict) }}
      {{- if not (or (hasKey $podSecurity "fsGroup") (.Capabilities.APIVersions.Has "security.openshift.io/v1")) }}
      {{- $_ := set $podSecurity "fsGroup" 0 }}
      {{- end }}
      {{- with $podSecurity }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.migration "initContainer" }}
      initContainers:
        # The schema migrated as a step of its own, before schedr starts (which refuses one
        # not up to date). Holding the master's lease: `--wait` waits out the lease of a
        # master that died.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["db", "migrate", "--wait"]
          env:
            {{- include "schedr.databaseEnv" . | trim | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/schedr
      {{- end }}
      containers:
        - name: schedr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq .Values.migration "onStart" }}
          # Migrated by schedr itself once it holds the master's lease, only when the schema
          # isn't up to date.
          args: ["standalone", "--listen", "0.0.0.0", "--migrate"]
          {{- else }}
          args: ["standalone", "--listen", "0.0.0.0"]
          {{- end }}
          env:
            - name: SCHEDR_DAG_PATH
              value: {{ join ":" $roots | quote }}
            {{- if and .Values.dagsPath .Values.dagsRoot }}
            - name: SCHEDR_CONFIG__DAGS__ROOTS__{{ .Values.dagsRoot | upper | replace "-" "_" }}
              value: {{ .Values.dagsPath | quote }}
            {{- end }}
            {{- if .Values.dags.files }}
            # The ConfigMap's files: its `..data` link, which the kubelet switches to each new
            # version, as git-sync switches its link (the files beside it are links through it).
            - name: SCHEDR_CONFIG__DAGS__ROOTS__FILES
              value: /dag-files/..data
            {{- end }}
            - name: SCHEDR_CONFIG__WORKER__DATA_DIR
              value: /var/lib/schedr
            # The pod's grace period, so the drain fits it.
            - name: SCHEDR_CONFIG__WORKER__TERMINATION_GRACE_PERIOD
              value: "{{ .Values.terminationGracePeriodSeconds }}s"
            - name: SCHEDR_CONFIG__OPS__PORT
              value: {{ .Values.service.opsPort | quote }}
            - name: SCHEDR_CONFIG__WEBSERVER__PORT
              value: {{ .Values.service.apiPort | quote }}
            {{- include "schedr.databaseEnv" . | trim | nindent 12 }}
          ports:
            - name: http-api
              containerPort: {{ .Values.service.apiPort }}
            - name: http-ops
              containerPort: {{ .Values.service.opsPort }}
          # Ready once every part has started (a standby master waits: not ready).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-ops
            periodSeconds: 10
          # Fails only when the scheduling loop or the worker agent is stuck, never because
          # the database or anything else is down.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-ops
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/schedr
            {{- if .Values.gitSync.enabled }}
            - name: dags
              mountPath: {{ dir .Values.dagsPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.dags.files }}
            - name: dag-files
              mountPath: /dag-files
              readOnly: true
            {{- end }}
        {{- if .Values.gitSync.enabled }}
        {{- $git := .Values.gitSync.credentials }}
        - name: git-sync
          image: {{ .Values.gitSync.image }}
          args:
            - --repo={{ required "gitSync.repo is required with gitSync.enabled" .Values.gitSync.repo }}
            - --ref={{ .Values.gitSync.ref }}
            - --root={{ dir .Values.dagsPath }}
            - --link={{ base .Values.dagsPath }}
            - --period={{ .Values.gitSync.period }}
          {{- if or $git.secret .Values.gitSync.env }}
          env:
            {{- if eq $git.type "token" }}
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $git.secret }}
                  key: {{ $git.usernameKey }}
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $git.secret }}
                  key: {{ $git.passwordKey }}
            {{- else if eq $git.type "ssh" }}
            - name: GITSYNC_SSH_KEY_FILE
              value: /etc/git-secret/ssh
            - name: GITSYNC_SSH_KNOWN_HOSTS_FILE
              value: /etc/git-secret/known_hosts
            {{- end }}
            {{- with .Values.gitSync.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: dags
              mountPath: {{ dir .Values.dagsPath }}
            {{- if eq $git.type "ssh" }}
            - name: git-secret
              mountPath: /etc/git-secret
              readOnly: true
            {{- end }}
        {{- end }}
      {{- if or .Values.gitSync.enabled .Values.dags.files }}
      volumes:
        {{- if .Values.gitSync.enabled }}
        - name: dags
          emptyDir: {}
        {{- if eq .Values.gitSync.credentials.type "ssh" }}
        - name: git-secret
          secret:
            secretName: {{ .Values.gitSync.credentials.secret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.gitSync.credentials.sshKeyKey }}
                path: ssh
              - key: {{ .Values.gitSync.credentials.knownHostsKey }}
                path: known_hosts
        {{- end }}
        {{- end }}
        {{- if .Values.dags.files }}
        - name: dag-files
          configMap:
            # Every key a file of its name: no `items`, so files come and go without a restart.
            name: {{ include "schedr.fullname" . }}-dags
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
