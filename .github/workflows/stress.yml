name: Stress

# The stress suite (crates/schedr/tests/stress, PLAN.md 2.10b): nightly when main changed since
# the last passing run, and by hand (any profile). Not on each push: see ci.yml. Beside it,
# the clock simulator (decision 446) with many more scenarios than a push runs.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "quick (sized for 2 CPUs and 7 GB, scaled up on bigger runners) or full"
        default: quick
        type: choice
        options: [quick, full]
      filter:
        description: "Only scenarios whose name matches (a regular expression); empty for all"
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: docker.io/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_PASSWORD: schedr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # Transaction pooling in front of the same server, any database name passed through.
      pgbouncer:
        image: docker.io/edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: schedr
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: "1000"
          DEFAULT_POOL_SIZE: "40"
        ports:
          - 6432:5432
    env:
      SCHEDR_TEST_POSTGRES_URL: postgres://postgres:schedr@127.0.0.1:5432/postgres
      SCHEDR_TEST_PGBOUNCER: 127.0.0.1:6432
      SCHEDR_STRESS_PROFILE: ${{ inputs.profile || 'quick' }}
    steps:
      # Nightly: when main is where the last passing run left it, only the random chaos runs,
      # with a fresh seed (M4.8z: a new seed each night).
      - name: Changed since the last passing run?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stress.yml/runs?status=success&branch=main&per_page=1" \
            | python3 -c 'import json, sys; runs = json.load(sys.stdin)["workflow_runs"]; print(runs[0]["head_sha"] if runs else "")')
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "main unchanged since the last passing run ($last): the random chaos only"
            echo "only=stress_21_random_chaos" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.149
      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz: checked whatever the action knows.
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      # As `make stress`: room for the suite's connections (a service container takes no
      # arguments, so set and restarted; PgBouncer reconnects on its own).
      - if: steps.changed.outputs.run == 'true'
        name: Postgres with max_connections = 500
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET max_connections = 500"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; do sleep 1; done
      - if: steps.changed.outputs.run == 'true'
        run: uv sync --python 3.14
      - if: steps.changed.outputs.run == 'true'
        run: echo "SCHEDR_TEST_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - if: steps.changed.outputs.run == 'true'
        name: Stress suite
        # The filter through the environment, never pasted into the script.
        env:
          FILTER: ${{ inputs.filter || steps.changed.outputs.only }}
        run: |
          filter=()
          if [ -n "$FILTER" ]; then filter=(-E "test(/$FILTER/)"); fi
          cargo nextest run -p schedr --test stress --test-threads 1 --no-fail-fast --no-capture "${filter[@]}"
      - if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-report-${{ github.run_id }}
          path: target/stress/
          if-no-files-found: warn

  # The clock simulator's master side with 600 fresh scenarios every night, whether main changed
  # or not (each push runs the same dozen): the faults that break a rule need rare timings
  # (B234 came from 60). A failure prints the smallest scenario.
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.149
      - name: Clock simulator, 600 scenarios
        env:
          PROPTEST_CASES: "600"
        run: >-
          cargo nextest run -p schedr-agent --test clock_sim --no-capture
          -E 'test(the_master_and_its_workers_keep_the_rules_whatever_the_faults)'
