summary = '''
An extension declares its own notification events in its plugin's `hello`, as it declares its
metrics (a name and a help, config winning), and sends one with `notify` (an event, a text, its
data; no answer) while it runs; a DAG subscribes to all of them with one `Notify.EXTENSION_EVENT`, no narrowing
(corrected by DN20), the body carrying the extension, its version, the event's name, its text and
data, and the DAG, run and task. An event not
declared is dropped with one warning. Helpers in the Python helper and the Rust crate. Beside it, for
every DAG: `RUN_STARTED` for every run with its `reason` (`schedule`, `backfill`, `trigger`,
`chain` with `via` `triggered` or `run_of`, `manual`), and `EVENT_POSTED` to the DAGs listening
for the event's name, saying whether it started a run (corrected by DN18). Not chosen: only helpers for
today's plain `MESSAGE` to a named channel; a later step. A task's own `notify=` not chosen now.
'''
