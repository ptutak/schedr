summary = "A try of a task whose cleanup may move (`cleanup_anywhere`) ran, was stopped by its worker's cutoff during dropped packets to that worker, and was set lost; its cleanup never ran anywhere, and the master's record of the try has no worker (lost tries otherwise keep theirs). Seen once: chaos on kind, seed 7, on M5.3i's `d2227ae6` (Stress run 45861804673, attempt 2); seeds 2 and 11 passed, and seed 7 passed on the baseline `dfa4bb5f` (locally)."
