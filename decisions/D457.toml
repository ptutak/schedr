section = "Pages and live updates"
summary = '''
The DAG list's and the DAG page's Schedule becomes Trigger: the kind (`Schedule` for cron,
every and once, `Run of`, `Chained`, `Event` for `@trigger` and `EventNamed`, `Manual` for
none), then the trigger as the CLI
writes it, nothing after `Manual`. The list shows a DAG's description under its id, one line,
all of it on hover. A DAG without a trigger has neither Pause nor Unpause: it has only manual
runs, which pausing doesn't stop. Not chosen: the API's kind names (`Cron`, `Every`, `RunOf`,
`None`); a greyed-out button.
'''
