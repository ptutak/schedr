section = "`@trigger` and `@trigger.poke`"
summary = '''
`@trigger.poke(batch=...)` gathers a window in Python and stores each item individually. One run
receives only its new items as `list[Event[T]]`, keyed by the last new item; no new items means no
run. The bookmark advances to the window's last key, including a repeat. Replaying an individual key
produces a singleton batch.
'''
