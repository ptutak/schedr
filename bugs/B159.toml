summary = "`schedr-master`'s `a_registration_with_more_new_roots_than_a_stream_holds_gets_every_parse` (B45's test) takes 4.3-4.8 s alone, and its registration has 10 s to answer: in a full `make check` (2008 tests, the machine busy) it ran out once, `registered in time: Elapsed(())` at `crates/schedr-master/src/service/tests.rs:1557`"
