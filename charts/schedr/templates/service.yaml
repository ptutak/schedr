{{- include "schedr.checkMode" . -}}
{{- if ne .Values.mode "ui" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "schedr.fullname" . }}
  labels:
    {{- include "schedr.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # The API, whichever pod serves it: the same name in both modes, so clients and a
  # VirtualService stay as they are when moving to distributed.
  selector:
    {{- if eq .Values.mode "distributed" }}
    {{- include "schedr.roleSelector" (list . "webserver") | nindent 4 }}
    {{- else }}
    {{- include "schedr.selector" . | nindent 4 }}
    {{- end }}
  # Named for Istio's protocol detection.
  ports:
    - name: http-api
      port: {{ .Values.service.apiPort }}
      targetPort: http-api
    - name: http-ops
      port: {{ .Values.service.opsPort }}
      targetPort: http-ops
    {{- if and (eq .Values.mode "distributed") (eq .Values.tls.mode "app") }}
    # The webserver's port for a web UI alone, this release's or another's (mTLS: passed
    # through by a sidecar).
    - name: tls-ui
      port: {{ .Values.service.webserverUiPort }}
      targetPort: tls-ui
    {{- else if include "schedr.meshUiPort" . }}
    # The webserver's port for a web UI alone, admitted by Istio's policy only (40A).
    - name: http-ui
      port: {{ .Values.service.webserverUiPort }}
      targetPort: http-ui
    {{- end }}
{{- end }}
