# schedr's chart. The API's Swagger UI is at /api/v1/docs.
# - standalone: every role (master, API, worker) in one pod, on SQLite or Postgres: the start.
# - distributed: the master, the webserver and the workers in pods of their own, on Postgres
#   (the sections master, webserver and worker below), and the web UI in one more (ui.enabled).
#   Moving there is one upgrade with mode: distributed on the same Postgres; the other values
#   mean the same in both modes.
# - ui: the web UI alone (`schedr ui`), over the deployments listed in ui.deployments, e.g. a
#   federation of standalones (standalone.ui: false) and distributed releases elsewhere.
mode: standalone

# mode standalone: whether its pod serves the web UI at / next to its API (false: the API
# only, one deployment of a `schedr ui` elsewhere).
standalone:
  ui: true

image:
  # The image running tasks (standalone's pod, distributed's workers): the schedr base image,
  # or yours built FROM it with more libraries (examples/kubernetes/Dockerfile).
  repository: schedr
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

database:
  # The database, one of three (any connection pooler, PgBouncer in either mode, works in
  # between):
  # - neither existingSecret nor postgres.host: SQLite in the data directory, on the pod's
  #   volume (the start);
  # - postgres.host: Postgres, the URL built here with the user and password of a Secret;
  # - existingSecret: Postgres, the whole URL (password included) in a Secret.
  # Switching from SQLite to Postgres is one upgrade with postgres (or existingSecret) set:
  # schedr starts afresh on the empty database (migrated as `migration` says); the volume
  # keeps its logs and journal, and the SQLite file stays behind on it.
  postgres:
    # e.g. postgres.schedr.svc, or a pooler
    host: ""
    port: 5432
    # The database's name.
    name: schedr
    # Appended to the URL after `?`, e.g. sslmode=require.
    params: ""
    # A Secret holding the user and password (created by hand, or by the vault section).
    # They go into the URL as they are: neither may contain any of @ : / ? # % or a space.
    existingSecret: ""
    userKey: username
    passwordKey: password
    # A host (and port) straight to Postgres, past a pooler, used only for listening (see
    # notifications), with the same user and password. Empty: the main host.
    notificationsHost: ""
    notificationsPort: 5432
  existingSecret: ""
  secretKey: url
  # New commands applied at once (Postgres LISTEN) instead of at the master's next round.
  # Behind a pooler in transaction mode the master finds out, warns and polls; false silences
  # that.
  notifications: true
  # A key of existingSecret holding a URL straight to Postgres, past a pooler, used only for
  # listening: immediate commands behind a pooler in transaction mode. Empty: the main URL.
  # (With postgres.host: postgres.notificationsHost instead.)
  notificationsUrlKey: ""

persistence:
  # The data directory: the SQLite database (without Postgres), task logs, the worker's
  # journal. ReadWriteOnce on block storage, never a network filesystem (NFS, CephFS): SQLite's
  # locks aren't reliable there.
  size: 10Gi
  storageClass: ""

# How the schema is migrated, holding the master's lease, only when it isn't up to date:
# - initContainer: `schedr db migrate --wait` in an init container, before schedr starts;
# - onStart: schedr itself, at start (`--migrate`). Use it under Istio with classic sidecars:
#   an init container runs before the pod's proxy, so it can't reach the database through the
#   mesh (native sidecars, Kubernetes 1.29 on, don't have this problem).
migration: initContainer

# How long running tasks get when the pod is stopped (an upgrade, a node drain); passed to
# schedr as [worker] termination_grace_period, so the two always match.
terminationGracePeriodSeconds: 600

# Every task runs in this container: size its memory for the tasks. Task budgets are (the
# limit − 25 %) ÷ slots (see config below to change slots or memory_reserve).
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 2Gi

# Where the DAG files are in the container: baked into the image, or kept by git-sync (below).
# Empty: no such root (e.g. only dags.files).
dagsPath: /dags/current
# The DAG root's name in references and the UI (otherwise the path's last part).
dagsRoot: dags

dags:
  # DAG files carried in values, from a flat folder: `charts/schedr/dags-values.sh dags/ >
  # dags-values.yaml`, then `helm upgrade ... -f dags-values.yaml`. File name → base64
  # content; a ConfigMap mounted as the DAG root `files`, beside dagsPath. A change reaches schedr within
  # about a minute, without a restart. Up to 512 KiB together: more goes through git-sync.
  files: {}

gitSync:
  # A sidecar keeping a git repository's DAGs in `dagsPath` (its `current` link).
  enabled: false
  image: registry.k8s.io/git-sync/git-sync:v4.7.1
  repo: ""
  ref: main
  period: 30s
  # The repository's credentials, from a Secret:
  # - type token: an HTTPS repo (https://...) with a user and a token (e.g. a GitLab deploy
  #   token), keys usernameKey and passwordKey;
  # - type ssh: an SSH repo (git@host:group/repo.git) with a private key and the host's
  #   known_hosts line (ssh-keyscan <host>), keys sshKeyKey and knownHostsKey.
  # Under Istio with REGISTRY_ONLY, a repository outside the mesh needs a ServiceEntry
  # (istio.serviceEntries, e.g. the host on 443, or 22 for SSH).
  credentials:
    # token or ssh; empty: a public repository.
    type: ""
    secret: ""
    usernameKey: username
    passwordKey: password
    sshKeyKey: ssh-privatekey
    knownHostsKey: known_hosts
  # Extra environment for git-sync (its GITSYNC_* settings).
  env: []

# Variables of schedr's environment that tasks get too ([worker] pass_env): tasks get a clean
# environment, so a variable set in env below (a MongoDB URI from a Secret, a proxy) reaches
# them only when listed here, e.g. [MONGO_URI, HTTPS_PROXY].
passEnv: []

# More schedr configuration, as SCHEDR_CONFIG__<SECTION>__<KEY> variables without the prefix
# (see the configuration reference), e.g. WORKER__SLOTS: "4", WORKER__MEMORY_RESERVE: "1GiB".
config: {}
# Extra environment entries for schedr's container.
env: []

service:
  type: ClusterIP
  # The REST API (and standalone's UI): who may use it is webserver.auth's (none by default:
  # keep it internal, or behind an authenticating proxy or mesh).
  apiPort: 8080
  # The web UI's own pods (mode distributed with ui.enabled, mode ui).
  uiPort: 8082
  # mode distributed, tls.mode app: the webserver's port for the web UI alone (mTLS, the UI's
  # certificate checked), where the UI passes users' names on.
  webserverUiPort: 8083
  # /healthz, /readyz, /metrics (plain HTTP; nothing else is served there).
  opsPort: 8090
  # Distributed: the master's gRPC port (workers connect), a worker's log endpoint (the
  # webserver reads task logs there).
  grpcPort: 8070
  logPort: 8081

serviceMonitor:
  # A Prometheus Operator ServiceMonitor for /metrics.
  enabled: false
  interval: 30s
  labels: {}

serviceAccount:
  # false: run as an existing ServiceAccount (e.g. the one a mesh-enabled namespace already
  # has), named below.
  create: true
  # Created: its name (default: the release's), shared by every role in mode distributed too;
  # empty in mode distributed: one per role (<release>-master, -webserver, -worker), which
  # Istio's policies can tell apart. Required when not created.
  name: ""
  # schedr never calls the Kubernetes API: no token in its pods.
  automountToken: false

# Istio objects for a namespace in the mesh, each optional. Inside a mesh with
# `outboundTrafficPolicy: REGISTRY_ONLY`, the API is reached through a gateway's
# VirtualService, and a destination outside the mesh (Postgres, the git repository) needs a
# ServiceEntry.
istio:
  # The sidecar injected, schedr started once its proxy is ready, and the proxy kept until
  # schedr's connections close (a drain's results still reach the database).
  enabled: false
  # The API (port service.apiPort) through an existing Gateway; the chart creates none.
  virtualService:
    enabled: false
    # e.g. [istio-ingress/main]
    gateways: []
    # e.g. [schedr.example.com], or ["*"]
    hosts: []
    # The path schedr is served under, e.g. /service/schedr/: removed before the request
    # reaches schedr, and named to it in X-Forwarded-Prefix (Swagger UI and the API's
    # description keep it; the CLI takes it in --server https://<host>/service/schedr).
    prefix: /
  # Tokens (JWT) checked at schedr's pod, e.g. Keycloak's. It refuses only invalid tokens:
  # authorizationPolicy.api.requireJwt refuses requests without one.
  requestAuthentication:
    enabled: false
    # e.g. https://keycloak.example.com/realms/main
    issuer: ""
    # Empty (and no jwks): found through the issuer's OpenID discovery.
    jwksUri: ""
    # The issuer's keys inline (a JWKS document as text), instead of fetching them.
    jwks: ""
    # The token passed on to schedr (which doesn't use it yet) instead of removed.
    forwardOriginalToken: false
    # Claims Istio copies into request headers once the token is valid, e.g.
    #   - {header: x-forwarded-user, claim: preferred_username}
    # so schedr records who acted: set webserver.auth.identityHeader (and ui.auth's) to that
    # header, with mode none. Without it actions are recorded as anonymous.
    outputClaimToHeaders: []
  # Who may call schedr's ports. Istio denies whatever an ALLOW policy doesn't list, so this
  # one lists every port schedr serves.
  authorizationPolicy:
    enabled: false
    # Anything from this namespace allowed, to any port, without a token. Set false when an
    # ingress gateway runs in this namespace: requests through it come from this namespace
    # too, and would pass without a token.
    sameNamespace: true
    api:
      # Requests need a valid token (requestAuthentication, or the namespace's own).
      requireJwt: true
      # Claims the token must carry, e.g. {groups: [schedr-users]}: every claim listed, each with
      # any of its values.
      claims: {}
      # Callers allowed without a token: mesh identities
      # (cluster.local/ns/<namespace>/sa/<account>) and namespaces.
      principals: []
      namespaces: []
    # /metrics, /healthz and /readyz (port service.opsPort): from these namespaces (e.g.
    # [monitoring]); empty: from anyone. The kubelet's probes pass either way (Istio sends
    # them from inside the pod).
    ops:
      namespaces: []
    # tls.mode mesh: the webserver's UI port trusts the mesh (decision 40A), so this policy
    # admits only schedr ui there (its own account, and a DENY for anyone else); no token.
    # Other releases' schedr ui allowed there too: their mesh identities
    # (cluster.local/ns/<namespace>/sa/<account>).
    ui:
      principals: []
    # /api/v1/docs (Swagger UI) and /api/v1/openapi.json are open to everyone, without a
    # token: they describe the API and do nothing. Calls made from the page need a token
    # (its "Authorize" button) like any other.
  # mTLS required on schedr's pod (STRICT), for a namespace that doesn't require it already.
  # A Prometheus outside the mesh then can't scrape the ops port.
  peerAuthentication:
    enabled: false
  # ServiceEntries for destinations outside the mesh, each a name and its spec, e.g.
  #   - name: postgres
  #     hosts: [pg.example.com]
  #     ports: [{number: 5432, name: tcp-postgres, protocol: TCP}]
  #     location: MESH_EXTERNAL
  #     resolution: DNS
  serviceEntries: []

# Secrets synced from Vault by the Vault Secrets Operator (secrets.hashicorp.com), e.g. the
# one database.existingSecret names. Off: create those Secrets by hand.
vault:
  enabled: false
  auth:
    # The Vault role bound to the ServiceAccount below.
    role: ""
    # The account the operator authenticates as. Empty: the pods' (serviceAccount above); in
    # mode distributed with an account per role, the master's.
    serviceAccount: ""
    # The Kubernetes auth method's mount in Vault (e.g. kubernetes, or openshift).
    mount: kubernetes
    # The Vault namespace (Vault Enterprise), e.g. production/team.
    namespace: ""
    tokenExpirationSeconds: 600
  # A change in Vault restarts schedr (which reads Secrets at start), after a drain.
  restartOnChange: true
  # Each a Kubernetes Secret named secretName (default: name) holding the keys of a Vault
  # entry, e.g.
  #   - name: db
  #     secretName: schedr-db
  #     path: schedr/database        # its keys: url (or username, password)
  #     mount: kvv2                  # the default; type kv-v2, refreshAfter 600s
  staticSecrets: []

# The cluster's DNS domain, in the names the workers are reached at.
clusterDomain: cluster.local

# mode distributed: the roles' own settings (standalone uses the top-level ones).
master:
  # Without Python: the schedr server image (images/schedr-server). Tag: the chart's appVersion.
  image:
    repository: schedr-server
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi
  # An existing ServiceAccount for the master alone (else as serviceAccount says).
  serviceAccountName: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

webserver:
  # Who the user is (also standalone's: its API and UI). mode: none (whoever reaches it; the
  # name from identityHeader if set, e.g. x-forwarded-user from a mesh), proxy_header (an SSO
  # proxy in front sets identityHeader, x-forwarded-user by default; allowRemote: only the
  # proxy reaches it), or basic (users from usersSecret, a key of `name:bcrypt-hash` lines;
  # behindTlsProxy: TLS ends in front). schedr refuses an unsafe combination at start.
  auth:
    mode: none
    identityHeader: ""
    usersSecret:
      name: ""
      key: users
    behindTlsProxy: false
    allowRemote: false
  # The token a web UI elsewhere presents to pass users' names on (a Secret's key), where
  # there is no mTLS: a standalone in a federation, a distributed release in mesh mode. In
  # mode distributed with ui.enabled and tls.mode mesh, the chart makes one when none is set.
  uiTokenSecret:
    name: ""
    key: token
  # Holds no state: more replicas just share the requests.
  replicas: 1
  image:
    repository: schedr-server
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  serviceAccountName: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicas: 2
  # The fork server (the guide: Workers, The fork server): Python tasks and parse jobs start in
  # a few milliseconds, forked from a process that has imported these libraries once, instead
  # of a new interpreter importing them each time. For the distributed workers and standalone's
  # own. `path` is the image's Python, set as the DAG interpreter (`config.DAGS__INTERPRETER`,
  # `python` by default); an image built FROM this one keeps it. To configure that interpreter
  # in `config` yourself, turn this off (the chart refuses both). `preload`: module names, the image's libraries except `polars`, which starts
  # threads on import (images/schedr/preload.txt; the image's build fails on a list that
  # leaves a thread running). Add the libraries most of your tasks import, if an image of your
  # own adds them; never one that starts threads (the worker warns and forks without it).
  forkServer:
    enabled: true
    path: /usr/local/bin/python3
    preload:
      - requests
      - httpx
      - aiohttp
      - tenacity
      - orjson
      - yaml
      - dateutil
      - paramiko
      - netmiko
      - ncclient
      - dns
      - netaddr
      - pymongo
  # Every task runs in a worker's container: size its memory for its slots' tasks. Task
  # budgets are (the limit − 10 %) ÷ slots ([worker] slots, 2; memory_reserve).
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 2Gi
  # Each worker's own volume: its task logs and journal, kept when its pod moves to another
  # node (its worker ID is the pod's name). ReadWriteOnce, block storage.
  persistence:
    size: 10Gi
    storageClass: ""
  # At most this many workers taken down at once by a node drain or similar.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  serviceAccountName: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The web UI as a role of its own (`schedr ui`): mode ui, and mode distributed while enabled.
ui:
  # mode distributed: deployed over the release's own webserver (decision 37A).
  enabled: true
  # mode ui: the deployments it shows, in this order. Each: name (letters, digits, - and _;
  # in the UI's URLs), url (its API: a standalone's or a webserver's port; https:// for a
  # webserver's UI port over mTLS, with tls.mode app and the UI's certificate), and
  # tokenSecret (that deployment's webserver.uiTokenSecret, where there is no mTLS), e.g.
  #   - name: etl
  #     url: http://schedr.etl.svc.cluster.local:8080
  #     tokenSecret: {name: schedr-ui-tokens, key: etl}
  # mode distributed adds the release's own webserver first, as `default`.
  deployments: []
  # Who the person using it is, as in webserver.auth. mode empty: webserver.auth's (one
  # sign-in for the release). With mode distributed only the same mode as the webserver's, or
  # any with the webserver's none (its API kept internal; decision 41A).
  auth:
    mode: ""
    identityHeader: ""
    usersSecret:
      name: ""
      key: users
    behindTlsProxy: false
    allowRemote: false
  replicas: 1
  # Without Python: the schedr server image, with the documentation at /docs.
  image:
    repository: schedr-server
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceAccountName: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# mode distributed: mutual TLS between the roles (standalone never uses it).
tls:
  # app: schedr's own mTLS; mesh: plain traffic for a service mesh that encrypts it (Istio),
  # no certificates needed.
  mode: app
  # In app mode the certificates come from, in order:
  # - Secrets of your own, one per role (keys ca.crt, tls.crt, tls.key): all three, or none.
  #   The master's must name its Service (<release>-master...), the workers' tls.workerName,
  #   both with serverAuth and clientAuth;
  existingSecrets:
    master: ""
    webserver: ""
    worker: ""
    # The web UI's (mode distributed with ui.enabled): naming tls.uiName.
    ui: ""
  # - cert-manager, from this issuer (e.g. {name: my-ca, kind: ClusterIssuer});
  certManager:
    issuerRef: {}
  # - generated by the chart at install: a CA and a certificate per role (10 years), kept on
  #   upgrades. Needs Helm talking to the cluster: `helm template`, client dry runs and GitOps
  #   tools that render (ArgoCD) can't see them and make new ones each time; use cert-manager
  #   or your own Secrets there. Rotate by deleting the <release>-*-tls Secrets and upgrading
  #   (schedr reloads certificates without a restart).
  generate: true
  # The name in the workers' certificate, checked by the webserver ([tls] worker_name).
  workerName: schedr-worker
  # The name in the web UI's certificate, checked by the webserver on its UI port
  # ([tls] ui_name).
  uiName: schedr-ui

podAnnotations: {}
podLabels: {}
# Without an fsGroup here, the chart sets `fsGroup: 0` (the volume writable by the image's
# group), except on OpenShift (found by its security.openshift.io API), which sets the UID and
# fsGroup itself.
podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
nodeSelector: {}
tolerations: []
affinity: {}
