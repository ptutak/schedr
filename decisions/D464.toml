summary = '''
The leading master writes one sample per process a minute (memory, CPU, the container's memory
and limit, a worker's breakdown) into a samples table (a new migration on both databases). Kept a
minute apart for 24 h, then rolled up into 15-minute averages and peaks kept 30 days; retention
deletes older ones, its ages hidden values. Not chosen: one a minute for 7 days without a rollup.
