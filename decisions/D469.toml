topic = "assignment"
section = "Placement and ordering"
summary = '''
A round no longer holds the master's core lock from start to end: it lets go between its
batches of assignments (and between its other parts), so a worker's turn waiting for the lock
gets in between them. Each batch is still one transaction; what a batch decides is read again
after the lock is taken back. With one worker, the round's hold is what a `Started` waits for
(M5.1a: scenario 23's rounds up to 4.1 s, a turn waiting up to 6.6 s). Not chosen: the
round's hold left to M5.1d; M5.1d's set-based statements first.
'''
