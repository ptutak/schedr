topic = "ui-cli"
section = "Pages and live updates"
summary = '''
Database change notifications default on, including standalone. `[database] change_notifications` is
applied by `schedr db migrate` or startup `--migrate`, holding the lease, never by a running master.
The webserver follows the database’s trigger state; when off, it sends refresh events every 15 s
(a hidden timing since D232: `SCHEDR_HIDDEN__WEBSERVER__REFRESH_INTERVAL`).
'''
