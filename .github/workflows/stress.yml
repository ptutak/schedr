name: Stress

# The stress suite (crates/schedr/tests/stress, PLAN.md 2.10b): nightly when main changed since
# the last passing run, and by hand (any profile). Not on each push: see ci.yml.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "quick (sized for 2 CPUs and 7 GB, scaled up on bigger runners) or full"
        default: quick
        type: choice
        options: [quick, full]
      filter:
        description: "Only scenarios whose name matches (a regular expression); empty for all"
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: docker.io/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_PASSWORD: schedr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # Transaction pooling in front of the same server, any database name passed through.
      pgbouncer:
        image: docker.io/edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: schedr
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: "1000"
          DEFAULT_POOL_SIZE: "40"
        ports:
          - 6432:5432
    env:
      SCHEDR_TEST_POSTGRES_URL: postgres://postgres:schedr@127.0.0.1:5432/postgres
      SCHEDR_TEST_PGBOUNCER: 127.0.0.1:6432
      SCHEDR_STRESS_PROFILE: ${{ inputs.profile || 'quick' }}
    steps:
      # Nightly: nothing to do when main is where the last passing run left it.
      - name: Changed since the last passing run?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stress.yml/runs?status=success&branch=main&per_page=1" \
            | python3 -c 'import json, sys; runs = json.load(sys.stdin)["workflow_runs"]; print(runs[0]["head_sha"] if runs else "")')
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "main unchanged since the last passing run ($last)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.13.5"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz. v4.2.0 does not know 0.13.5.
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      # As `make stress`: room for the suite's connections (a service container takes no
      # arguments, so set and restarted; PgBouncer reconnects on its own).
      - if: steps.changed.outputs.run == 'true'
        name: Postgres with max_connections = 500
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET max_connections = 500"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; do sleep 1; done
      - if: steps.changed.outputs.run == 'true'
        run: uv sync --python 3.14
      - if: steps.changed.outputs.run == 'true'
        run: echo "SCHEDR_TEST_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - if: steps.changed.outputs.run == 'true'
        name: Stress suite
        # The filter through the environment, never pasted into the script.
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          filter=()
          if [ -n "$FILTER" ]; then filter=(-E "test(/$FILTER/)"); fi
          cargo nextest run -p schedr --test stress --test-threads 1 --no-fail-fast --no-capture "${filter[@]}"
      - if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stress-report-${{ github.run_id }}
          path: target/stress/
          if-no-files-found: warn
