'''
done_when = '''
stress 23 starts its 500 wait steps in under 10 s by `all_in_s` (14.5 s after M5.1b); the turns' lock wait p99 below M5.1b's in scenarios 13 and 23 (1.6 s and 6.6 s), M4B's throughput kept; commits per second under scenario 13 counted (for 480's later choice); tests for each release (a turn's groups with a round and another worker's turn between them, a stream replaced between two groups), for the set-based checks (a switched-off wait step and one past `max_wait` past the cap end in the same round), the pending reason, and a failed batch assigned one by one, on both databases
'''
status = "done"
done = 2026-11-13

