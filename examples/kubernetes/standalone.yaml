# schedr standalone in one pod with SQLite on a persistent volume: for trying schedr on a
# cluster before the full deployment (see PROJECT.md, "standalone in one pod"). Not for
# production: one process runs every role; a restart restarts the master and the worker.
#
# Two rules this manifest keeps, and why:
# - Exactly ONE replica (a StatefulSet, never scaled). Two pods on the same database would
#   schedule every run twice; standalone refuses to start while another holds its data
#   directory's lock, which only works on a volume both would share.
# - A ReadWriteOnce volume on BLOCK storage (Ceph RBD, cloud disks). SQLite's file locking is
#   unreliable on network filesystems (NFS, CephFS, Azure Files, most ReadWriteMany classes).
#
# The image: examples/kubernetes/Dockerfile. DAG code: git-sync pulls a repository into an
# emptyDir shared with schedr (or bake the DAGs into the image and drop the sidecar).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schedr-standalone
data:
  config.toml: |
    [dags]
    # git-sync switches the `current` link to each new checkout; schedr follows it.
    path = ["/git/current"]

    [dags.roots]
    # The root's name in DAG references and the UI (otherwise "current").
    dags = "/git/current"

    [worker]
    data_dir = "/var/lib/schedr"
---
apiVersion: v1
kind: Service
metadata:
  name: schedr-standalone
spec:
  # Internal only: the REST API has no authentication of its own until milestone M3.
  # Reach it with `kubectl port-forward svc/schedr-standalone 8080` and
  # `schedr dags list --server http://127.0.0.1:8080`.
  type: ClusterIP
  selector:
    app: schedr-standalone
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: schedr-standalone
spec:
  serviceName: schedr-standalone
  replicas: 1 # never more: see the top of this file
  selector:
    matchLabels:
      app: schedr-standalone
  template:
    metadata:
      labels:
        app: schedr-standalone
    spec:
      # SIGTERM stops standalone cleanly; running tasks are stopped with it.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # Makes the data volume writable by group 0, which the image's user belongs to (a
        # mounted volume replaces the image's group-writable /var/lib/schedr). On OpenShift
        # remove both lines: its security context constraints set an fsGroup of their own.
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: schedr
          image: registry.example.com/schedr-standalone:0.1.0 # built from the Dockerfile
          env:
            - name: SCHEDR_CONFIG_FILE
              value: /etc/schedr/config.toml
          ports:
            - name: http
              containerPort: 8080
          # A TCP check until the ops port's /healthz and /readyz (milestone M2).
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            # Every task runs inside this container: size it for your tasks.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/schedr
            - name: dags
              mountPath: /git
              readOnly: true
            - name: config
              mountPath: /etc/schedr
              readOnly: true
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          args:
            - --repo=https://github.com/example/dags.git # your DAG repository
            - --ref=main
            - --root=/git
            - --link=current
            - --period=30s
          volumeMounts:
            - name: dags
              mountPath: /git
      volumes:
        - name: dags
          emptyDir: {}
        - name: config
          configMap:
            name: schedr-standalone
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # A block-storage class; not NFS or another network filesystem (see the top).
        # storageClassName: <your block storage class>
        resources:
          requests:
            storage: 5Gi
