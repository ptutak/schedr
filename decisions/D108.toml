topic = "workers"
summary = '''
On database trouble, undo the failed message’s effects and end the worker stream; the worker
registers again with its roots and journal. Under D115, data faults keep the stream open: a refused
Finished becomes an acknowledged result_not_stored failure, other refused messages are logged and
dropped, and registration adopts open attempts whose start record was refused.
'''
