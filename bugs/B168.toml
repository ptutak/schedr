details = '''
- **Found:** 2026-11-05, the CI run of M4.9a (42050300360, `integration` job): `left: ""`,
  `right: "j-1"` at roles.rs:1611, after `cluster.wait("the run to end", ...)` saw `failed`.
- **To check:** whether a run can end `failed` while a task's moved cleanup is still to run
  (decisions 252-258 say the run waits in `cleaning_up`); if not, the test's read is racing the
  cleanup's write (the file created before it is written), and it should wait for the content.
- **Why it matters:** if real, a run reports its end before its cleanup ran (a resource left
  behind with the run shown as finished); if not, a flaky test reddening CI.
