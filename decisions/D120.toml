summary = '''
An .on(...) order edge from a mapped task contributes one edge per instance, taken when that
instance ends with a selected outcome. Downstream run_if combines these with its other edges:
NONE_FAILED permits any matching instance, ALL_SUCCEEDED requires every instance to match. An empty
mapping takes the edge.
'''
