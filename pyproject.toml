[project]
name = "schedr"
# The version comes from the Cargo workspace: the binary and the Python package always share
# one version number.
dynamic = ["version"]
description = "schedr scheduler: Python DAG API (native and Airflow look-alike) plus the schedr binary."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Piotr Tutak", email = "piotr.tutak@amartus.com" }]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "jsonschema>=4.25",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
]

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

# --- maturin ------------------------------------------------------------
# The wheel contains the `schedr` Rust binary plus the pure-Python package (as ruff and uv
# ship), so `pip install schedr` gives both the API and `schedr standalone`.
[tool.maturin]
bindings = "bin"
manifest-path = "crates/schedr/Cargo.toml"
python-source = "python"
python-packages = ["schedr"]
# The binary crate's library is named `schedr_bin`; the Python package is `schedr`.
module-name = "schedr"

# --- uv -----------------------------------------------------------------
# Rebuild the (editable) project install when Rust code changes, not only Python metadata.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["python"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "C4",       # comprehensions
    "PL",       # pylint
    "D",        # pydocstyle: docstrings on public names (Google convention, below)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = ["PLR2004", "D"]

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "python"
packages = ["schedr"]

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
# importlib: test files with the same name in different folders don't clash, and test folders
# need no __init__.py (see PROJECT.md, Repository and tooling: Testing).
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = ["integration: tests that spawn processes or touch the filesystem"]

[tool.coverage.run]
source = ["schedr"]
branch = true

[tool.coverage.report]
fail_under = 85
