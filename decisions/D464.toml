summary = '''
One sample per process a minute (its resident memory and its whole memory with a worker's parts
(decision 491), CPU cores since the last, the container's memory and limit, a worker's parts and
largest tasks) in `samples` (the open `0002` migration), keyed by
process: the leading master writes its masters' and workers' (a standalone one row, its roles
master, worker and webserver), a webserver in a process of its own its own. Each closed
15-minute window is rolled up into averages and peaks (a worker's parts averaged over every
minute, its largest tasks left out, the latest limit), each row with the `minutes` it covers (and of them with a CPU or container
figure, and `covered`: its window's minutes sampled at all), by which a bucket's averages and a
deployment's totals are weighted (DN5); minute rows are kept 24 h, rollups 30 d
(hidden timings), deleted by the sampler. Not chosen: one a minute for 7 days without a rollup.
'''
