id = "M5.2i2"
title = "A Kubernetes plugin, open-source: each task a pod, the extension hole shown on something real"
scope = '''
(the user, 2026-11-20: a good demonstration, open-source) an extension plugin (M5.2i) that runs a task as a Kubernetes pod or Job: its image, command, resources and node selection in the payload; the pod started, followed, its logs streamed into the task's log while it runs, its exit and its declared output taken as the task's result; a cancel and a timeout deleting the pod; a handle registered, so a worker lost mid-job leaves the pod reachable to cancel or clean up. Its source a model for plugin authors. Tested on kind (the repository's kind scripts). Decided (the user, 2026-11-20: small, the fastest to ship, exercising the plugin's capabilities): A, Python driving `kubectl` on M5.2i's `schedr.extension` helper, about 200 lines in `examples/plugins/kubernetes/` with a DAG using it; nothing new published. A Job per attempt (`kubectl create -f -`, named after the attempt), its name registered as a handle; `kubectl logs -f` into the task's log; the pod's last line `SCHEDR_OUTPUT: <json>` returned as the typed output; a non-zero exit as `task_failed` with the pod's reason; SIGTERM (cancel, timeout) running `kubectl delete job`; one declared secret passed to the pod as an env var (a demonstration; a real plugin would make a Kubernetes Secret). It needs `kubectl` and a kubeconfig or the pod's service account allowing create, get, logs and delete on Jobs in one namespace. Not chosen: B, the official `kubernetes` Python client (a large dependency, a clumsier stream); C, Rust and `kube-rs` (the most code, a binary to ship) Built (2026-11-20): `examples/extensions/kubernetes/` (not `examples/plugins/`: beside the dummy), about 270 lines; it waits for the Job's pod itself (`kubectl logs` waits only for a pod to run, never one already ended) and stops through asyncio's signal handling; `scripts/kind-extension.sh` runs it end to end.
