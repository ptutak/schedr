title = "A moving cleanup's result from the worker it moved from counts"
date = 2026-11-05
by = "user"
status = "active"
topic = "cleanup"
section = "Moving and disconnection"
summary = '''
While a cleanup waits to move, its previous worker’s cleanup result is stored and the pending
move dropped. Its journaled `Finished` receives `Continue` so the result is sent again. On the
first move that worker’s task result counts; on later moves the previously kept task result
remains.
'''
