title = "Chart functions: point, combine, group_by and limit"
date = 2026-11-21
by = "user"
status = "active"
topic = "task-processes"
section = "Extensions"
summary = '''
An extension's panel may name four functions saying how its metric is drawn, each with a default,
so most panels name none. `point`: how one point is worked out from its bucket (a counter
`increase` by default, or `rate`; a gauge `mean` by default (DN26), `last`, `max` or `min`; a histogram
its `count` by default, `mean` or `quantiles`). `combine`: how values are combined, the workers'
on the "All workers" tab and the labels left out of `group_by` (`sum` by default, `max`, `mean`,
`min`): a value every worker reads from one place (a cluster's pending pods) declares `max`, so 3
workers reading 10 show 10, not 30. `group_by`: the labels that get a line each (all by default, a
list, or none). `limit`: how many lines are shown, the largest by their peak over the range; the
rest go into `other`. For example `{"metric": "pods_pending", "point": "max", "combine": "max",
"group_by": ["namespace"], "limit": 5}`. Not chosen: `over_time`, `across`, `by` and `top` as the
names; one line in words (`"show": "max per namespace, top 5"`); a subset of PromQL; plain `fn`,
`group` and `limit` keys.
'''
