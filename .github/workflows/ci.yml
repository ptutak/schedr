name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI on its tag, then publishes CI's wheels (decision 160).
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # undone.py reads the pushed commits and the 10 before each (B190).
          fetch-depth: 0
      # pin-check is Python (uv run --no-sync). It does not build the package.
      # The dev group, including PyYAML, is installed here. The Makefile target
      # does not sync: a local `uv sync` once removed packages already installed.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.13.5"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz. v4.2.0 does not know 0.13.5,
          # and without this input it installs the tarball without checking it.
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - run: uv sync --frozen --no-install-project --inexact
      - run: make pin-check
      # BUGS.md must match bugs/ (see the Makefile, bugs-check).
      - run: make bugs-check
      # No pushed commit removes what the 10 before it added, unless it says so (B190).
      # A new branch or a tag (no "before") is not checked.
      - env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then BEFORE=$BASE AFTER=$HEAD; fi
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            if [ -n "$BEFORE" ] && [ -z "${BEFORE//0/}" ]; then exit 0; fi
            python3 scripts/undone.py --range "$BEFORE..$AFTER"
          fi
      # DECISIONS.md must match decisions/, every decision named has a file (decisions-check).
      - run: make decisions-check
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149,cargo-llvm-cov@0.9.1
      # LICENSE-THIRD-PARTY must match Cargo.lock (scripts/third_party.py).
      - run: make third-party-check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The committed JSON Schemas must match the Rust model (see the Makefile, schema-check).
      - run: cargo xtask schema --check
      # Coverage floor and ignored files: see the Makefile (test-rust).
      - run: >-
          cargo llvm-cov nextest --workspace
          --ignore-filename-regex '(^|/)(tests|main)\.rs$'
          --fail-under-lines 85
          -E 'not kind(test)'
      - run: cargo test --workspace --doc

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The package is built with maturin, so `uv sync` compiles the Rust binary.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.13.5"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz. v4.2.0 does not know 0.13.5,
          # and without this input it installs the tarball without checking it.
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run ruff format --check python examples
      - run: uv run ruff check python examples
      - run: uv run mypy
      - run: uv run pytest python/tests/unit --cov --cov-report=term-missing --cov-fail-under=85

  # Integration tests (see the Makefile, test-integration): real processes, the binary with
  # the real Python runner, and every query on Postgres (a service container here).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_PASSWORD: schedr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # The typed connections' servers (decision 185), the images as the Makefile's.
      mysql:
        image: docker.io/library/mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
        env:
          MYSQL_ROOT_PASSWORD: schedr
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -pschedr --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: docker.io/library/mariadb:11.8.9@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
        env:
          MARIADB_ROOT_PASSWORD: schedr
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mariadb-admin ping --protocol=TCP -h 127.0.0.1 -uroot -pschedr --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mongo:
        image: docker.io/library/mongo:7.0.45@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SCHEDR_TEST_POSTGRES_URL: postgres://postgres:schedr@127.0.0.1:5432/postgres
      SCHEDR_TEST_MYSQL_URL: mysql://root:schedr@127.0.0.1:3306/mysql
      SCHEDR_TEST_MARIADB_URL: mysql://root:schedr@127.0.0.1:3307/mysql
      SCHEDR_TEST_MONGO_URI: mongodb://127.0.0.1:27017/
      SCHEDR_TEST_SSH: 127.0.0.1:2222
      SCHEDR_TEST_SSH_USER: schedr
      SCHEDR_TEST_VAULT_URL: http://127.0.0.1:8200
      SCHEDR_TEST_VAULT_TOKEN: root
    steps:
      # Vault in dev mode on the host's network (not a service container: Vault must reach the
      # tests' fake Kubernetes API on 127.0.0.1). The image as the Makefile's VAULT_IMAGE.
      - name: Vault
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: "127.0.0.1:8200"
        run: |
          docker run -d --rm --name vault --network host -e VAULT_DEV_ROOT_TOKEN_ID \
            -e VAULT_DEV_LISTEN_ADDRESS -e SKIP_SETCAP=1 \
            docker.io/hashicorp/vault:2.1.2@sha256:c2f666266f383d2cf424d86b8bb8ce7d065562173ffec2b476d762943608bb55
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:8200/v1/sys/health; do sleep 1; done'
      # An SSH server with a key made here (a service container starts before any step).
      - name: SSH server
        run: |
          keys="$RUNNER_TEMP/ssh"; mkdir -p "$keys"
          ssh-keygen -q -t ed25519 -N '' -C schedr-test -f "$keys/id_ed25519"
          docker run -d --rm --name sshd -e USER_NAME=schedr \
            -e PUBLIC_KEY="$(cat "$keys/id_ed25519.pub")" -p 127.0.0.1:2222:2222 \
            docker.io/linuxserver/openssh-server:10.3_p1-r2-ls242@sha256:aa4e1b3916e8555f24e574e6108b0b89a1b20362b0a11800a71280b45999649e
          timeout 60 sh -c "until ssh-keyscan -p 2222 127.0.0.1 > '$keys/known_hosts' 2>/dev/null && [ -s '$keys/known_hosts' ]; do sleep 1; done"
          echo "SCHEDR_TEST_SSH_KEY_FILE=$keys/id_ed25519" >> "$GITHUB_ENV"
          echo "SCHEDR_TEST_SSH_KNOWN_HOSTS=$keys/known_hosts" >> "$GITHUB_ENV"
      # The CA of the certificate MySQL made itself, for the TLS tests.
      - name: MySQL's CA
        run: |
          docker cp "${{ job.services.mysql.id }}:/var/lib/mysql/ca.pem" "$RUNNER_TEMP/mysql-ca.pem"
          echo "SCHEDR_TEST_MYSQL_CA=$RUNNER_TEMP/mysql-ca.pem" >> "$GITHUB_ENV"
      # MariaDB's own client, run in its container, reading an option file from stdin.
      - name: MariaDB's client
        run: echo "SCHEDR_TEST_MARIADB_EXEC=docker exec -i ${{ job.services.mariadb.id }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.13.5"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz. v4.2.0 does not know 0.13.5,
          # and without this input it installs the tarball without checking it.
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      # Installs schedr (built with maturin) into the environment the runner runs from.
      - run: uv sync --python 3.14
      - run: echo "SCHEDR_TEST_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      # The stress suite runs nightly instead (stress.yml).
      - run: cargo nextest run --workspace -E 'kind(test) & not binary(stress)'
      - run: uv run pytest python/tests/integration examples
      # The SSH server's own log (refused connections, penalties) when a test fails.
      - if: failure()
        run: docker logs sshd 2>&1 | tail -100

  # The web UI in a browser (decision 27A, `make test-ui`): a standalone with the example DAG
  # and a run, driven by Playwright's Chromium; a job of its own for the browser download.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.13.5"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz. v4.2.0 does not know 0.13.5,
          # and without this input it installs the tarball without checking it.
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - run: uv sync --group ui-test --python 3.14
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: cargo build -p schedr
      - run: uv run --no-sync pytest python/tests/ui
        env:
          SCHEDR_BIN: ${{ github.workspace }}/target/debug/schedr

  # The documentation site (see PROJECT.md, Repository and tooling: Documentation); fails on
  # any warning.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.13.5"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz. v4.2.0 does not know 0.13.5,
          # and without this input it installs the tarball without checking it.
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - run: uv sync --group docs --python 3.14
      - run: make docs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: site

  # The wheels: the `schedr` binary plus the pure-Python package (see PROJECT.md, Packaging and
  # releases). Linux x86_64 as manylinux (glibc) and musllinux (Alpine, e.g. the standalone
  # image in examples/kubernetes). Linux aarch64 manylinux and macOS arm64 are the matrix
  # job below. scripts/build-wheel.sh builds every wheel (digest-pinned images; no
  # maturin-action). The smoke test is PLAN.md's "M1 is done": install, `dags test`, and a
  # run in `schedr standalone` through the CLI.
  wheel:
    runs-on: ubuntu-latest
    # The images carry the documentation the docs job built (served at /docs).
    needs: docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: CONTAINER=docker scripts/build-wheel.sh manylinux-x86_64
      - run: scripts/smoke-wheel.sh dist/*manylinux*.whl python
      - run: CONTAINER=docker scripts/build-wheel.sh musllinux-x86_64
      # On Alpine itself, the base of the standalone image (same digest as its Dockerfile).
      - run: >-
          docker run --rm -v "$PWD:/repo:ro"
          docker.io/library/python:3.14.8-alpine3.24@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
          sh -c 'apk add --no-cache bash >/dev/null && cd /repo
          && bash scripts/smoke-wheel.sh dist/*musllinux*.whl python3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: site
      - run: scripts/docs-dist.sh site
      # The base image from that wheel, run as a pod would (pushed to a registry with releases).
      - run: docker build -f images/schedr/Dockerfile -t schedr:ci .
      - run: scripts/smoke-image.sh docker schedr:ci
      # The server image (master, webserver: the binary from the same wheel, no Python).
      - run: docker build -f images/schedr-server/Dockerfile -t schedr-server:ci .
      - run: scripts/smoke-server-image.sh docker schedr-server:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux-x86_64
          path: dist/*.whl

  # Linux aarch64 manylinux and macOS arm64 (M2.13), one matrix. The check name is
  # `matrix.name`, so the two stay visible per platform. scripts/build-wheel.sh uses the
  # digest-pinned manylinux2014_aarch64 image, or, on macOS, rustup-init 1.29.1
  # (no container). One platform failing does not cancel the other.
  # The macOS wheel tag is maturin's default macosx_11_0_arm64.
  wheel-native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wheel-linux-aarch64
            runner: ubuntu-24.04-arm
            platform: manylinux-aarch64
            wheel: dist/*manylinux*.whl
            artifact: wheels-linux-aarch64
          - name: wheel-macos-arm64
            runner: macos-15
            platform: macos-arm64
            wheel: dist/*macosx*.whl
            artifact: wheels-macos-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: CONTAINER=docker scripts/build-wheel.sh ${{ matrix.platform }}
      - run: scripts/smoke-wheel.sh ${{ matrix.wheel }} python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl

  # The Helm chart: lint and render it (see `make chart-check`).
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: make chart-check

  # Source distribution. maturin comes from the same hashed requirements file as the
  # wheels (no maturin-action). `sdist` packs the tree; it does not compile Rust.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=maturin
          -r scripts/maturin-requirements.txt
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz
