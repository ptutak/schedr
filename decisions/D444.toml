title = "A new leader waits out the deposed one; workers fence older epochs"
date = 2026-11-11
by = "user"
status = "active"
topic = "workers"
section = "Identity and connection"
summary = '''
After a takeover, a worker the new leader hasn't heard from counts as lost only a lead time
(`lease_period - query_timeout`) plus the worker lease after it began leading. Every master
message carries the leader's lease epoch; a worker that has seen an epoch refuses messages and
registrations from a lower one, and reconnects, until a worker lease passes without word from
that epoch (a database restored sets it back); a configuration whose lead isn't shorter than the
worker lease is refused at load. Not chosen: the master's lead clock counting
suspend (`CLOCK_BOOTTIME`); fencing by timeline only; restarting workers after a restore.
'''
