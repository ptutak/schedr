summary = '''
`schedr ui` is a separate role federating any mix of distributed deployments and SQLite or Postgres
standalones through their JSON APIs. It can deploy alone from the chart; standalones can run with
`--no-ui` and prove the UI’s calls through a shared token. Webservers continue serving the API.
