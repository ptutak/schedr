name: Stress

# The stress suite (crates/schedr/tests/stress, PLAN.md 2.10b): nightly when main changed since
# the last passing run, and by hand (any profile). Not on each push: see ci.yml. Beside it,
# the clock simulator (decision 446) with many more scenarios than a push runs, and chaos on
# kind (M5.3f).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "quick (sized for 2 CPUs and 7 GB, scaled up on bigger runners) or full"
        default: quick
        type: choice
        options: [quick, full]
      filter:
        description: "Only scenarios whose name matches (a regular expression); empty for all"
        default: ""
        type: string
      base:
        description: "Paired speed (M5.3i): a ref to compare with, each scenario run on it and on this one in turn on one runner; empty for a plain run. Needs a filter."
        default: ""
        type: string
      pairs:
        description: "Paired speed: how many pairs of runs per scenario"
        default: "3"
        type: string
      chaos_seeds:
        description: "Chaos on kind only, on these seeds (comma-separated, e.g. 2,7,11): to compare a change on the same schedules; empty for the usual run"
        default: ""
        type: string

# One run at a time: the cap below is per run. A run waits for the one before it, never cancels
# it; GitHub keeps one waiting, so a third started meanwhile replaces the second.
concurrency:
  group: stress
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # The scenarios to run, each a job of its own below (the user, 2026-11-23: one that fails is
  # run again alone with "Re-run failed jobs", not the whole suite): the suite's `stress_*`
  # tests, read from its sources, as the filter or the nightly rule says.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
      base: ${{ steps.base.outputs.sha }}
      seeds: ${{ steps.seeds.outputs.seeds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history for a paired run: its base may be a short commit ID.
          fetch-depth: ${{ inputs.base != '' && '0' || '1' }}
      # A paired run's base as a full commit ID: checkout fetches a short one as a branch's
      # name and finds nothing (run 45814320439). A short ID, a branch or a tag all work.
      - name: The paired run's base
        id: base
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          sha=$(git rev-parse --verify --quiet "${BASE}^{commit}" || git rev-parse --verify --quiet "origin/${BASE}^{commit}" || true)
          if [ -z "$sha" ]; then
            echo "::error::base $BASE names no commit, branch or tag of this repository"
            exit 1
          fi
          echo "base $BASE is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Nightly: when main is where the last passing run left it, only the random chaos runs,
      # with a fresh seed (M4.8z: a new seed each night).
      - name: Changed since the last passing run?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then exit 0; fi
          last=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stress.yml/runs?status=success&branch=main&per_page=1" \
            | python3 -c 'import json, sys; runs = json.load(sys.stdin)["workflow_runs"]; print(runs[0]["head_sha"] if runs else "")')
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "main unchanged since the last passing run ($last): the random chaos only"
            echo "only=^stress_21_random_chaos$" >> "$GITHUB_OUTPUT"
          fi
      # The chaos runs' seeds: the ones asked for (then chaos alone runs), or the run's number
        # (each night another schedule).
      - name: The chaos seeds
        id: seeds
        env:
          SEEDS: ${{ inputs.chaos_seeds }}
          RUN: ${{ github.run_number }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          given = os.environ.get("SEEDS", "").strip()
          if given and not re.fullmatch(r"\d+(\s*,\s*\d+)*", given):
              sys.exit(f"chaos_seeds must be numbers separated by commas, not {given!r}")
          seeds = [int(s) for s in re.split(r"\s*,\s*", given)] if given else [int(os.environ["RUN"])]
          print("seeds=" + json.dumps(seeds))
          PY
      - name: The scenarios
        id: list
        # The filter through the environment, never pasted into the script.
        env:
          FILTER: ${{ inputs.filter || steps.changed.outputs.only }}
          BASE: ${{ inputs.base }}
          CHAOS_SEEDS: ${{ inputs.chaos_seeds }}
        run: |
          if [ -n "$CHAOS_SEEDS" ]; then
            echo "chaos alone, seeds $CHAOS_SEEDS: no stress scenarios"
            echo 'scenarios=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$BASE" ] && [ -z "$FILTER" ]; then
            echo "::error::a paired run (base $BASE) needs a filter: every scenario in pairs takes many hours"
            exit 1
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          names = []
          for path in sorted(pathlib.Path("crates/schedr/tests/stress").glob("*.rs")):
              names += re.findall(r"#\[test\]\s*\nfn (stress_\w+)\(", path.read_text())
          wanted = os.environ.get("FILTER", "")
          names = sorted(n for n in names if not wanted or re.search(wanted, n))
          # The longest first (29 minutes and more in v1.2.0's full run), so that under the cap
          # none starts near the end and makes the run longer; the others as they are named.
          longest = [
              "stress_25_extension_throughput",
              "stress_10_soak",
              "stress_15_change_signals",
              "stress_21b_random_chaos_extensions",
              "stress_15c_change_signals_python",
              "stress_21_random_chaos",
          ]
          names.sort(key=lambda n: longest.index(n) if n in longest else len(longest))
          print("scenarios=" + json.dumps(names))
          PY

  stress:
    needs: plan
    if: needs.plan.outputs.scenarios != '[]' && inputs.base == ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Room for CI's own jobs beside a full run (the user, 2026-11-25): without
      # a limit about 20 scenarios started at once and the others waited for a runner.
      max-parallel: 10
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    name: ${{ matrix.scenario }}
    services:
      postgres:
        image: docker.io/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_PASSWORD: schedr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # Transaction pooling in front of the same server, any database name passed through.
      pgbouncer:
        image: docker.io/edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: schedr
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: "1000"
          DEFAULT_POOL_SIZE: "40"
        ports:
          - 6432:5432
    env:
      SCHEDR_TEST_POSTGRES_URL: postgres://postgres:schedr@127.0.0.1:5432/postgres
      SCHEDR_TEST_PGBOUNCER: 127.0.0.1:6432
      SCHEDR_STRESS_PROFILE: ${{ inputs.profile || 'quick' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      # One cache for every scenario's job: each builds the suite, mostly from it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: stress
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.149
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz: checked whatever the action knows.
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      # As `make stress`: room for the suite's connections (a service container takes no
      # arguments, so set and restarted; PgBouncer reconnects on its own).
      - name: Postgres with max_connections = 500
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET max_connections = 500"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; do sleep 1; done
      - run: uv sync --python 3.14
      - run: echo "SCHEDR_TEST_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      # A scenario whose timing limits alone failed while the runner stalled on I/O reports
      # `noisy_runner` and passes: run once more, its second report the one kept (the user,
      # 2026-11-24); stalled again, a warning on the run, not a failure.
      - name: ${{ matrix.scenario }}
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          run() {
            cargo nextest run -p schedr --test stress --ignore-default-filter --test-threads 1 --no-capture \
              -E "test(/(^|::)${SCENARIO}$/)"
          }
          noisy() {
            python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1])).get("noisy_runner") else 1)' \
              "target/stress/${SCENARIO#stress_}.json"
          }
          run
          if noisy; then
            echo "::warning::${SCENARIO}: the runner stalled on I/O, timing limits not applied; running it once more"
            run
            if noisy; then
              echo "::warning::${SCENARIO}: stalled again: its timing limits not applied on this run"
            fi
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-report-${{ matrix.scenario }}
          path: target/stress/
          if-no-files-found: warn

  # The results page: a table of every scenario's numbers on the run's summary, from each
  # scenario's report, and all of them in one artifact.
  summary:
    needs: [plan, stress]
    if: always() && needs.plan.outputs.scenarios != '[]' && inputs.base == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stress-report-stress_*
          path: target/stress
          merge-multiple: true
      - name: Results page
        run: python3 scripts/stress_summary.py target/stress
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-report-${{ github.run_id }}
          path: target/stress/
          if-no-files-found: warn

  # Paired speed (M5.3i, the user, 2026-11-26): each scenario run on the base ref and on this one
  # in turn on one runner (the order swapped each pair), so the runner's own speed, some 10 %
  # between machines, cancels out; scripts/stress_paired.py compares the pairs' reports.
  paired:
    needs: plan
    if: needs.plan.outputs.scenarios != '[]' && inputs.base != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    name: paired ${{ matrix.scenario }}
    services:
      postgres:
        image: docker.io/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_PASSWORD: schedr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      pgbouncer:
        image: docker.io/edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: schedr
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: "1000"
          DEFAULT_POOL_SIZE: "40"
        ports:
          - 6432:5432
    env:
      SCHEDR_TEST_POSTGRES_URL: postgres://postgres:schedr@127.0.0.1:5432/postgres
      SCHEDR_TEST_PGBOUNCER: 127.0.0.1:6432
      SCHEDR_STRESS_PROFILE: ${{ inputs.profile || 'quick' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: base
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: stress-paired
          workspaces: |
            new -> target
            base -> target
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.149
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - name: Postgres with max_connections = 500
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET max_connections = 500"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; do sleep 1; done
      # Both built before any run, so a pair measures runs only; each with its own Python.
      - name: Both builds
        run: |
          for side in base new; do
            (cd "$side" && uv sync --python 3.14 && cargo nextest run -p schedr --test stress --ignore-default-filter --no-run)
          done
      - name: ${{ matrix.scenario }} in pairs
        env:
          SCENARIO: ${{ matrix.scenario }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          report="${SCENARIO#stress_}.json"
          for n in $(seq 1 "$PAIRS"); do
            # Base first in odd pairs, new first in even ones: neither always runs on a warm machine.
            if [ $((n % 2)) -eq 1 ]; then order="base new"; else order="new base"; fi
            for side in $order; do
              echo "::group::pair $n: $side"
              (
                cd "$side"
                SCHEDR_TEST_PYTHON=$(uv run python -c 'import sys; print(sys.executable)') \
                  cargo nextest run -p schedr --test stress --ignore-default-filter --test-threads 1 --no-capture \
                  -E "test(/(^|::)${SCENARIO}$/)"
              ) || echo "::warning::${SCENARIO}: pair $n, $side failed (its report says why)"
              mkdir -p "paired/$side/$n"
              if [ -f "$side/target/stress/$report" ]; then
                mv "$side/target/stress/$report" "paired/$side/$n/$report"
              fi
              echo "::endgroup::"
            done
          done
          python3 new/scripts/stress_paired.py paired
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-paired-${{ matrix.scenario }}
          path: paired/
          if-no-files-found: warn

  # Chaos on kind (M5.3f, scripts/kind_chaos.py): a kind cluster of three nodes on this commit's
  # images, a seeded schedule of faults under load, checked on guarantees only. The seed is the
  # run's number (each night another schedule) and printed; the record is uploaded every time: a
  # failure is read from it, the seed repeating the schedule but not the cluster's timing.
  chaos:
    needs: plan
    if: github.event_name == 'schedule' || inputs.chaos_seeds != '' || (inputs.filter == '' && inputs.base == '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    name: chaos seed ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      # Ours, not whatever the runner's image has: kind's release names its node image by digest
      # (kindest/node v1.37.0), and kubectl is of the same minor.
      - name: kind and kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/bin/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/bin/kubectl" \
            https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          sha256sum --check --strict <<SUMS
          aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/bin/kind
          c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4  $RUNNER_TEMP/bin/kubectl
          SUMS
          chmod +x "$RUNNER_TEMP/bin/kind" "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # This commit's: its CI run's wheel and docs, as the release workflow builds its images.
      - name: This commit's CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push's run of this repository only: a pull request's builds another tree (agy's
          # review of M5.3f).
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=10" \
            -q "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\")][0].id // empty")
          [ -n "$run" ] || { echo "no passing CI run of a push of $GITHUB_SHA"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-linux-x86_64
          path: dist
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
      - name: This commit's images
        run: |
          scripts/docs-dist.sh site
          for image in schedr schedr-server; do
            docker build -q -f "images/$image/Dockerfile" -t "localhost/$image:commit" .
          done
          echo "IMAGE=localhost/schedr:commit" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=localhost/schedr-server:commit" >> "$GITHUB_ENV"
      - name: Chaos, seed ${{ matrix.seed }}
        env:
          SEED: ${{ matrix.seed }}
        run: CONTAINER=docker python3 scripts/kind_chaos.py run --seed "$SEED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chaos-record-${{ github.run_number }}-seed-${{ matrix.seed }}
          path: target/kind-chaos
          retention-days: 14


  # The clock simulator's master side with 600 fresh scenarios every night, whether main changed
  # or not (each push runs the same dozen): the faults that break a rule need rare timings
  # (B234 came from 60). A failure prints the smallest scenario.
  # Not when chosen scenarios are run by hand (the user, 2026-11-24: "it runs every single time").
  simulator:
    if: github.event_name == 'schedule' || (inputs.filter == '' && inputs.chaos_seeds == '' && inputs.base == '')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.149
      - name: Clock simulator, 600 scenarios
        env:
          PROPTEST_CASES: "600"
        run: >-
          cargo nextest run -p schedr-agent --test clock_sim --no-capture
          -E 'test(the_master_and_its_workers_keep_the_rules_whatever_the_faults)'
