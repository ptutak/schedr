summary = '''
A deterministic simulator in `crates/schedr-agent/tests/clock_sim.rs` runs the master's core and dispatcher and
the worker's master-time bound and cutoff on virtual clocks, proptest choosing delays, pauses,
drift, restarts, takeovers and incarnations. It checks four rules: no attempt starts after the
master expired it; no attempt stays open for ever; no retry within a replaced incarnation's
hold; a moved cleanup never runs beside the worker it left. Not chosen: the full stack under
tokio's paused time; fewer rules.
'''
