title = "A worker leaves a master that accepts it and says nothing: connecting and registering have limits"
date = 2026-11-25
by = "user"
status = "active"
topic = "workers"
section = "Identity and connection"
summary = '''
Connecting to the master has a limit (5 s, shared among its addresses; never more than a quarter of the
worker lease), and so has opening a stream and being registered on it, lease known or not: 10 s,
doubling after each try that ended silent, up to 8 times (a master registers behind its round). Only
waits end by it; a `Registered` that arrived is judged by the lease (decision 281). The master doesn't
register a worker that left while it waited for the core's lock; what its journal reported as started
stays known for its next try. Not chosen: HTTP/2 keepalive with it (B301, M5.3g: an open connection
dead without a word); a limit on the first registration alone.
'''
