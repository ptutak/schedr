[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Piotr Tutak <piotr.tutak@amartus.com>"]

[workspace.dependencies]
schedr-model = { path = "crates/schedr-model" }
schedr-proto = { path = "crates/schedr-proto" }
schedr-config = { path = "crates/schedr-config" }
schedr-db = { path = "crates/schedr-db" }
schedr-master = { path = "crates/schedr-master" }
schedr-agent = { path = "crates/schedr-agent" }
schedr-api = { path = "crates/schedr-api" }

# Third-party crates: versions live here only (see PROJECT.md, Repository and tooling: Libraries).
figment = { version = "0.10.19", features = ["toml", "parse-value"] }
jiff = { version = "0.2.38", features = ["serde"] }
schemars = { version = "1.2.3", features = ["jiff02"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# Test-only crates (see PROJECT.md, Repository and tooling: Testing).
insta = { version = "1.49.0", features = ["json"] }
pretty_assertions = "1.4.1"
rstest = "0.28.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
