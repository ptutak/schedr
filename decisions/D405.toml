title = "The scheduler skips fire times another run covers"
date = 2026-11-09
by = "user"
status = "active"
topic = "runs"
section = "Backfill"
summary = '''
The scheduler creates no scheduled run for a fire time with a successful, queued or running run of
any kind (a backfill's, a manual one): D400's rule the other way, so a period isn't run twice.
Covered fire times take no place, and with `catchup` the ones after them follow. A covering run
that fails later leaves its day without a scheduled run: it is rerun by hand.
'''
