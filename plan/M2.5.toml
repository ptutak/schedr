[[steps]]
id = "M2.5.3"
title = "Fork server, runner side"
scope = '''
`python -m schedr.runner fork_server`: preload, the single-thread check, `gc.freeze()`, forking on request through a shim per task (decision 13A: `process_started` / `process_exited` on a status socket, the process reaped after the agent closes it; 14A: its usage and `core_dumped` reported); the task gets its channel and output pipes by `SCM_RIGHTS`, `setpgid(0, 0)`, its environment (the time zone, locale and temporary directory taken again from it) and directory, the fork server's sockets closed (a preloaded library's descriptors kept), `random` reseeded, and runs the normal `task` / `parse` code; the messages in `schedr-model`
'''
done_when = "Python unit tests, including fork safety"
status = "done"
done = 2026-10-27
commits = ["ce77137"]

[[steps]]
id = "M2.5.4a"
title = "Fork server, agent side"
scope = '''
(decision 17A: M2.5.4 split in two): two fork servers per interpreter started with the worker (preloaded and bare), fork requests, the fallback chain (preloaded, bare, spawn), restart with backoff (1 s doubling to 5 min, reset after 10 min up), the version check, `start_method: fork`, the shim's status socket (the PID after `process_started`; a shim closing it without `process_exited`: the group killed and the attempt failed with an unknown status, or, before `process_started`, a fallback), the watchdog without the RSS fallback for forked tasks, metrics (`schedr_worker_fork_servers{interpreter, kind, state}`, `schedr_worker_fork_fallbacks_total{interpreter, reason}`), the macOS warning
'''
done_when = "tasks start forked on Linux; every fallback tested"
status = "done"
done = 2026-10-27
commits = ["0b87051"]

[[steps]]
id = "M2.5.4b"
title = "What the master stores"
scope = '''
`process_exited`'s `usage` and `core_dumped` sent in `Finished`, stored with the attempt and shown in the attempts API (14A); spawned processes' usage from the zombie's `/proc` before reaping (18A: CPU and faults; peak RSS and context switches null); worker `warnings` (`[{kind, interpreter, message}]`) in the protocol, the REST API and `schedr workers list`
'''
done_when = "usage and warnings visible in the API and CLI"
status = "done"
done = 2026-10-27
commits = ["3d748ea"]

