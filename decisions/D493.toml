title = "Tunable constants are hidden settings"
date = 2026-11-15
by = "user"  # user, claude
status = "active"  # active, superseded, dropped, untraced
topic = "configuration"  # a topic of design/README.md
section = "Timings and limits"  # the subheading of the topic's page it goes under
summary = '''
Every constant that a deployment could need to change and that no key covers is a
`SCHEDR_HIDDEN__<SECTION>__<NAME>` timing or limit, its default unchanged: 11 timings and 30
limits from the sweep of 2026-11-15 (the master's per-round and per-pass caps, the worker's
journal groups and resends, the event backlogs, the Metrics cache, the client's timeouts, the
code retry). A constant stays in the binary only for a reason
the journal lists: the data format or protocol, a database's parameter limit, the system, a
contract users see, a value it derives from, display, or a task's process before any
configuration. A hidden limit is 1 to 16,777,216 and a timing at most 3650 days; the rollup
grace must be shorter than `WEBSERVER__METRICS_FINAL_AFTER` and, with its 15-minute window,
than `MASTER__SAMPLES_KEPT` (Codex's review of M5.1p).
'''
