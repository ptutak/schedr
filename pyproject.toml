[project]
name = "schedr"
version = "0.1.0"
description = "Python API for the schedr scheduler (Airflow-style DAGs)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Piotr Tutak", email = "piotr.tutak@amartus.com" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/schedr"]

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["python"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "C4",       # comprehensions
    "PL",       # pylint
]

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = ["PLR2004"]

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "python"
packages = ["schedr"]

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["integration: tests that spawn processes or touch the filesystem"]

[tool.coverage.run]
source = ["schedr"]
branch = true
