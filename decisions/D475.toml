summary = '''
`schedr.airflow` (Airflow's names over the native API at parse time) is dropped: a converted
DAG has no runtime tie to Airflow's API. The layer's translation rules (schedules, trigger
rules, short-circuit, resources for `all_done` and teardown) become the tool's. The principle
stays: the native API never changes for Airflow; what it can't express exactly is reported.
