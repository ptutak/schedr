[[steps]]
id = "M5.2i14"
title = "A worker's identity bound to its certificate, standalone's ports under in-memory mTLS, and the trust model"
scope = '''
(the user, 2026-11-22: "if there is some kind of malicious activity on the worker node it can probably access mTLS worker certificate, so probably we have to consider a worker a trusted domain"; "encrypting extension - worker traffic won't help, if someone can already access mTLS"; then "A i14 slimmer") schedr trusts its nodes by design: a compromised node is out of scope, and so is defending it (no encryption of the plugin's local link, no in-memory database, no plugin as its own OS user). Three things: (1) a worker's identity bound to its certificate: verify how the master binds a `Register`'s worker ID to its peer certificate (`[tls] worker_name` is one name for all workers) and, if it doesn't, bind it (the ID in the certificate's name, checked at registration), so one worker's certificate can't act as another worker; every master-side action a worker takes (results, cancels, cleanups, parse uploads, inputs, API calls as a task, notifications) checked to be on its own attempts and roots; (2) standalone's localhost ports (the master's gRPC port, the worker's log endpoint) closed with mTLS made in memory at each start (option A): a CA and the master's, worker's and log endpoint's certificates generated in the process, never written to disk, new at each restart (rotated in the process if long-lived), so another user of the host or a pod's sidecar can't register or read logs; first checked what they can do today, and beside it what they can't read (the user, 2026-11-22: "strengthening ports won't help if someone can access database sqlite or postgres credentials"): the data directory, the SQLite file and the config or password files checked private (0700 / 0600), made so at start where schedr creates them, a warning for one others can read; (3) the trust model written in the guide (the user, 2026-11-22, asking whether extension and runner links need the same: they are inherited socket pairs, no port): schedr's local links are inherited descriptors, never ports (the runner, fork servers, task-ctx, plugins, a shell plugin's script), and the cleanup barrier's socket file (a 0700 folder in `$TMPDIR`, D504) weighed against a socket pair, a shared `/tmp` with a same-UID sidecar its one exposure; the ops port (health and `/metrics`, extension labels included) said to be readable by whoever reaches it; what schedr trusts (its nodes, their keys), what it guarantees (a worker acts only on its own attempts; links mTLS; the UI-webserver link proven), what it won't do by design and why, and how to run a controller for a larger system (its own deployment; standalone with this mTLS; least privilege at the controlled service; certificate rotation through the files' reload). Before M5.2i9, so the service starts under these rules; a Grok security review
'''
done_when = '''
a test proving one worker's certificate can't register as, report for or cancel another worker's attempts; a test proving a client without standalone's in-memory certificate can't reach its gRPC port or log endpoint; the trust model's page in the guide; a Grok security review
'''
status = "done"
done = 2026-11-22

