section = "Database and schema"
summary = '''
A master, webserver or standalone that can't reach its database at its start waits for it
instead of exiting: while connecting or reading the schema fails transiently
(`DbError::is_transient`: a time limit, a connection refused or lost, the database starting,
busy, out of connections or a statement timeout), it tries again every
`SCHEDR_HIDDEN__WEBSERVER__SCHEMA_RETRY` (5 s), its `/readyz` "starting", until a stop is asked
for, which also cuts a try in progress. A wrong host or port waits the same way, so a warning
names where it looks (`database_place`, as sqlx reads the URL: host and port, a socket or the
file) and why (`DbError::waiting_reason`: codes, never the server's text), never the user or
password, at once and every minute while waiting. A wrong password, TLS setting or URL exits at
once. Not chosen: exiting and leaving restarts to a supervisor (CrashLoopBackOff kept a
master down minutes after its database came back); giving up after a bound.
'''
