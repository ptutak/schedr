section = "Memory and environment"
summary = '''
An internal `schedr task-exec --data-limit N -- <program>` sets the data limit (`RLIMIT_DATA`,
D438) on its own process and executes the task's program in its place (built in M4.15a). A capped
Python task is spawned through it, never forked: a fork-server child setting its own limit was
not built (Claude's choice in M4.15a: one path, the fork's faster start given up for capped tasks
only).
