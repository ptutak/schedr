summary = '''
A per-task cleanup without its own timeout uses `[worker] cleanup_timeout`; the DAG
JSON omits `timeout_ms` and the worker supplies it. Resource cleanups instead default
to `[worker] resource_cleanup_timeout`, 30 minutes per try.
