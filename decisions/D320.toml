summary = '''
A watcher host holds one interpreter and set of root copies; new code uses a new host. Pokes move
between calls after successful preparation, preserving deadline and retries, or remain on old code
with a logged reason; full-control sensors remain until completion. Old hosts exit when empty, and
memory_budget covers all worker hosts.
