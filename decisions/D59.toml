topic = "serialization"
summary = '''
Pydantic model descriptors store JSON Schema: serialization schemas with all fields required for
outputs, validation schemas for parameters. Python compares these with model, dataclass and plain
types; Rust stores them. Compatibility requires proof that every output value is accepted;
uncomparable constructs require identical schemas, references are followed, and errors name the
field and constraints.
'''
