summary = '''
Of an attempt's statuses in one write of the master's writer, consecutive ones with the same
phase are stored as the newest; every change of phase is kept. Not the newest status per
attempt per write (it lost phases: `preparing, copying, done` stored as `preparing, done`), nor
no coalescing (up to ten rows a second per attempt, pushing the history's middle out of its 100).
'''
