[[steps]]
id = "M5.2i"
title = "A hole for closed-source extensions: an opaque task kind run by a closed worker"
scope = '''
(the user, 2026-11-19) a way to extend schedr with closed-source plugins: a closed worker (a fork of `schedr-agent`, allowed by the MIT licence, or its own implementation of the worker protocol) plus a closed Python package, with the master generic and plugin-free. Findings (read 2026-11-19): `TaskKind` (`schedr-model/src/task.rs:273`) is a serde enum tagged by `"kind"`, so an unknown kind fails the whole DAG file: there is no hole yet; the SDK writes each kind as JSON (`python/schedr/_model/tasks.py`); the master stores the DAG as JSONB `dag_json` and sends the task to the worker as `task_json` bytes (`master.proto` `AssignTask`), so the transport is already opaque; routing is by queue only; worker capabilities are checked two ways today: a script's interpreter by the worker (`REJECT_REASON_INTERPRETER_UNDEFINED`), secret storages at validation from the parsing worker's `Register` (`validate.rs:1646`). A closed package whose tasks are Python functions (`@acme.spark_job` wrapping a `@task`) needs nothing from schedr: the open worker runs it where the package is installed; an extension kind is for what the open runner can't run (another runtime, a remote service, GPUs). Proposal: (1) `TaskKind::Extension { name, version, payload }`, the payload stored and sent as it is; on the master an ordinary slotted task (retries, timeouts, cleanups, the UI as for any task); the open agent rejects it; the compiler's exhaustive matches (`attempt.rs`, `validate.rs`, `task.rs`, `progress.rs`) each given an arm; (2) `Register.extensions` (`{name, versions}`, field 17, in protocol 2.2, unreleased); validation warns when no worker offers a DAG's extension and version, as for secret storages; (3) `REJECT_REASON_EXTENSION_UNDEFINED`, a worker without it rejecting the task as for a missing interpreter; (4) the SDK's public `ExtensionTask(name, version, payload, queue=...)`, a closed package's decorators built on it; routing through queues (the closed worker serves its own queue, the package's decorators default to it). Later, only if wanted: routing by capability inside one queue (open and closed workers mixed); an event stream and decision hooks for master-side extensions (audit, quotas, auth, enterprise secrets) over an out-of-process gRPC plugin protocol. Each of these the user's decision before building Decided (the user, 2026-11-20): a worker announces its extensions at registration (`Register.extensions`, validation warning when none offers one, `REJECT_REASON_EXTENSION_UNDEFINED`), routing by queue; versions matched exactly; the payload is JSON under the DAG's limits and the output typed as for any task. The kind (the user, 2026-11-20: C, over a closed worker forked from the agent): `TaskKind::Extension { name, version, payload }` run by a **plugin executable the open worker starts and supervises** as it does the Python runner (timeout, cancel with SIGTERM then SIGKILL after the grace, the memory watchdog, stdout and stderr into the log, the `SCHEDR_*` variables), so no fork of the worker. (1) A worker knows its plugins from its config (a path and the versions each serves), and by opt-in discovery (`[extensions] discover = true`: each `schedr-ext-*` on `PATH` run with `--describe`), config winning where both name one; what it knows is what `Register.extensions` announces. (2) The plugin speaks the runner protocol (`schema/runner.schema.json`) over the inherited socket (`SCHEDR_AGENT_FD`), with a new `extension_task` request and a first handshake naming the protocol version it speaks (the worker refusing one it doesn't); it may ask what the Python runner may (secrets and connections it declared, API calls, handles) and ends with `task_succeeded` or `task_failed`. (3) For plugin authors: a Python helper (`schedr.extension`) and a published Rust crate of the protocol's types and loop (the types are `schedr-model`'s `runner`), an example plugin, and a worker test with it. Both forms built (the user, 2026-11-20): the package declares its slot, `task` (its own process, any language) or `watcher` (a Python module the watcher host imports by entry point, run like a wait step); `Register.extensions` carries the slot and the master counts the task in it; the contract is the messages, the Python helper's API a coroutine (`async def run(request, channel)`) its `main` runs in a process. A cleanup for both forms: handles registered while it runs (from a process or the host's channel), and after any end, a lost worker's too, the plugin run again with them (`extension_cleanup`), always as a process: what a `@sensor` lacks (no `cleanup=` or handles, decision 323), so the watcher form stays beside it (the user). A dummy extension in Python (the user, 2026-11-20: to see how one behaves), usable from `make standalone` in either slot: its payload says what to do (sleep, write log lines, read a declared secret, return a typed value, fail, or hang until cancelled), with a DAG in the examples showing each. Not chosen: A, a closed worker (a fork of the agent to keep in step with each release); B, Python `@task` only; D, both A and C Corrected (2026-11-20, decision note 15): no watcher-slot form; a plugin is always its own process in a task slot. Settled before building (the user, 2026-11-20): the config is `[extensions.<name>]` (`command`, a list; `versions`) beside `[extensions] discover = false`, `discover` refused as a name, as `default` is among secret storages; `--describe` prints one JSON line `{"name", "versions", "protocol"}`, a plugin failing or taking over 5 s skipped with a warning, the worker starting anyway; the Rust crate is `schedr-extension`, built and tested in the workspace, published at R1.2 with the user's word. Added (the user, 2026-11-20): the Rust `hello-plugin` beside the Python dummy in `make standalone` and `standalone-separate-ui` (built, configured by path), with a DAG running both, to present plugins in more than Python.
'''
