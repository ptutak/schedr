title = "Performance, metrics, Airflow migration tools"
order = 80
done_when = "Not set yet (archive/PROJECT.md, Roadmap)."
notes = '''
Two parts (the user, 2026-11-13): M5.1, performance (M5.1a-f) and metrics in the UI (M5.1g-l),
with the worker's start time (M5.1m); then release 1.1.0 (R1.1); then M5.2, the Airflow
migration tool (decisions 470-475), converting Airflow 2 and 3 DAG files into native ones once.
The look-alike layer is dropped (decision 475).

First, the start path (the user, 2026-11-11, after 1.0.0): M4B's stress comparison (guide,
Stress tests, After M4B) made finishing faster and starting slower (assigned → started p99 up
66-114 % in scenarios 9 and 13, stress 23's 500 starts in 25.7 s against its ends in 4.8 s).
Profile first; the other four steps follow what it finds.

Reordered (the user, 2026-11-13) after Grok's study (session d12a2612): profile and fix the
stress clock, then the worker's start journal in groups (measured about 4x, the worker only),
then the master's core lock between a turn's groups, then the pooler, the turn size, and the
idle cost (a standalone measured at about 22 queries a second with nothing to do).

Then metrics in the UI (the user, 2026-11-13, decisions 462-467), M5.1g-M5.1l, before the
Airflow layer, so the Metrics page can also show where a start's time goes (M5.1a's stages).
The Status block (M5.1g) needs no protocol or schema change; the rest needs a protocol field
(minor version) and new migrations on both databases. No OpenTelemetry (decision 386); no
Grafana dashboards for now.
'''

[[steps]]
id = "M5.1a"
title = "Profile the start path"
scope = '''
timers for each stage: on the worker, `AssignTask` received to `Started` sent, the start journal write, the `Spawned` record; on the master, the wait for the core lock against the time inside a turn, by `started` and `finished`, with the messages counted. Stress 23's `all_in_s` fixed: the time taken before its 5 s settling sleep, the watcher slots gauge set when a wait step is noted instead of in the 5 s alive tick. Run under a burst (stress 23, scenario 13) on this laptop
'''
done_when = '''
a written breakdown of assigned → started p50/p99 by stage, from a run with these timers, in the stress guide; `all_in_s` measures the starts only
'''
status = "done"
done = 2026-11-13

[[steps]]
id = "M5.1b"
title = "Start journal records in groups"
scope = '''
the agent's start records (`journal_start`) and a wait step's watcher-host record (`Spawned`) written in groups like its finishes (`write_many`: the files flushed together, the directory once), a burst of `AssignTask`s gathered, its `Started`s sent after the group is on disk; one at a time today, each a file and a directory fsync awaited on the agent's loop
'''
done_when = '''
stress 23 starts its 500 wait steps in under 10 s by the corrected `all_in_s` (25.7 s after M4B, with the sleep and the gauge's lag); a crash test: no `Started` sent for a record not on disk, a group lost whole on recovery
'''
status = "planned"

[[steps]]
id = "M5.1c"
title = "One inbox for all workers"
scope = '''
(decisions 468, 469) the stream readers feed one inbox; a turn takes messages from all workers up to a limit per turn and per worker: every worker's `Started`s in one transaction, then every worker's `Finished`s, then heartbeats and warnings together (set-based), then barriers worker by worker, the core's lock released between phases. Each worker's order kept, a barrier holding back only its worker, each message checked against its own stream (B44), a failed phase redone worker by worker, then one by one. And the round lets go of the lock between its batches of assignments (decision 469): with one worker the round is what a `Started` waits for (M5.1a). Reviewed by Grok in paranoid mode
'''
done_when = '''
assigned → started p99 in scenarios 9 and 13 within their range before M4B over four alternating runs (scenario 13 3.1-4.8 s; the single runs' 2.1 s and 1.8 s the aim), M4B's throughput kept or better; commits per second under stress 1 counted before and after; tests for each rule (order per worker, a barrier, a replaced stream, a failed phase, fairness) on both databases
'''
status = "planned"

[[steps]]
id = "M5.1d"
title = "Pokes and rounds through PgBouncer"
scope = '''
statements counted per transaction on Postgres behind PgBouncer after M5.1c's turn across workers; then set-based where the count still points: assignment's per-item claim, `try_number` and insert, `first_start` once per sensor instead of twice, a wait step's per-item finish reads (`count_strike`, `run_dag`, `clear_wait_step`); `ready_instances` reading only what a round can assign, cleanups still first
'''
done_when = '''
pokes p99 under 7 s (11.1 s after M4B); scenario 6's round p99 at scenario 1's
'''
status = "planned"

[[steps]]
id = "M5.1e"
title = "The turn size from data"
scope = '''
after M5.1c: the turn's limit and the limit per worker compared in one stress session (10, 20, 40, 80 and more messages a turn; `SCHEDR_HIDDEN__MASTER__MESSAGES_PER_TURN`)
'''
done_when = '''
the default set from the measured trade-off between start latency and throughput, the numbers in the stress guide
'''
status = "planned"

[[steps]]
id = "M5.1f"
title = "The idle cost"
scope = '''
a standalone with nothing to do (measured 2026-11-13 on the examples' DAGs, SQLite): about 22 queries a second (6,724 in 5 min; the master's 1 s tick reads commands, queued runs, retries and ready tasks each time, about 14 kinds), in the 1.0.0 release build 1.9 % of a core, 44 wakeups a second and 1.3 MiB written to disk in 3 min (about 0.6 GiB a day), 46 MiB resident (the debug build 5.2 %, 51 wakeups a second, 96 MiB); the fork servers idle. Work skipped when nothing changed (the change notifications, or a mark the writers set), the polls that remain at their own slower pace
'''
done_when = '''
an idle standalone's queries, wakeups and CPU measured before and after over 10 minutes (release build), the polls left each with a reason, the numbers in the guide; no start, round or trigger latency lost (stress 1, 9, 23)
'''
status = "planned"

