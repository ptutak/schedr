// The schedr master <-> worker agent protocol (see PROJECT.md, Master–worker protocol, Worker
// lifecycle, Task assignment, Task rejections).
//
// Workers always open the connection. The package carries the protocol's major version; the
// minor version is exchanged in Register (same major, equal or lower minor is accepted).
// Within a major version changes are additive only.

syntax = "proto3";

package schedr.protocol.v1;

import "google/protobuf/timestamp.proto";

service Master {
  // The long-lived control stream, one per worker. The first message is Register.
  rpc Control(stream WorkerMessage) returns (stream MasterMessage);
  // A parse job's result (bulky, so a call of its own rather than the control stream): a
  // ParseResult header (no files), then one ParsedFile per message, so only one file's size
  // counts against the master's message limit, not the root's (B35).
  rpc UploadParseResult(stream ParseResultPart) returns (ParseResultAck);
  // An attempt's inputs when they are too big to travel inside AssignTask.
  rpc FetchInputs(FetchInputsRequest) returns (stream InputChunk);
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// ---------------------------------------------------------------- worker -> master

message WorkerMessage {
  oneof message {
    Register register = 1;
    Heartbeat heartbeat = 2;
    CodeVersionChanged code_version_changed = 3;
    Started started = 4;
    Rejected rejected = 5;
    Finished finished = 6;
    Draining draining = 7;
    Deregister deregister = 8;
    Warnings warnings = 9;
    ConnectionJobDone connection_job_done = 10;
    TaskEnded task_ended = 11;
    HandlesAdded handles_added = 12;
    TriggerEvent trigger_event = 13;
    TriggerStopped trigger_stopped = 14;
    TriggerPoked trigger_poked = 15;
  }
}

// What a trigger found: the master stores it, starts a run for a new key, and acknowledges.
// Sent again until acknowledged: repeated keys are dropped.
message TriggerEvent {
  string dag_id = 6;
  string instance_id = 1;
  // Counts this instance's events, for the acknowledgement.
  uint64 seq = 2;
  string key = 3;
  bytes data_json = 4;
  optional google.protobuf.Timestamp at = 5;
}

// A trigger ended on this worker: it raised, its generator returned, or it was stopped.
// How a poke trigger's calls have gone: sent when that changes, and with a heartbeat if not.
message TriggerPoked {
  string dag_id = 1;
  string instance_id = 2;
  google.protobuf.Timestamp at = 3;
  // Why the last call failed; "" when it went well.
  string error = 4;
  // Its failures in a row.
  uint32 failures = 5;
}

message TriggerStopped {
  string dag_id = 4;
  string instance_id = 1;
  // "" when it was asked to stop.
  string error_kind = 2;
  string message = 3;
  // It got its host killed: counted as a sensor's strike, on the code it ran.
  bool struck = 5;
  string code_hash = 6;
}

enum RootKind {
  ROOT_KIND_UNSPECIFIED = 0;
  ROOT_KIND_DAG = 1;
  ROOT_KIND_SCRIPT = 2;
}

message RootHash {
  RootKind kind = 1;
  string root = 2;
  string content_hash = 3;
}

enum JournalState {
  JOURNAL_STATE_UNSPECIFIED = 0;
  // The attempt is still running on the worker.
  JOURNAL_STATE_RUNNING = 1;
  // The attempt finished; its result is journaled but not acknowledged yet.
  JOURNAL_STATE_FINISHED = 2;
}

message JournalEntry {
  string attempt_id = 1;
  JournalState state = 2;
  // How many cleanup handles the journal holds for it (B169).
  uint32 handles = 3;
}

// Sent on every connect.
message Register {
  string worker_id = 1;
  // A UUID generated each time the agent process starts.
  string incarnation_id = 2;
  ProtocolVersion protocol = 3;
  string schedr_version = 4;
  repeated string queues = 5;
  uint32 slots = 6;
  // host:port of the worker's log endpoint.
  string log_endpoint = 7;
  repeated RootHash roots = 8;
  repeated string secret_storages = 9;
  repeated JournalEntry journal = 10;
  // The process the worker runs in (shared with a master in standalone), for the Deployments
  // page; empty from an older agent.
  string process_id = 11;
  // The worker's effective configuration as JSON, masked by the worker (no secret in clear);
  // empty from an older agent.
  string config_json = 12;
  // Its slots for wait steps, apart from `slots` (`[watchers] slots`).
  uint32 watcher_slots = 13;
  // Its triggers still running, from before this session, by instance.
  repeated string running_triggers = 14;
}

message Heartbeat {
  // Its triggers running, by instance: one the master doesn't know of any more is stopped.
  repeated string running_triggers = 5;
  uint32 free_slots = 1;
  repeated string running_attempt_ids = 2;
  uint32 free_watcher_slots = 3;
  repeated WatcherHost watcher_hosts = 4;
}

// A process running a worker's wait steps, or a code set whose hosts were lost: for people.
message WatcherHost {
  // The code it runs: its folders' names, the copies' hashes.
  string code = 1;
  uint32 wait_steps = 2;
  // Its process's threads, the wait steps' among them.
  uint32 threads = 3;
  // Those a wait step is tied to: running its `to_thread` calls, or started by it.
  uint32 tied_threads = 4;
  uint64 memory_bytes = 5;
  // Hosts of this code lost since the agent started: crashes and memory kills.
  uint64 hosts_lost = 6;
}

// A root's content hash changed (after the settle time).
// A root's reported hash changed. An empty `content_hash` withdraws the root: the worker no
// longer offers it (decision 303: a DAG root using a script root it lacks).
message CodeVersionChanged {
  RootHash root = 1;
}

// The attempt was accepted and its process started. Sent before the process exists, with
// `spawn`; a task forked from a fork server sends it again with `fork` once it runs (the master
// keeps the first start time and takes the method).
message Started {
  string attempt_id = 1;
  StartMethod start_method = 2;
}

enum StartMethod {
  START_METHOD_UNSPECIFIED = 0;
  START_METHOD_SPAWN = 1;
  START_METHOD_FORK = 2;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_NO_FREE_SLOT = 1;
  REJECT_REASON_DRAINING = 2;
  REJECT_REASON_INTERPRETER_UNDEFINED = 3;
  REJECT_REASON_SCRIPT_ROOT_UNKNOWN = 4;
  REJECT_REASON_SCRIPT_REFERENCE_NOT_FOUND = 5;
  REJECT_REASON_DAG_FILE_MISSING = 6;
  REJECT_REASON_MEMORY_BUDGET_TOO_LARGE = 7;
  REJECT_REASON_DISK_NOT_WRITABLE = 8;
  REJECT_REASON_INVALID_SPECIFICATION = 9;
  // The worker's code of the task's root isn't the hash the master expects (it hasn't synced
  // yet, or synced past it): "code not there yet".
  REJECT_REASON_CODE_MISMATCH = 10;
}

message Rejected {
  string attempt_id = 1;
  RejectReason reason = 2;
  // A human-readable detail, e.g. "interpreter `etl-venv` not defined on worker-1".
  string detail = 3;
}

enum AttemptStatus {
  ATTEMPT_STATUS_UNSPECIFIED = 0;
  ATTEMPT_STATUS_SUCCESS = 1;
  ATTEMPT_STATUS_FAILED = 2;
  ATTEMPT_STATUS_TIMED_OUT = 3;
  ATTEMPT_STATUS_OOM_KILLED = 4;
  ATTEMPT_STATUS_CANCELLED = 5;
  ATTEMPT_STATUS_INTERRUPTED = 6;
  ATTEMPT_STATUS_LOST = 7;
  ATTEMPT_STATUS_ASSIGNMENT_EXPIRED = 8;
}

message Finished {
  string attempt_id = 1;
  AttemptStatus status = 2;
  optional int32 exit_code = 3;
  optional int32 signal = 4;
  // On success: the output as tagged JSON (schedr-model), and its outcome name.
  bytes output_json = 5;
  string outcome = 6;
  // How long the process ran (the agent's monotonic clock); absent if it never started.
  optional uint64 duration_ms = 7;
  uint64 peak_memory_bytes = 8;
  // For failures schedr recognises, e.g. "secret_not_found"; empty otherwise.
  string error_kind = 9;
  // A structured error summary as JSON; empty if none.
  bytes error_summary_json = 10;
  // The content hash of the code the attempt ran with.
  string code_hash = 11;
  // What the process used, with the children it reaped (its parent's view at its exit);
  // absent if it couldn't be read.
  optional ProcessUsage usage = 12;
  // Whether it dumped core (ended by a signal).
  bool core_dumped = 13;
  // How the task's cleanup ended; absent for a task without one.
  optional CleanupResult cleanup = 14;
  // A wait step (decision 338): whether it got its host killed.
  bool wait_step = 15;
  bool struck = 16;
}

// A task with a cleanup: its process ended and the cleanup starts (decision 229). `Finished`
// follows, with the same result and the cleanup's.
message TaskEnded {
  Finished result = 1;
}

// Cleanup handles an attempt registered, already masked, for a cleanup on another worker
// (decision 242): sent as they are registered, all of them again after a reconnect.
message HandlesAdded {
  string attempt_id = 1;
  // The registration order of the first; the others follow it.
  uint32 first = 2;
  // Each a schedr-model CleanupHandle as JSON.
  repeated bytes handle_json = 3;
}

enum CleanupStatus {
  CLEANUP_STATUS_UNSPECIFIED = 0;
  CLEANUP_STATUS_OK = 1;
  CLEANUP_STATUS_FAILED = 2;
  // The attempt's process never started: nothing to clean up (decision 216).
  CLEANUP_STATUS_NOT_NEEDED = 3;
}

message CleanupResult {
  CleanupStatus status = 1;
  // How many tries it took; 0 if it didn't run.
  uint32 tries = 2;
  // As `Finished`'s, of its last try.
  string error_kind = 3;
  bytes error_summary_json = 4;
  // How long its tries ran, the delays between them left out.
  uint64 duration_ms = 5;
  // Only of the handles from `JournalDecision.cleanup_from` on (`CLEAN_REST`, B169): added to
  // the attempt's cleanup, never its whole.
  bool rest = 6;
}

message ProcessUsage {
  uint64 user_cpu_micros = 1;
  uint64 system_cpu_micros = 2;
  // Absent for a spawned process (a zombie's memory is gone before it is read).
  optional uint64 peak_rss_bytes = 3;
  uint64 major_faults = 4;
  // Absent for a spawned process (a zombie's /proc has its leader thread's only).
  optional uint64 voluntary_context_switches = 5;
  optional uint64 involuntary_context_switches = 6;
}

// What is wrong with the worker now, all of it: sent after every Register and whenever it
// changes; each replaces the last.
message Warnings {
  repeated WorkerWarning warnings = 1;
}

message WorkerWarning {
  // E.g. "fork_server_disabled".
  string kind = 1;
  // The interpreter it concerns, if any.
  string interpreter = 2;
  // What it means for tasks, for people.
  string message = 3;
}

// SIGTERM received, or an admin drain: stop assigning to this worker.
message Draining {}

// Clean deregistration before the agent exits (or idles after an admin drain).
message Deregister {}

// ---------------------------------------------------------------- master -> worker

message MasterMessage {
  oneof message {
    Registered registered = 1;
    AssignTask assign_task = 2;
    AssignParse assign_parse = 3;
    CancelAttempt cancel_attempt = 4;
    FinishedAck finished_ack = 5;
    ConnectionJob connection_job = 6;
    HeartbeatAck heartbeat_ack = 7;
    ScriptUses script_uses = 8;
    AssignTrigger assign_trigger = 9;
    CancelTrigger cancel_trigger = 10;
    TriggerEventAck trigger_event_ack = 11;
  }
}

// Run a DAG's trigger: `instance_id` names this run of it, and everything it sends.
message AssignTrigger {
  string instance_id = 1;
  string dag_id = 2;
  // Its function, as a schedr-model task.
  bytes task_json = 3;
  DagFileRef dag_file = 4;
  string expected_code_hash = 5;
  // The last key acted on, given back as `after`.
  optional string after = 6;
  uint64 cancel_grace_ms = 7;
  // The connections of its root, as on `AssignTask`.
  bytes connections_json = 8;
  // Its errors in a row so far: a poke's next report goes on from them.
  uint32 failures = 9;
}

message CancelTrigger {
  string instance_id = 1;
}

message TriggerEventAck {
  string instance_id = 1;
  uint64 seq = 2;
}

// Sent as a heartbeat arrives, while this master leads: how a worker tells a silent network from
// a quiet master, with no other message due.
message HeartbeatAck {}

// Timing is owned by the master's configuration so all workers behave the same.
message Timing {
  uint64 heartbeat_interval_ms = 1;
  uint64 lease_timeout_ms = 2;
  uint64 cancel_grace_ms = 3;
}

enum AttemptDecision {
  ATTEMPT_DECISION_UNSPECIFIED = 0;
  // Keep running it.
  ATTEMPT_DECISION_CONTINUE = 1;
  // Already abandoned or reassigned: kill it.
  ATTEMPT_DECISION_KILL = 2;
  // Its result is stored: remove it from the journal.
  ATTEMPT_DECISION_ACK = 3;
  // Ended, its cleanup moved without some of its handles (registered while the master
  // couldn't hear the worker, B169): run the cleanup on its handles from `cleanup_from` on,
  // then send its `Finished`.
  ATTEMPT_DECISION_CLEAN_REST = 4;
}

message JournalDecision {
  string attempt_id = 1;
  AttemptDecision decision = 2;
  // For `CLEAN_REST`: the first handle (in registration order) the moved cleanup didn't have.
  uint32 cleanup_from = 3;
}

message Registered {
  Timing timing = 1;
  repeated JournalDecision decisions = 2;
  // The largest message the master accepts ([master] grpc_max_message_size): the agent turns
  // a result or a parsed file past it into a failure instead of sending it (B33, B35).
  uint64 max_message_size = 3;
  // Which script roots each DAG root uses (decision 304), as ScriptUses.
  repeated RootUses script_uses = 4;
}

// The script roots a DAG root's current parse used (decision 304): a worker folds their hashes
// into the hash it reports for the DAG root (decision 301).
message RootUses {
  string root = 1;
  repeated string script_roots = 2;
}

// Every DAG root's script roots, sent to each worker when they change; it replaces what was
// sent before (a root left out uses none).
message ScriptUses {
  repeated RootUses roots = 1;
}

message RunInfo {
  string run_id = 1;
  // A schedr-model RunKind name: "scheduled", "manual", "backfill", "chained", "event".
  string kind = 2;
  google.protobuf.Timestamp planned_for = 3;
  google.protobuf.Timestamp since = 4;
  string dag_id = 5;
  // The run's parameters as stored JSON (decision 138); empty when the DAG takes none.
  bytes params_json = 6;
  // The event that started it, as schedr-model `RunEvent` JSON; empty for other runs.
  bytes event_json = 7;
}

message DagFileRef {
  string root = 1;
  // Relative to the root, `/` separators.
  string path = 2;
}

message AssignTask {
  string attempt_id = 1;
  string task_id = 2;
  // -1 for a task that isn't mapped.
  int32 map_index = 3;
  uint32 try_number = 4;
  RunInfo run = 5;
  // The task as schedr-model JSON (kind, command templates, arguments, settings).
  bytes task_json = 6;
  // Where the DAG is defined (Python tasks import it; it also locates relative paths).
  DagFileRef dag_file = 7;
  // The content hash the master expects; the worker reports what it actually ran.
  string expected_code_hash = 8;
  // The upstream outputs the task uses, as JSON; empty if fetched with FetchInputs.
  bytes inputs_json = 9;
  bool inputs_external = 10;
  uint64 cancel_grace_ms = 11;
  uint64 memory_budget_bytes = 12;
  bool setrlimit = 13;
  // The outcomes of the upstream tasks the task uses, by task ID; "" for one that was
  // skipped (its edges count as not taken: a reference to it stands for null).
  map<string, string> upstream_outcomes = 14;
  // The connections of the task's root (decision 174), as schedr-model Registry JSON: the
  // agent renders one when the task opens it. Empty: none.
  bytes connections_json = 15;
  // Only the cleanup of an attempt whose worker was lost (decision 243), with its handles.
  optional CleanupOnly cleanup_only = 16;
  // The task is a resource's cleanup: without a timeout of its own, it gets the worker's
  // `resource_cleanup_timeout` (it isn't cancelled with its run, decision 277).
  bool resource_cleanup = 17;
}

message CleanupOnly {
  // Each a schedr-model CleanupHandle as JSON, in registration order.
  repeated bytes handle_json = 1;
}

message AssignParse {
  string parse_job_id = 1;
  RootHash root = 2;
}

// `schedr connections check` / `test` (decision 174): one root's connections, rendered or
// opened on this worker beside its tasks (no slot), one job at a time.
message ConnectionJob {
  // The job's ID, answered with.
  string job_id = 1;
  // The root, at the code the worker reported.
  RootHash root = 2;
  // The connections to check, as schedr-model Registry JSON (their files with them).
  bytes connections_json = 3;
  // Set for a test of one connection: open it and run its check.
  optional ConnectionTest test = 4;
}

message ConnectionTest {
  // The connection.
  string name = 1;
  // How long it may take; stopped after.
  uint64 timeout_ms = 2;
}

// A connection job's answer.
message ConnectionJobDone {
  string job_id = 1;
  // Each connection's report, as schedr-model ConnectionReport JSON (never a value).
  repeated bytes report_json = 2;
}

message CancelAttempt {
  string attempt_id = 1;
  // Not cancelled: a drain moves it, so it runs again elsewhere using no retry.
  bool interrupted = 2;
}

message FinishedAck {
  string attempt_id = 1;
}

// ---------------------------------------------------------------- unary calls

message ParsedFile {
  // Relative to the root.
  string path = 1;
  // Each DAG the file defines, as schedr-model DAG JSON.
  repeated bytes dag_json = 2;
  // Set if importing the file failed (including a per-file timeout).
  optional ImportError import_error = 3;
  // Each connection the file defines itself, as schedr-model ConnectionDef JSON (decision
  // 174; never a secret's value).
  repeated bytes connection_json = 4;
  // The script roots its ScriptOperators asked about while it was imported (decision 304).
  repeated string script_roots = 5;
}

// Why a DAG file couldn't be imported (schedr-model ErrorSummary).
message ImportError {
  // The exception's class name; ParseTimeout or RunnerDied when the agent stopped the file.
  string exception = 1;
  string message = 2;
  // The last lines of the traceback.
  string traceback = 3;
}

message ParseResult {
  string parse_job_id = 1;
  string worker_id = 2;
  RootHash root = 3;
  string schedr_version = 4;
  repeated ParsedFile files = 5;
}

// One message of a parse upload: the header first, then the files.
message ParseResultPart {
  oneof part {
    // The job, the root and the versions; its `files` are empty.
    ParseResult header = 1;
    ParsedFile file = 2;
  }
}

message ParseResultAck {}

message FetchInputsRequest {
  string attempt_id = 1;
}

message InputChunk {
  bytes data = 1;
}
