title = "A wait step cannot start a process or thread"
date = 2026-11-06
by = "user"
status = "active"
topic = "wait-steps"
section = "What a wait step may start"
summary = '''
At DAG definition, process and thread creation in the author's code, including its own helpers and
classes, is rejected. Runtime process creation is refused in inherited step contexts, except for the
standard-library `platform`, `ctypes.util` and `uuid` helpers; library threads and
`asyncio.to_thread` are allowed. This is not a sandbox: C code can bypass enforcement. Leftover
asyncio tasks are cancelled and awaited.
'''
