section = "Defining connections"
summary = '''
Connection clients are optional extras; SQL uses psycopg 3/PyMySQL, and SSH requires known hosts
unless explicitly disabled. HTTP supports bearer/basic authentication, headers, CA and client
certificates. Connections are registered per root; checks and tests run on workers. `task_context`
injects client objects, while `run_dag` supplies arguments to the real connection function; async
connections come with M4.10.
'''
