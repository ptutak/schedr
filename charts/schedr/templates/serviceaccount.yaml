{{- if .Values.serviceAccount.create }}
# Holds no permissions: schedr never calls the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "schedr.serviceAccountName" . }}
  labels:
    {{- include "schedr.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
