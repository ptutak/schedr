title = "Distributed"
order = 30
done_when = "Runs on OpenShift with 2 workers and survives killing the master or a worker."
notes = '''
**Goal (PROJECT.md, Roadmap):** schedr runs on OpenShift with 2 workers and survives killing
the master or a worker. M1 built the pieces in single-worker form (the gRPC protocol and
`Register`, the worker registry with spread, change detection and hashing, the journal in
memory); M2 splits the roles and makes every failure path real. Each step brings unit and
integration tests, as since 1.15.


- **Order:** 2.1–2.3 first: separate processes and what survives their deaths are the
  architectural risk. 2.7 includes the log endpoint because a distributed run's logs are on
  the worker (the UI showing them is M3). Auth modes stay in M3. The fork server (M2.5)
  builds on 2.8 and 2.9.
- Open bugs (`BUGS.md`) are fixed when scheduled with the user.

**Status (2026-10-26, end of day): M2's steps 2.1–2.13b are done** (the commits are listed
in `NEXT_SESSION.md`). 2.13's wheel jobs passed in CI at `b3c9c47` (`wheel-linux-aarch64`
4 min 10 s, `wheel-macos-arm64` 5 min 42 s). 2.13b (`f3a8631`) pins CI's supply chain and
builds every wheel through `scripts/build-wheel.sh`; its CI run passed with every job green
(`wheel` 17 min 32 s, `wheel-macos-arm64` 5 min 49 s, `wheel-linux-aarch64` 4 min 23 s).
Today also: B15 fixed (tokio 1.54.1), B21 fixed (the lease tests' query limit),
`scripts/kind-mesh.sh` onto `scripts/kind-lib.sh`. Open bugs: B22 (a draining worker once
missed its 8 s grace under load; not reproduced), B4 (likely B6, unproven).

**Next: M2.5, the fork server and quiet DAGs**, steps planned below (2026-10-27).
'''

[[steps]]
id = "2.1"
title = "Separate roles"
scope = '''
`schedr master`, `schedr worker`, `schedr webserver` as their own processes (from `standalone`'s parts); Postgres at run time; commands picked up by `LISTEN/NOTIFY`, polling as the fallback; refuse an outdated schema
'''
done_when = "the three processes and Postgres on a laptop run the example DAG"
status = "done"
done = 2026-10-22
commits = ["5d6328a"]

[[steps]]
id = "2.1b"
title = "`standalone` in one pod"
scope = '''
(for testing on a cluster): `--listen` for the API, SIGTERM, one standalone per data directory (a lock), the musllinux wheel (Alpine), `examples/kubernetes/` (Alpine `Dockerfile`, a one-replica `StatefulSet` on an RWO volume with git-sync)
'''
done_when = '''
the image runs the example DAG under an arbitrary UID; CI smoke-tests the musllinux wheel on Alpine
'''
status = "done"
done = 2026-10-22
commits = ["54e661d"]
part_of = "2.1"

[[steps]]
id = "2.2"
title = "Worker lifecycle"
scope = '''
incarnation IDs, heartbeats, the 60 s lease, `DISCONNECTED` / `LOST`, reconnect with backoff and jitter, the lease clock restarting after a master restart, the journal decisions (continue / kill / ack) in `Registered`, refusals
'''
done_when = '''
integration tests: a worker dropped and reconnected; a lost worker's attempts retried
'''
status = "done"
done = 2026-10-22
commits = ["61bfd7a"]

[[steps]]
id = "2.3"
title = "Journal on disk"
scope = '''
running attempts and unacknowledged results survive an agent restart; the processes a dead agent left are stopped, and their attempts end `lost` (`WorkerRestarted`, using a retry)
'''
done_when = '''
`kill -9` of the agent, restart: its running attempts lost and retried, finished results not lost
'''
status = "done"
done = 2026-10-22
commits = ["87bbcd2"]

[[steps]]
id = "2.4"
title = "Assignment across workers"
scope = '''
queues (the `default` rule), the rejection table (worker-specific → `unschedulable` with each worker's reason; "code not there yet" retried after 35 s, `unschedulable` after `[master] code_wait`, 10 min), wait reasons on queued tasks, `schedr tasks retry`, `schedr tasks cancel` (any unfinished task)
'''
done_when = '''
tests with two workers serving different queues; a running task cancelled with its downstream
'''
status = "done"
done = 2026-10-22
commits = ["d207fb9"]

[[steps]]
id = "2.5"
title = "Parsing across workers"
scope = '''
one parse per (root, hash, schedr version) by any worker that reported the hash, reassigned after 10 min; **only the newest code runs** (each root's current hash; tasks go only to workers at it, which check it), so workers on older code cause no conflicts; mixed-hash warnings; the rolling-upgrade rule (worker version ≥ the parse's); failures from code that changed under a run say how
'''
done_when = "tests with two workers on different hashes"
status = "done"
done = 2026-10-22
commits = ["3aea937"]

[[steps]]
id = "2.6"
title = "Drain"
scope = '''
SIGTERM and `schedr workers drain` / `resume`; the grace period; interrupted attempts use no retry; a drained worker stays drained across restarts
'''
done_when = '''
tests: a SIGTERM-drained worker's interrupted task runs again without a retry; a drained worker gets no tasks across a master restart
'''
status = "done"
done = 2026-10-22
commits = ["6c75475"]

