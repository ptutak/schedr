section = "TriggerDagOperator"
summary = '''
DAGs may start each other in a cycle, through TriggerDagOperators, `RunOf` triggers or events: no
check follows the chain of parent runs. Inside a DAG a cycle is refused when its file loads: its
tasks depending on each other, a TriggerDagOperator naming its own DAG, `Chained(by=...)` naming
it. A run started by a `RunOf` trigger records the run that started it as its parent, linked both
ways in the UI as a chained run is.
