summary = '''
One sample per process a minute (memory, CPU cores since the last, the container's memory and
limit, a worker's parts and largest tasks) in `samples` (the open `0002` migration), keyed by
process: the leading master writes its masters' and workers' (a standalone one row, its roles
master, worker and webserver), a webserver in a process of its own its own. Each closed
15-minute window is rolled up into averages and peaks; minute rows are kept 24 h, rollups 30 d
(hidden timings), deleted by the sampler. Not chosen: one a minute for 7 days without a rollup.
